<!DOCTYPE html>
<html lang="en">
<head>

  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Quicksand:wght@400;500;600&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Yellowtail&display=swap" rel="stylesheet">

<style>

/* =========================================================
   GLOBAL
========================================================= */

:root{
    --cream:#fff5ec;
    --cream2:#fde3d3;

    --brown:#4b2728;
    --brown2:#673332;

    --pink:#e52f76;
    --pink2:#f36f9d;
    --pink3:#f9aec7;

    --gold:#efb84e;
    --paper:#fffaf5;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#170b11;
}

body{
    font-family:'Quicksand',sans-serif;
}

button{
    font-family:inherit;
}

/* =========================================================
   STAGE
========================================================= */

#stage-frame{
    position:fixed;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#170b11;
}

#stage{

    position:relative;

    width:min(100vw,56.25vh);
    height:min(177.78vw,100vh);

    overflow:hidden;

    background:
        radial-gradient(
            ellipse at 50% 25%,
            #fffdf9 0%,
            var(--cream) 45%,
            var(--cream2) 100%
        );

    box-shadow:
        0 0 70px rgba(0,0,0,.5);
}

/* =========================================================
   SCENES
========================================================= */

.scene{

    position:absolute;
    inset:0;

    opacity:0;
    pointer-events:none;

    transition:
        opacity 1s ease,
        transform 1s ease;
}

.scene.active{

    opacity:1;
    pointer-events:auto;
}

/* =========================================================
   RESTART
========================================================= */

#restartBtn{

    position:absolute;

    top:18px;
    right:16px;

    z-index:999;

    border:0;

    padding:11px 18px;

    border-radius:30px;

    color:white;

    background:rgba(80,45,50,.15);

    backdrop-filter:blur(8px);

    font-size:13px;

    cursor:pointer;

    opacity:.65;

    transition:.3s;
}

#restartBtn:active{
    transform:scale(.94);
}

/* =========================================================
   SCENE 1 — ARCHERY
========================================================= */

#scene-archery{

    background:
        radial-gradient(
            ellipse at 50% 30%,
            #ffe3d0 0%,
            #fdece0 55%,
            #fbdac7 100%
        );
}

#archerySvg{

    width:100%;
    height:100%;

    touch-action:none;
    user-select:none;
}

.archery-caption{

    fill:var(--brown);

    font-family:'Fredoka',sans-serif;

    font-size:32px;

    font-style:italic;

    opacity:.5;

    text-anchor:middle;
}

.archery-hint{

    fill:var(--brown);

    font-family:'Fredoka',sans-serif;

    font-size:24px;

    font-weight:600;

    letter-spacing:.1em;

    text-anchor:middle;

    opacity:.35;

    animation:pulseHint 1.8s ease-in-out infinite;
}

@keyframes pulseHint{

    0%,100%{
        opacity:.2;
    }

    50%{
        opacity:.55;
    }
}

#heartTarget{

    filter:
        drop-shadow(
            0 0 35px rgba(230,50,110,.5)
        );
}

.bow-limb{

    fill:none;

    stroke:#58352d;

    stroke-width:14;

    stroke-linecap:round;
}

#bowString{

    fill:none;

    stroke:#927b68;

    stroke-width:2.5;
}

#arrowShaft{

    stroke:#58352d;

    stroke-width:6;

    stroke-linecap:round;
}

/* =========================================================
   SCENE 2 — TITLE
========================================================= */

#scene-title{

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    background:
        radial-gradient(
            ellipse at 50% 25%,
            #f56b9a 0%,
            #cf185b 58%,
            #8d0d40 100%
        );
}

.title-eyebrow{

    color:white;

    opacity:.75;

    font-family:'Fredoka',sans-serif;

    font-style:italic;

    font-size:15px;
}

.main-title{

    margin:5px 0;

    color:white;

    font-family:'Playfair Display',serif;

    font-size:clamp(48px,14vw,76px);

    line-height:.95;

    text-shadow:
        0 7px 25px rgba(0,0,0,.25);
}

.title-line{

    width:145px;

    height:18px;

    border-bottom:
        3px solid var(--gold);

    border-radius:50%;
}

.title-sub{

    color:white;

    opacity:.75;

    font-family:'Fredoka',sans-serif;

    font-style:italic;

    font-size:14px;

    margin-top:12px;
}

/* =========================================================
   SCENE 3 — TREE
========================================================= */

#scene-tree{

    background:
        radial-gradient(
            ellipse at 50% 18%,
            #fffefa 0%,
            #fff7ef 42%,
            #fde4d3 100%
        );

    overflow:hidden;
}

/* =========================================================
   TREE AREA
========================================================= */

#treeArea{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;
}

/* =========================================================
   TREE SVG
========================================================= */

#treeSvg{

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    overflow:visible;

    pointer-events:none;
}

/* =========================================================
   MAIN TRUNK
========================================================= */

.trunk{

    fill:url(#trunkGradient);

    transform-origin:center bottom;

    transform:scaleY(0);

    transition:
        transform 2.2s cubic-bezier(.18,.85,.25,1);
}

.tree-grown .trunk{

    transform:scaleY(1);
}

/* =========================================================
   BRANCHES
========================================================= */

.branch{

    fill:none;

    stroke:url(#branchGradient);

    stroke-linecap:round;

    stroke-linejoin:round;

    stroke-dasharray:1200;

    stroke-dashoffset:1200;

    transition:
        stroke-dashoffset 1.7s cubic-bezier(.2,.8,.25,1);
}

.tree-grown .branch{

    stroke-dashoffset:0;
}

.branch.main{
    stroke-width:22;
}

.branch.secondary{
    stroke-width:12;
}

.branch.small{
    stroke-width:7;
}

/* =========================================================
   HEART CANOPY
========================================================= */

#heartCanopy{

    position:absolute;

    left:50%;

    top:7%;

    width:94%;

    height:58%;

    transform:
        translateX(-50%)
        scale(.45);

    opacity:0;

    transition:
        transform 1.8s cubic-bezier(.2,.85,.25,1),
        opacity 1.2s ease;

    pointer-events:none;
}

.tree-grown #heartCanopy{

    transform:
        translateX(-50%)
        scale(1);

    opacity:1;
}

/* =========================================================
   HEART PARTICLES
========================================================= */

.canopy-heart{

    position:absolute;

    transform:
        translate(-50%,-50%)
        scale(0);

    opacity:0;

    line-height:1;

    font-family:
        Arial,
        sans-serif;

    filter:
        drop-shadow(
            0 1px 3px rgba(190,30,80,.18)
        );

    transition:
        transform .55s cubic-bezier(.2,1.6,.4,1),
        opacity .35s ease;
}

.canopy-heart.show{

    transform:
        translate(-50%,-50%)
        scale(1);

    opacity:.92;
}

.canopy-heart.soft{

    opacity:.55;
}

/* =========================================================
   TREE TEXT
========================================================= */

#treeText{

    position:absolute;

    left:6%;

    bottom:8%;

    width:52%;

    z-index:50;

    pointer-events:none;
}

.tree-eyebrow{

    margin:0 0 3px;

    color:#5b3731;

    font-family:'Playfair Display',serif;

    font-style:italic;

    font-size:clamp(12px,3.3vw,16px);

    font-weight:700;
}

.tree-title{

    margin:0;

    color:#d21862;

    font-family:'Yellowtail',cursive;

    font-size:clamp(47px,13vw,70px);

    line-height:.85;

    text-shadow:
        0 2px 8px rgba(190,20,80,.12);
}

.tree-sub{

    margin:13px 0 0;

    color:#5b3731;

    font-family:'Playfair Display',serif;

    font-size:clamp(11px,3vw,15px);

    font-weight:700;

    white-space:nowrap;
}

/* =========================================================
   FLOATING HEARTS OUTSIDE CANOPY
========================================================= */

.floating-heart{

    position:absolute;

    z-index:10;

    pointer-events:none;

    opacity:.65;

    animation:
        floatHeart
        6s
        ease-in-out
        infinite;
}

@keyframes floatHeart{

    0%,100%{
        transform:
            translateY(0)
            rotate(-4deg);
    }

    50%{
        transform:
            translateY(-18px)
            rotate(4deg);
    }
}

/* =========================================================
   HEART BURST
========================================================= */

.burst-heart{

    position:absolute;

    pointer-events:none;

    z-index:100;

    animation:
        burst 1.2s ease-out forwards;
}

@keyframes burst{

    0%{
        opacity:1;
        transform:
            translate(0,0)
            scale(.5);
    }

    100%{
        opacity:0;
        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(1.1);
    }
}

/* =========================================================
   SMALL SCREEN
========================================================= */

@media(max-width:380px){

    #treeText{
        left:5%;
        bottom:7%;
    }

    .tree-title{
        font-size:45px;
    }

    .tree-sub{
        font-size:10px;
    }
}

</style>

<script>

/* =========================================================
   CONFIG
========================================================= */

const CONFIG = {

    recipientName: "",

    titleTime: 2700,

    trunkTime: 2200,

    heartCount: 650

};


/* =========================================================
   SCENE ELEMENTS
========================================================= */

const archeryScene =
    document.getElementById("scene-archery");

const titleScene =
    document.getElementById("scene-title");

const treeScene =
    document.getElementById("scene-tree");

const treeArea =
    document.getElementById("treeArea");

const heartCanopy =
    document.getElementById("heartCanopy");

const restartBtn =
    document.getElementById("restartBtn");


function showScene(scene){

    archeryScene.classList.remove("active");
    titleScene.classList.remove("active");
    treeScene.classList.remove("active");

    scene.classList.add("active");
}


/* =========================================================
   ARCHERY
========================================================= */

const svg =
    document.getElementById("archerySvg");

const bowGroup =
    document.getElementById("bowGroup");

const arrowGroup =
    document.getElementById("arrowGroup");

const bowString =
    document.getElementById("bowString");

const limbTop =
    document.getElementById("limbTop");

const limbBottom =
    document.getElementById("limbBottom");

const pullHint =
    document.getElementById("pullHint");

const heartTarget =
    document.getElementById("heartTarget");

const burstLayer =
    document.getElementById("burstLayer");


const bowAnchor = {
    x:230,
    y:1330
};

const targetPoint = {
    x:540,
    y:420
};


const dx =
    targetPoint.x - bowAnchor.x;

const dy =
    targetPoint.y - bowAnchor.y;

const distance =
    Math.hypot(dx,dy);

const dir = {
    x:dx/distance,
    y:dy/distance
};

const angle =
    Math.atan2(dir.y,dir.x)
    *180/Math.PI;


bowGroup.setAttribute(
    "transform",
    `translate(${bowAnchor.x},${bowAnchor.y}) rotate(${angle})`
);


const REST_OFFSET = 150;

const MAX_PULL = 135;

const FIRE_THRESHOLD = 42;

let pulling = false;

let pullAmount = 0;


function setArrow(pull){

    const nock =
        REST_OFFSET-pull;

    arrowGroup.setAttribute(
        "transform",
        `translate(${nock},0)`
    );

    bowString.setAttribute(
        "points",
        `0,-140 ${nock-REST_OFFSET},0 0,140`
    );

    const flex =
        60 + pull*.25;

    limbTop.setAttribute(
        "d",
        `M0,-140 Q${flex},-70 0,0`
    );

    limbBottom.setAttribute(
        "d",
        `M0,0 Q${flex},70 0,140`
    );
}


setArrow(0);


/* =========================================================
   POINTER POSITION
========================================================= */

function svgPoint(event){

    const point =
        svg.createSVGPoint();

    point.x =
        event.clientX;

    point.y =
        event.clientY;

    const matrix =
        svg.getScreenCTM().inverse();

    return point.matrixTransform(matrix);
}


/* =========================================================
   START PULL
========================================================= */

svg.addEventListener(
    "pointerdown",
    function(event){

        pulling = true;

        pullHint.style.opacity = 0;

        svg.setPointerCapture(
            event.pointerId
        );

        event.preventDefault();

    }
);


/* =========================================================
   MOVE
========================================================= */

svg.addEventListener(
    "pointermove",
    function(event){

        if(!pulling)return;

        const point =
            svgPoint(event);

        const vx =
            point.x-bowAnchor.x;

        const vy =
            point.y-bowAnchor.y;

        const along =
            vx*dir.x+
            vy*dir.y;

        let pull =
            REST_OFFSET-along;

        pull =
            Math.max(
                0,
                Math.min(
                    MAX_PULL,
                    pull
                )
            );

        pullAmount =
            pull;

        setArrow(pull);

        event.preventDefault();

    }
);


/* =========================================================
   RELEASE
========================================================= */

svg.addEventListener(
    "pointerup",
    function(){

        if(!pulling)return;

        pulling = false;

        if(
            pullAmount >=
            FIRE_THRESHOLD
        ){

            fireArrow();

        }else{

            resetBow();

        }

    }
);


function resetBow(){

    const start =
        pullAmount;

    const startTime =
        performance.now();

    const duration =
        280;


    function animate(){

        const progress =
            Math.min(
                1,
                (performance.now()-startTime)
                /duration
            );

        const value =
            start*(1-progress);

        setArrow(value);

        pullAmount =
            value;

        if(progress<1){

            requestAnimationFrame(
                animate
            );

        }else{

            pullHint.style.opacity =
                .35;
        }

    }

    requestAnimationFrame(
        animate
    );
}


/* =========================================================
   FIRE ARROW
========================================================= */

function fireArrow(){

    const nock =
        REST_OFFSET-pullAmount;


    const rad =
        angle*Math.PI/180;


    const startX =
        bowAnchor.x+
        nock*Math.cos(rad);


    const startY =
        bowAnchor.y+
        nock*Math.sin(rad);


    const arrow =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "g"
        );


    arrow.innerHTML = `

        <line
            x1="0"
            y1="0"
            x2="150"
            y2="0"
            stroke="#58352d"
            stroke-width="6"
            stroke-linecap="round"
        />

        <polygon
            points="150,0 130,-10 130,10"
            fill="#eab35e"
        />

        <polygon
            points="0,0 -18,-10 -10,0 -18,10"
            fill="#e2447f"
        />

    `;


    arrow.setAttribute(
        "transform",
        `translate(${startX},${startY}) rotate(${angle})`
    );


    svg.appendChild(arrow);


    setArrow(0);

    pullAmount = 0;


    const startTime =
        performance.now();

    const duration =
        500;


    function fly(){

        const progress =
            Math.min(
                1,
                (performance.now()-startTime)
                /duration
            );

        const eased =
            1-Math.pow(
                1-progress,
                3
            );


        const travel =
            distance-70;


        const x =
            startX+
            dir.x*
            travel*
            eased;


        const y =
            startY+
            dir.y*
            travel*
            eased;


        arrow.setAttribute(
            "transform",
            `translate(${x},${y}) rotate(${angle})`
        );


        if(progress<1){

            requestAnimationFrame(
                fly
            );

        }else{

            arrow.remove();

            heartHit();

        }

    }

    requestAnimationFrame(
        fly
    );
}


/* =========================================================
   HEART HIT
========================================================= */

function heartHit(){

    heartTarget.animate(

        [
            {
                transform:
                "translate(540px,420px) scale(1)"
            },

            {
                transform:
                "translate(540px,470px) scale(1.4)"
            },

            {
                transform:
                "translate(540px,560px) scale(.9)",
                opacity:0
            }

        ],

        {
            duration:800,
            easing:"cubic-bezier(.2,.7,.3,1)"
        }

    );


    createBurst();


    setTimeout(
        function(){

            showScene(titleScene);

        },
        650
    );


    setTimeout(
        function(){

            showScene(treeScene);

            startTree();

        },
        650 + CONFIG.titleTime
    );
}


/* =========================================================
   HEART BURST
========================================================= */

function createBurst(){

    const hearts = [
        "💗",
        "💕",
        "💖",
        "🩷",
        "💛",
        "💞"
    ];


    for(
        let i=0;
        i<22;
        i++
    ){

        const heart =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "text"
            );


        heart.textContent =
            hearts[
                Math.floor(
                    Math.random()*hearts.length
                )
            ];


        heart.setAttribute(
            "x",
            540
        );

        heart.setAttribute(
            "y",
            420
        );

        heart.setAttribute(
            "font-size",
            20+Math.random()*20
        );


        const x =
            (Math.random()-.5)*300;

        const y =
            -(100+Math.random()*300);


        heart.style.setProperty(
            "--x",
            x+"px"
        );

        heart.style.setProperty(
            "--y",
            y+"px"
        );


        heart.classList.add(
            "burst-heart"
        );


        burstLayer.appendChild(
            heart
        );


        setTimeout(
            ()=>heart.remove(),
            1300
        );

    }

}


/* =========================================================
   TREE START
========================================================= */

let treeStarted = false;


function startTree(){

    if(treeStarted)return;

    treeStarted = true;


    treeArea.classList.add(
        "tree-grown"
    );


    createHeartCanopy();

}


/* =========================================================
   MATHEMATICAL HEART
========================================================= */

function heartEquation(x,y){

    const a =
        x*x+
        y*y-
        1;

    return (
        a*a*a -
        x*x*y*y*y
    ) <= 0;
}


/* =========================================================
   CREATE HEART CANOPY
========================================================= */

function createHeartCanopy(){

    heartCanopy.innerHTML = "";


    /*
       This is the important part.

       Instead of randomly scattering hearts
       across a rectangle, we mathematically
       keep EVERY heart inside the heart curve.
    */


    const hearts = [];

    const glyphs = [
        "♥",
        "♥",
        "♥",
        "♥",
        "❤"
    ];


    /*
       More hearts near the outside edge,
       slightly fewer in the center.
    */

    for(
        let i=0;
        i<CONFIG.heartCount;
        i++
    ){

        let x;
        let y;

        let attempts = 0;


        do{

            /*
               Generate heart coordinates.

               y is inverted because screen
               coordinates increase downward.
            */

            x =
                Math.random()*2.25-
                1.125;

            y =
                Math.random()*2.0-
                1.0;

            attempts++;


            if(attempts>100)
                break;


        }while(
            !heartEquation(
                x,
                -y
            )
        );


        /*
           Map mathematical heart
           to canopy dimensions.
        */

        const left =
            50+
            (x/1.125)*50;


        const top =
            50+
            (y/1.0)*50;


        const heart =
            document.createElement(
                "span"
            );


        heart.className =
            "canopy-heart";


        heart.textContent =
            glyphs[
                Math.floor(
                    Math.random()*
                    glyphs.length
                )
            ];


        /*
           SMALL hearts.

           This prevents the huge
           clutter seen in your screenshot.
        */

        const size =
            7+
            Math.random()*8;


        heart.style.fontSize =
            size+"px";


        /*
           Consistent pink palette.
        */

        const colors = [

            "#e52f76",
            "#ef4382",
            "#f56d9b",
            "#f795b5",
            "#d91e63",
            "#ee5b91",
            "#f8a9c2"

        ];


        heart.style.color =
            colors[
                Math.floor(
                    Math.random()*
                    colors.length
                )
            ];


        heart.style.left =
            left+"%";


        heart.style.top =
            top+"%";


        /*
           Random depth.

           Some hearts appear
           slightly transparent.
        */

        if(
            Math.random()<.18
        ){

            heart.classList.add(
                "soft"
            );

        }


        hearts.push(
            heart
        );

        heartCanopy.appendChild(
            heart
        );

    }


    /*
       Bloom in controlled waves.

       This creates the appearance
       of the canopy growing.
    */

    hearts.forEach(
        function(heart,index){

            const delay =
                500+
                index*2.4+
                Math.random()*900;


            setTimeout(
                function(){

                    heart.classList.add(
                        "show"
                    );

                },
                delay
            );

        }
    );

}


/* =========================================================
   RESTART
========================================================= */

restartBtn.addEventListener(
    "click",
    function(){

        location.reload();

    }
);

</script>

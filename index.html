<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Happy Birthday 🎂</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@400;500;600;700&family=Pacifico&display=swap"
      rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background:
        radial-gradient(
            circle at 50% 42%,
            #fffdf9 0%,
            #fff7f0 45%,
            #fbe8df 100%
        );

    font-family: "Playfair Display", serif;
}


/* =========================================================
   MAIN SCENE
========================================================= */

#birthdayScene {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background:
        radial-gradient(
            ellipse at 50% 42%,
            rgba(255,255,255,.96) 0%,
            rgba(255,247,239,.94) 48%,
            rgba(250,228,218,.96) 100%
        );
}


/* =========================================================
   SOFT LIGHT
========================================================= */

.glow {

    position: absolute;

    width: 70vw;
    height: 70vw;

    max-width: 700px;
    max-height: 700px;

    left: 50%;
    top: 45%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.85),
            rgba(255,225,235,.25),
            transparent 70%
        );

    filter: blur(20px);

    pointer-events: none;
}


/* =========================================================
   FLOATING BACKGROUND HEARTS
========================================================= */

#backgroundHearts {

    position: absolute;

    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: 2;
}

.background-heart {

    position: absolute;

    font-family: Arial, sans-serif;

    opacity: .45;

    animation:
        floatBackground 7s ease-in-out infinite;

    filter: blur(.1px);
}

@keyframes floatBackground {

    0%,
    100% {
        transform: translateY(0) rotate(-5deg);
    }

    50% {
        transform: translateY(-18px) rotate(5deg);
    }
}


/* =========================================================
   TREE AREA
========================================================= */

#treeStage {

    position: absolute;

    left: 50%;
    bottom: 0;

    width: min(100vw, 760px);
    height: min(92vh, 1050px);

    transform: translateX(-50%);

    z-index: 20;

    pointer-events: none;
}


/* =========================================================
   HEART CANOPY
   IMPORTANT:
   THIS IS BEHIND THE TREE
========================================================= */

#canopy {

    position: absolute;

    left: 50%;

    top: 8%;

    width: 100%;
    height: 72%;

    transform: translateX(-50%);

    z-index: 5;

    pointer-events: none;

    overflow: visible;
}


/* Individual canopy hearts */

.canopy-heart {

    position: absolute;

    display: flex;

    align-items: center;

    justify-content: center;

    width: 22px;
    height: 22px;

    transform-origin: center;

    font-family: Arial, sans-serif;

    line-height: 1;

    opacity: 0;

    text-shadow:
        0 1px 2px rgba(100,20,40,.12);

    will-change:
        transform,
        opacity;

    animation:
        heartBloom
        var(--duration)
        cubic-bezier(.17,.67,.32,1.3)
        forwards;

    animation-delay: var(--delay);
}


@keyframes heartBloom {

    0% {

        opacity: 0;

        transform:
            translate(
                var(--start-x),
                var(--start-y)
            )
            scale(.05)
            rotate(-20deg);
    }

    45% {

        opacity: 1;

        transform:
            translate(
                calc(var(--target-x) * .65),
                calc(var(--target-y) * .65)
            )
            scale(1.15)
            rotate(5deg);
    }

    100% {

        opacity: var(--opacity);

        transform:
            translate(
                var(--target-x),
                var(--target-y)
            )
            scale(var(--scale))
            rotate(var(--rotation));
    }
}


/* =========================================================
   TREE SVG
========================================================= */

#treeSVG {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    overflow: visible;

    z-index: 20;
}


/* ---------------------------------------------------------
   MAIN TRUNK
--------------------------------------------------------- */

.trunk {

    fill: url(#trunkGradient);

    filter:
        drop-shadow(
            2px 3px 3px
            rgba(55,20,20,.16)
        );

    transform-origin: bottom center;

    animation:
        trunkGrow
        2.5s
        cubic-bezier(.22,.61,.36,1)
        forwards;
}

@keyframes trunkGrow {

    0% {
        transform: scaleY(0);
        transform-origin: 50% 100%;
    }

    100% {
        transform: scaleY(1);
        transform-origin: 50% 100%;
    }
}


/* =========================================================
   BRANCHES
========================================================= */

.branch {

    fill: none;

    stroke:
        #4d2526;

    stroke-linecap: round;
    stroke-linejoin: round;

    stroke-width: 15;

    filter:
        drop-shadow(
            1px 2px 2px
            rgba(50,20,20,.14)
        );

    stroke-dasharray: 1800;

    stroke-dashoffset: 1800;

    animation:
        branchGrow
        2.8s
        cubic-bezier(.22,.61,.36,1)
        forwards;
}


.main-branch {
    stroke-width: 19;
}


/* Smaller branches */

.twig {

    fill: none;

    stroke:
        #4d2526;

    stroke-width: 7;

    stroke-linecap: round;

    stroke-linejoin: round;

    stroke-dasharray: 700;

    stroke-dashoffset: 700;

    animation:
        twigGrow
        2s
        cubic-bezier(.22,.61,.36,1)
        forwards;
}


@keyframes branchGrow {

    0% {
        stroke-dashoffset: 1800;
    }

    100% {
        stroke-dashoffset: 0;
    }
}


@keyframes twigGrow {

    0% {
        stroke-dashoffset: 700;
    }

    100% {
        stroke-dashoffset: 0;
    }
}


/* =========================================================
   TREE TEXT
========================================================= */

#birthdayText {

    position: absolute;

    left: 7%;

    bottom: 9%;

    z-index: 40;

    text-align: left;

    pointer-events: none;

    opacity: 0;

    animation:
        textAppear
        1.4s
        ease
        5s
        forwards;
}

@keyframes textAppear {

    from {
        opacity: 0;
        transform: translateY(18px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


.smallText {

    display: block;

    margin-bottom: 5px;

    color: #6c3a35;

    font-size: clamp(12px, 2vw, 18px);

    font-style: italic;

    font-weight: 600;
}


.mainBirthday {

    font-family: "Pacifico", cursive;

    font-size: clamp(38px, 7vw, 76px);

    line-height: .95;

    color: #d31867;

    text-shadow:
        1px 2px 0 rgba(255,255,255,.55),
        0 4px 12px rgba(190,40,100,.15);
}


.bottomText {

    display: block;

    margin-top: 18px;

    color: #673b38;

    font-size: clamp(13px, 2vw, 19px);

    font-weight: 600;
}


/* =========================================================
   BOW INTRO
========================================================= */

#intro {

    position: absolute;

    inset: 0;

    z-index: 100;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at 50% 50%,
            #fffaf7,
            #f7dfe0
        );

    transition:
        opacity .9s ease,
        visibility .9s ease;
}


#intro.hide {

    opacity: 0;

    visibility: hidden;

    pointer-events: none;
}


/* Bow */

.bow {

    position: relative;

    width: 210px;
    height: 170px;

    cursor: pointer;

    animation:
        bowFloat
        2.5s
        ease-in-out
        infinite;
}

@keyframes bowFloat {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-10px);
    }
}


.bow-loop {

    position: absolute;

    top: 35px;

    width: 100px;
    height: 100px;

    border: 10px solid #e6387c;

    background:
        radial-gradient(
            circle at 35% 35%,
            #ff86b4,
            #e82d71 70%
        );

    box-shadow:
        0 8px 25px rgba(180,30,80,.18);
}


.bow-left {

    left: 0;

    border-radius:
        70% 35% 55% 70%;

    transform:
        rotate(-25deg);
}


.bow-right {

    right: 0;

    border-radius:
        35% 70% 70% 55%;

    transform:
        rotate(25deg);
}


.bow-center {

    position: absolute;

    left: 50%;
    top: 65px;

    width: 52px;
    height: 52px;

    transform: translateX(-50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ff9ac0,
            #dc2267
        );

    box-shadow:
        0 5px 18px rgba(180,30,80,.25);

    z-index: 5;
}


.bow-ribbon {

    position: absolute;

    top: 102px;

    width: 75px;
    height: 65px;

    background:
        linear-gradient(
            135deg,
            #f15491,
            #d92368
        );

    clip-path:
        polygon(
            0 0,
            100% 15%,
            72% 100%,
            50% 62%,
            25% 100%
        );
}


.bow-ribbon.left {
    left: 48px;
    transform: rotate(12deg);
}

.bow-ribbon.right {
    right: 48px;
    transform: scaleX(-1) rotate(12deg);
}


.intro-title {

    position: absolute;

    top: calc(50% + 120px);

    color: #9e315b;

    font-family: "Pacifico", cursive;

    font-size: 24px;

    text-align: center;
}


/* =========================================================
   HEART TRANSITION
========================================================= */

#heartTransition {

    position: absolute;

    inset: 0;

    z-index: 90;

    display: flex;

    align-items: center;
    justify-content: center;

    pointer-events: none;

    opacity: 0;
}


.transition-heart {

    width: 30px;
    height: 30px;

    background: #e72d70;

    transform:
        rotate(45deg)
        scale(0);

    position: relative;

    box-shadow:
        0 0 30px rgba(231,45,112,.5);
}


.transition-heart::before,
.transition-heart::after {

    content: "";

    position: absolute;

    width: 30px;
    height: 30px;

    border-radius: 50%;

    background: #e72d70;
}


.transition-heart::before {
    left: -15px;
}

.transition-heart::after {
    top: -15px;
}


#heartTransition.play {

    opacity: 1;
}


#heartTransition.play .transition-heart {

    animation:
        heartTransition
        1.6s
        cubic-bezier(.7,0,.2,1)
        forwards;
}


@keyframes heartTransition {

    0% {

        transform:
            rotate(45deg)
            scale(0);
    }

    30% {

        transform:
            rotate(45deg)
            scale(4);
    }

    100% {

        transform:
            rotate(45deg)
            scale(45);
    }
}


/* =========================================================
   RESTART
========================================================= */

#restart {

    position: absolute;

    top: 24px;
    right: 24px;

    z-index: 80;

    border: none;

    padding: 13px 25px;

    border-radius: 999px;

    background:
        rgba(170,140,135,.25);

    backdrop-filter: blur(10px);

    color: white;

    font-family: Georgia, serif;

    font-size: 16px;

    cursor: pointer;

    transition: .3s ease;
}


#restart:hover {

    background:
        rgba(170,140,135,.4);

    transform: scale(1.04);
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    #treeStage {

        width: 100vw;

        height: 88vh;

        bottom: 0;
    }


    #canopy {

        top: 4%;

        height: 68%;
    }


    .branch {
        stroke-width: 12;
    }

    .main-branch {
        stroke-width: 15;
    }

    .twig {
        stroke-width: 5;
    }


    #birthdayText {

        left: 6%;

        bottom: 7%;
    }


    .mainBirthday {

        font-size: clamp(
            38px,
            11vw,
            64px
        );
    }


    #restart {

        top: 18px;
        right: 16px;

        padding: 10px 20px;

        font-size: 14px;
    }
}


/* =========================================================
   SMALL PHONES
========================================================= */

@media (max-width: 390px) {

    #treeStage {

        height: 86vh;
    }


    #birthdayText {

        bottom: 6%;
    }


    .mainBirthday {

        font-size: 42px;
    }
}

</style>
</head>

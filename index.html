<html lang="en">

<title>Happy Birthday · draw the bow, hit the heart</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Quicksand:wght@400;500;600&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Yellowtail&display=swap"
      rel="stylesheet">

<style>

:root{
    --cream:#fdece0;
    --cream2:#fbdcc9;
    --rose:#c8175a;
    --rose2:#e2447f;
    --pink:#f6a6c1;
    --gold:#eab35e;
    --brown:#5b302d;
    --paper:#fff7ef;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#180b11;
    font-family:'Quicksand',sans-serif;
    -webkit-tap-highlight-color:transparent;
}

#stage-frame{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
}

#stage{
    position:relative;

    width:min(100vw,56.25vh);
    height:min(177.78vw,100vh);

    overflow:hidden;

    background:
        radial-gradient(
            ellipse at 50% 30%,
            #fffaf2 0%,
            var(--cream) 50%,
            var(--cream2) 100%
        );

    box-shadow:0 0 60px rgba(0,0,0,.55);
}

/* =========================================================
   SCENES
========================================================= */

.scene{
    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    opacity:0;
    pointer-events:none;

    transition:
        opacity 1.1s ease,
        transform 1.1s ease;

    transform:scale(1.04);
}

.scene.active{
    opacity:1;
    pointer-events:auto;
    transform:scale(1);
}

/* =========================================================
   SCENE 1
========================================================= */

#scene-archery{
    background:
        radial-gradient(
            ellipse at 50% 35%,
            #ffd9c2 0%,
            var(--cream) 55%,
            var(--cream2) 100%
        );
}

#archery-svg{
    width:100%;
    height:100%;
    touch-action:none;
    user-select:none;
}

.heart-glow{
    filter:drop-shadow(
        0 0 35px rgba(216,60,110,.5)
    );
}

#bow-group path.limb{
    fill:none;
    stroke:#5b3a2c;
    stroke-width:14;
    stroke-linecap:round;
}

#bow-string{
    stroke:#8a7a63;
    stroke-width:2.5;
    fill:none;
}

#arrow-shaft{
    stroke:#5b3a2c;
    stroke-width:6;
    stroke-linecap:round;
}

#arrow-head{
    fill:var(--gold);
}

#arrow-fletch{
    fill:var(--rose2);
}

.archer-hint{
    fill:#4a2e2e;
    opacity:.4;

    font-family:'Fredoka',sans-serif;

    letter-spacing:.12em;
    font-size:22px;
    font-weight:600;

    text-anchor:middle;

    animation:
        hintPulse 1.8s ease-in-out infinite;
}

@keyframes hintPulse{

    0%,100%{
        opacity:.25;
    }

    50%{
        opacity:.6;
    }

}

/* =========================================================
   SCENE 2
========================================================= */

#scene-title{

    background:
        radial-gradient(
            120% 90% at 50% 30%,
            var(--rose2) 0%,
            var(--rose) 65%,
            #8f0f42 100%
        );
}

#scene-title .eyebrow,
#scene-title .subtitle{
    color:var(--paper);
    opacity:.8;
}

.eyebrow{
    font-family:'Fredoka',sans-serif;
    font-style:italic;
    font-weight:500;

    color:#4a2e2e;
    opacity:.55;

    font-size:clamp(13px,3.4vw,16px);

    margin:0 0 6px;
}

.title{
    font-family:'Playfair Display',serif;

    font-weight:900;

    color:var(--paper);

    font-size:clamp(48px,13.5vw,72px);

    line-height:.98;

    text-align:center;

    margin:2px 0;

    text-shadow:
        0 6px 30px rgba(0,0,0,.25);
}

.subtitle{
    font-family:'Fredoka',sans-serif;
    font-style:italic;

    color:#4a2e2e;
    opacity:.6;

    font-size:clamp(12px,3vw,14px);

    margin-top:10px;

    text-align:center;
}

.swash{
    width:140px;
    height:18px;

    margin:14px auto 4px;

    border-bottom:
        3px solid var(--gold);

    border-radius:50%;

    transform:
        rotate(-1.5deg)
        scaleY(.6);
}

/* =========================================================
   SCENE 3 — HEART TREE
========================================================= */

#scene-tree{

    display:block;

    background:
        radial-gradient(
            ellipse at 50% 20%,
            #fffdf7 0%,
            #fff4e8 43%,
            #fbdcca 100%
        );
}

/* soft light behind tree */

#tree-light{
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            ellipse at 50% 42%,
            rgba(255,255,255,.9),
            rgba(255,220,195,.3) 45%,
            transparent 72%
        );

    pointer-events:none;
}

/* =========================================================
   TREE SVG
========================================================= */

#tree-svg{

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:78%;

    overflow:visible;
}

/* Main trunk */

.tree-trunk{

    fill:#542f2b;

    stroke:#542f2b;

    stroke-linecap:round;

}

/* Main branches */

.tree-main-branch{

    fill:none;

    stroke:#5b302d;

    stroke-width:18;

    stroke-linecap:round;

    stroke-linejoin:round;

    opacity:1;

}

/* Secondary branches */

.tree-branch{

    fill:none;

    stroke:#673834;

    stroke-width:8;

    stroke-linecap:round;

    stroke-linejoin:round;

}

/* Tiny branches */

.tree-twig{

    fill:none;

    stroke:#74403c;

    stroke-width:4;

    stroke-linecap:round;

}

/*
   Animation:
   Every branch is drawn from its beginning to its end.
*/

.grow-line{

    stroke-dasharray:3000;

    stroke-dashoffset:3000;

}

.grow-line.grow{

    animation:
        drawBranch 1.8s
        cubic-bezier(.65,0,.35,1)
        forwards;

}

@keyframes drawBranch{

    to{
        stroke-dashoffset:0;
    }

}

/* =========================================================
   HEART EMOJI CANOPY
========================================================= */

#heart-canopy{

    position:absolute;

    left:8%;
    right:8%;

    top:4%;

    height:58%;

    pointer-events:none;

}

/* individual emoji */

.canopy-heart{

    position:absolute;

    transform:
        translate(-50%,-50%)
        scale(0);

    opacity:0;

    line-height:1;

    filter:
        drop-shadow(
            0 2px 4px rgba(130,40,60,.18)
        );

    transition:
        transform .65s cubic-bezier(.34,1.56,.64,1),
        opacity .45s ease;

}

/* bloom */

.canopy-heart.bloom{

    transform:
        translate(-50%,-50%)
        scale(1);

    opacity:.88;

    animation:
        floatingHeart
        4.5s ease-in-out
        infinite;

}

@keyframes floatingHeart{

    0%,100%{
        margin-top:0;
    }

    50%{
        margin-top:-4px;
    }

}

/* =========================================================
   BIRTHDAY MESSAGE
========================================================= */

#tree-message{

    position:absolute;

    left:6%;

    bottom:6%;

    width:55%;

    z-index:20;

}

#tree-message .eyebrow{

    margin:0 0 2px;

    font-family:'Playfair Display',serif;

    font-size:14px;

    color:#713a38;

    opacity:.9;

}

#tree-message h2{

    color:#c8175a;

    font-family:'Yellowtail',cursive;

    font-size:clamp(48px,12vw,70px);

    line-height:.82;

    text-shadow:
        0 2px 10px rgba(194,45,91,.12);

}

#tree-message p{

    margin:14px 0 0;

    font-family:'Fredoka',sans-serif;

    font-size:14px;

    font-weight:500;

    color:#713a38;

}

/* decorative hearts around message */

.message-heart{

    position:absolute;

    font-size:24px;

    opacity:.7;

    animation:
        messageFloat
        3s ease-in-out
        infinite;

}

.message-heart.one{
    left:-4%;
    top:35%;
}

.message-heart.two{
    right:-2%;
    top:10%;
    animation-delay:.8s;
}

.message-heart.three{
    right:-10%;
    bottom:0;
    animation-delay:1.4s;
}

@keyframes messageFloat{

    0%,100%{
        transform:translateY(0) rotate(-5deg);
    }

    50%{
        transform:translateY(-8px) rotate(5deg);
    }

}

/* =========================================================
   RESTART
========================================================= */

    border:none;

    border-radius:20px;

    padding:6px 12px;

    font-family:'Fredoka',sans-serif;

    font-size:11px;

    opacity:.45;

}

<script>

(function(){

"use strict";


/* =========================================================
   SCENES
========================================================= */

const scenes = {

    archery:
        document.getElementById("scene-archery"),

    title:
        document.getElementById("scene-title"),

    tree:
        document.getElementById("scene-tree")

};


function showScene(name){

    Object.values(scenes).forEach(scene=>{
        scene.classList.remove("active");
    });

    scenes[name].classList.add("active");

}


/* =========================================================
   ARCHERY
========================================================= */

const svg =
    document.getElementById("archery-svg");

const bowGroup =
    document.getElementById("bow-group");

const arrowGroup =
    document.getElementById("arrow-group");

const bowString =
    document.getElementById("bow-string");

const limbTop =
    document.getElementById("limb-top");

const limbBottom =
    document.getElementById("limb-bottom");

const heartTarget =
    document.getElementById("heart-target");

const burstLayer =
    document.getElementById("burst-layer");


const bowAnchor = {
    x:230,
    y:1330
};

const targetPoint = {
    x:540,
    y:420
};


const dx =
    targetPoint.x-bowAnchor.x;

const dy =
    targetPoint.y-bowAnchor.y;

const dist =
    Math.hypot(dx,dy);


const dir = {
    x:dx/dist,
    y:dy/dist
};


const angleDeg =
    Math.atan2(dir.y,dir.x)*180/Math.PI;


bowGroup.setAttribute(
    "transform",
    `translate(${bowAnchor.x},${bowAnchor.y}) rotate(${angleDeg})`
);


const REST_OFFSET = 150;
const MAX_PULL = 130;
const FIRE_THRESHOLD = 40;


let pulling = false;
let pullAmount = 0;


function setArrow(pull){

    const nockX =
        REST_OFFSET-pull;

    arrowGroup.setAttribute(
        "transform",
        `translate(${nockX},0)`
    );

    bowString.setAttribute(
        "points",
        `0,-140 ${nockX-REST_OFFSET},0 0,140`
    );

    const flex =
        60+pull*.25;

    limbTop.setAttribute(
        "d",
        `M0,-140 Q${flex},-70 0,0`
    );

    limbBottom.setAttribute(
        "d",
        `M0,0 Q${flex},70 0,140`
    );

}


setArrow(0);


/* convert screen coordinates to SVG */

function toSvgPoint(evt){

    const pt =
        svg.createSVGPoint();

    const touch =
        evt.touches
        ? evt.touches[0]
        : evt;

    pt.x =
        touch.clientX;

    pt.y =
        touch.clientY;

    const matrix =
        svg.getScreenCTM().inverse();

    return pt.matrixTransform(matrix);

}


/* =========================================================
   PULL
========================================================= */

function startPull(evt){

    pulling=true;

    evt.preventDefault();

}


function movePull(evt){

    if(!pulling)
        return;

    const p =
        toSvgPoint(evt);

    const vx =
        p.x-bowAnchor.x;

    const vy =
        p.y-bowAnchor.y;

    const along =
        vx*dir.x+
        vy*dir.y;

    let pull =
        REST_OFFSET-along;

    pull =
        Math.max(
            0,
            Math.min(MAX_PULL,pull)
        );

    pullAmount=pull;

    setArrow(pull);

    evt.preventDefault();

}


function endPull(){

    if(!pulling)
        return;

    pulling=false;

    if(
        pullAmount>=FIRE_THRESHOLD
    ){

        fireArrow(pullAmount);

    }else{

        springBack();

    }

}


function springBack(){

    const start =
        pullAmount;

    const startTime =
        performance.now();

    const duration =
        260;


    function animateBack(time){

        const progress =
            Math.min(
                1,
                (time-startTime)/duration
            );

        const value =
            start*(1-progress);

        setArrow(value);

        pullAmount=value;

        if(progress<1){

            requestAnimationFrame(
                animateBack
            );

        }

    }


    requestAnimationFrame(
        animateBack
    );

}


svg.addEventListener(
    "pointerdown",
    startPull
);

window.addEventListener(
    "pointermove",
    movePull
);

window.addEventListener(
    "pointerup",
    endPull
);


/* =========================================================
   FIRE ARROW
========================================================= */

function fireArrow(power){

    const nockX =
        REST_OFFSET-power;

    const rad =
        angleDeg*Math.PI/180;


    const startWorld = {

        x:
            bowAnchor.x+
            nockX*Math.cos(rad),

        y:
            bowAnchor.y+
            nockX*Math.sin(rad)

    };


    const flying =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "g"
        );


    flying.innerHTML=`

        <line
            x1="0"
            y1="0"
            x2="150"
            y2="0"
            stroke="#5b3a2c"
            stroke-width="6"
            stroke-linecap="round"
        />

        <polygon
            points="150,0 130,-9 130,9"
            fill="#eab35e"
        />

        <polygon
            points="0,0 -18,-10 -10,0 -18,10"
            fill="#e2447f"
        />

    `;


    svg.appendChild(flying);


    setArrow(0);

    pullAmount=0;


    const startTime =
        performance.now();

    const duration =
        430;


    function fly(time){

        const progress =
            Math.min(
                1,
                (time-startTime)/duration
            );

        const ease =
            1-Math.pow(
                1-progress,
                3
            );


        const x =
            startWorld.x+
            (targetPoint.x-startWorld.x)
            *ease;

        const y =
            startWorld.y+
            (targetPoint.y-startWorld.y)
            *ease;


        flying.setAttribute(
            "transform",
            `translate(${x},${y})
             rotate(${angleDeg})`
        );


        if(progress<1){

            requestAnimationFrame(fly);

        }else{

            flying.remove();

            hitHeart();

        }

    }


    requestAnimationFrame(fly);

}


/* =========================================================
   HEART HIT
========================================================= */

function hitHeart(){

    heartTarget.animate(

        [
            {
                transform:
                    "translate(540px,420px) scale(1)"
            },

            {
                transform:
                    "translate(540px,420px) scale(1.45)"
            },

            {
                transform:
                    "translate(540px,420px) scale(1)"
            }

        ],

        {
            duration:500,
            easing:"ease-out"
        }

    );


    const emojis=[
        "💗",
        "💛",
        "💕",
        "🩷",
        "💞",
        "✨",
        "💓",
        "💖"
    ];


    for(
        let i=0;
        i<18;
        i++
    ){

        const el =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "text"
            );


        el.textContent =
            emojis[
                i%emojis.length
            ];


        el.setAttribute(
            "x",
            targetPoint.x
        );

        el.setAttribute(
            "y",
            targetPoint.y
        );

        el.setAttribute(
            "font-size",
            20+Math.random()*20
        );


        burstLayer.appendChild(el);


        const x =
            (Math.random()-.5)*280;

        const y =
            -100-Math.random()*300;


        el.animate(

            [
                {
                    transform:"translate(0,0)",
                    opacity:0
                },

                {
                    transform:"translate(0,0)",
                    opacity:1
                },

                {
                    transform:
                        `translate(${x}px,${y}px)`,
                    opacity:0
                }

            ],

            {
                duration:
                    1200+Math.random()*700,

                easing:
                    "ease-out",

                fill:"forwards"

            }

        );

    }


    /* move to title */

    setTimeout(()=>{

        showScene("title");


        setTimeout(()=>{

            showScene("tree");

            startTreeAnimation();

        },2600);

    },700);

}


/* =========================================================
   TREE ANIMATION
========================================================= */

let treeStarted=false;


function startTreeAnimation(){

    if(treeStarted)
        return;

    treeStarted=true;


    /* -----------------------------------------
       STEP 1
       Draw the trunk first.
    ----------------------------------------- */

    const paths =
        document.querySelectorAll(
            ".grow-line"
        );


    /*
       We use different delays so the tree
       grows from trunk → primary branches
       → secondary branches → tiny twigs.
    */

    paths.forEach(path=>{

        const delay =
            Number(
                path.dataset.delay||0
            );


        setTimeout(()=>{

            path.classList.add("grow");

        },delay);

    });


    /*
       Start the heart canopy after
       the branches are established.
    */

    setTimeout(
        createHeartCanopy,
        1700
    );

}


/* =========================================================
   HEART CANOPY
========================================================= */

function insideHeart(x,y){

    /*
       Mathematical heart:

       (x²+y²-1)³ - x²y³ <= 0
    */

    const a =
        x*x+y*y-1;

    return (
        a*a*a-
        x*x*y*y*y
        <=0
    );

}


/* random points INSIDE heart */

function generateHeartPoints(count){

    const points=[];

    let attempts=0;


    while(
        points.length<count &&
        attempts<100000
    ){

        attempts++;


        const x =
            Math.random()*2.3-1.15;

        const y =
            Math.random()*2.3-1.15;


        if(
            insideHeart(x,y)
        ){

            points.push({
                x:x,
                y:y
            });

        }

    }


    return points;

}


/* =========================================================
   CREATE CANOPY
========================================================= */

function createHeartCanopy(){

    const container =
        document.getElementById(
            "heart-canopy"
        );


    container.innerHTML="";


    /*
       Use several types of hearts.
    */

    const emojis=[
        "💗",
        "💕",
        "🩷",
        "💖",
        "💞",
        "💓",
        "💛",
        "✨",
        "🤍"
    ];


    /*
       250 is enough for a dense heart
       while staying smooth on mobile.
    */

    const points =
        generateHeartPoints(250);


    points.forEach(
        (point,index)=>{


        const heart =
            document.createElement(
                "span"
            );


        heart.className=
            "canopy-heart";


        heart.textContent=
            emojis[
                Math.floor(
                    Math.random()*
                    emojis.length
                )
            ];


        /*
           Convert mathematical heart
           coordinates to screen coordinates.
        */

        const left =
            50+
            point.x*
            42;


        /*
           Invert Y because screen Y
           goes downward.
        */

        const top =
            50-
            point.y*
            43;


        heart.style.left=
            left+"%";

        heart.style.top=
            top+"%";


        /*
           Keep emoji sizes varied.
        */

        const size =
            10+
            Math.random()*11;


        heart.style.fontSize=
            size+"px";


        container.appendChild(
            heart
        );


        /*
           Bloom progressively.
        */

        const delay =
            900+
            index*7+
            Math.random()*500;


        setTimeout(()=>{

            heart.classList.add(
                "bloom"
            );

        },delay);

    });

}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Happy Birthday · draw the bow, hit the heart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Quicksand:wght@400;500;600&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Yellowtail&display=swap" rel="stylesheet">
<style>
  /* ===========================================================
     EDIT ME — quick config lives at the top of the <script> below
     (name, messages, colors, timing). Everything else is plumbing.
     =========================================================== */

  :root{
    --cream: #fdece0;
    --cream-2: #fbdcc9;
    --rose-deep: #c8175a;
    --rose-mid: #e2447f;
    --rose-light: #f6a6c1;
    --gold: #eab35e;
    --ink: #4a2e2e;
    --paper: #fff7ef;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    background:#1b0e14;
    font-family:'Quicksand', sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
  }

  #stage-frame{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
  }

  #stage{
    position:relative;
    width:min(100vw, 56.25vh);
    height:min(177.78vw, 100vh);
    background: linear-gradient(180deg, var(--cream) 0%, var(--cream-2) 100%);
    overflow:hidden;
    box-shadow:0 0 60px rgba(0,0,0,.5);
    touch-action:none;
  }

  .scene{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transform:translateY(8%) scale(1.02);
    transition:opacity .8s ease, transform .8s cubic-bezier(.22,.9,.3,1);
    z-index:1;
  }
  .scene.active{ opacity:1; pointer-events:auto; transform:translateY(0) scale(1); z-index:2; }
  .scene.exiting{
    opacity:0; pointer-events:none;
    transform:translateY(-8%) scale(.98);
    transition:opacity .7s ease, transform .7s cubic-bezier(.4,0,.7,.2);
    z-index:1;
  }

  /* -------------------- shared text styles -------------------- */
  .eyebrow{
    font-family:'Fredoka', sans-serif;
    font-style:italic;
    font-weight:500;
    letter-spacing:.02em;
    color:var(--ink);
    opacity:.55;
    font-size:clamp(13px,3.4vw,16px);
    margin:0 0 6px;
  }
  .subtitle{
    font-family:'Fredoka', sans-serif;
    font-style:italic;
    font-weight:400;
    color:var(--ink);
    opacity:.6;
    font-size:clamp(12px,3vw,14px);
    margin-top:10px;
    text-align:center;
  }

  /* ==================== SCENE 1 — ARCHERY ==================== */
  #scene-archery{ background: radial-gradient(ellipse at 50% 34%, #ffd9c2 0%, var(--cream) 55%, var(--cream-2) 100%); }

  #archery-svg{ position:relative; z-index:2; width:100%; height:100%; touch-action:none; user-select:none; }

  .archer-hint{
    fill:var(--ink); opacity:.4; font-family:'Fredoka',sans-serif;
    letter-spacing:.12em; font-size:22px; font-weight:600;
    text-anchor:middle;
    animation: pulse-hint 1.8s ease-in-out infinite;
  }
  @keyframes pulse-hint{ 0%,100%{opacity:.25;} 50%{opacity:.55;} }

  .heart-glow{ filter:drop-shadow(0 0 40px rgba(216,60,110,.45)); }

  #bow-group path.limb{
    fill:none; stroke:#5b3a2c; stroke-width:14; stroke-linecap:round;
  }
  #bow-string{ stroke:#8a7a63; stroke-width:2.5; fill:none; }
  #arrow-shaft{ stroke:#5b3a2c; stroke-width:6; stroke-linecap:round; }
  #arrow-head{ fill:var(--gold); }
  #arrow-fletch{ fill:var(--rose-mid); }

  .burst-heart{
    font-size:22px;
    pointer-events:none;
  }

  /* ==================== SCENE 2 — TITLE ==================== */
  #scene-title{
    background: radial-gradient(120% 90% at 50% 30%, var(--rose-mid) 0%, var(--rose-deep) 65%, #8f0f42 100%);
  }
  #scene-title .eyebrow, #scene-title .subtitle{ color:var(--paper); opacity:.75; }
  .title{
    font-family:'Playfair Display', serif;
    font-weight:900;
    color:var(--paper);
    font-size:clamp(48px,13.5vw,72px);
    line-height:.98;
    text-align:center;
    margin:2px 0;
    text-shadow:0 6px 30px rgba(0,0,0,.25);
  }
  .swash{
    width:140px; height:18px; margin:14px auto 4px;
    border-bottom:3px solid var(--gold);
    border-radius:50%;
    transform:rotate(-1.5deg) scaleY(.6);
    opacity:.9;
  }

  /* ==================== SCENE 3 — TREE ==================== */
  #scene-tree{ justify-content:flex-end; background: radial-gradient(ellipse at 50% 15%, #fff3e6 0%, var(--cream) 45%, var(--cream-2) 100%); }

  #tree-wrap{
    position:relative;
    width:100%;
    flex:1 1 auto;
    display:flex; align-items:flex-end; justify-content:center;
  }
  #trunk{
    position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:14px; height:0%;
    background:linear-gradient(180deg,#6b4a3a,#4a3226);
    border-radius:6px 6px 0 0;
    transition:height 1.4s cubic-bezier(.22,.9,.3,1);
    z-index:1;
  }
  /* branches-svg and #canopy share the exact same box so the branch-drawn
     heart outline and the mini-heart fill line up perfectly. Both sit
     ABOVE the trunk (bottom offset = trunk's grown height), not at ground level. */
  #branches-svg{
    position:absolute; left:50%; bottom:28%; transform:translateX(-50%);
    width:230px; max-width:72%; height:46%;
    overflow:visible; pointer-events:none;
    z-index:1;
  }
  #branches-svg path{
    fill:none; stroke:#5b3a2c; stroke-linecap:round; stroke-width:7;
  }
  #canopy{
    position:absolute; left:50%; bottom:28%; transform:translateX(-50%);
    width:275px; max-width:88%; height:56%;
    pointer-events:none;
    z-index:2;
  }
  .mini-heart{
    position:absolute; transform:translate(-50%,-50%) scale(0);
    opacity:0; line-height:1;
    filter:drop-shadow(0 1px 3px rgba(120,40,60,.25));
    transition: transform .7s cubic-bezier(.34,1.56,.64,1), opacity .5s ease;
  }
  .mini-heart.bloomed{
    transform:translate(-50%,-50%) scale(1);
    opacity:1;
    animation: sway 4.5s ease-in-out infinite;
  }
  @keyframes sway{
    0%,100%{ margin-top:0; }
    50%{ margin-top:-4px; }
  }

  .tree-text{
    position:relative; z-index:2;
    text-align:left;
    padding:22% 9% 9%;
    width:100%;
    background:linear-gradient(90deg, var(--paper) 0%, rgba(255,247,239,.85) 45%, rgba(255,247,239,0) 85%);
  }
  .tree-text .eyebrow{ margin-bottom:2px; }
  .script-title{
    font-family:'Yellowtail', cursive;
    color:var(--rose-deep);
    font-size:clamp(44px,12vw,60px);
    line-height:.95;
    margin:0 0 6px;
  }
  .tree-text .subtitle{ text-align:left; margin-top:2px; }

  /* ==================== ambient floating emojis ==================== */
  .float-layer{
    position:absolute; inset:0; overflow:hidden; pointer-events:none;
    z-index:0;
  }
  .float-emoji{
    position:absolute; bottom:-8%; pointer-events:none;
    opacity:0; line-height:1; will-change:transform,opacity;
    animation-name: float-up; animation-timing-function: linear; animation-iteration-count: infinite;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.06));
  }
  @keyframes float-up{
    0%{ transform:translateY(0) translateX(0) rotate(-6deg); opacity:0; }
    12%{ opacity:.8; }
    85%{ opacity:.75; }
    100%{ transform:translateY(-125vh) translateX(var(--drift,24px)) rotate(10deg); opacity:0; }
  }

  /* skip control */
  #skip-btn{
    position:absolute; top:14px; right:14px; z-index:10;
    background:rgba(0,0,0,.18); color:#fff; border:none; border-radius:20px;
    font-family:'Fredoka',sans-serif; font-size:11px; padding:6px 12px;
    opacity:.55; cursor:pointer;
  }

  /* music toggle */
  #music-btn{
    position:absolute; top:14px; left:14px; z-index:10;
    background:rgba(0,0,0,.18); color:#fff; border:none; border-radius:50%;
    width:34px; height:34px; font-size:15px; line-height:1;
    opacity:.6; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }

  @media (prefers-reduced-motion: reduce){
    .mini-heart.bloomed{ animation:none; }
    .scene{ transition:opacity .3s linear; }
    .float-emoji{ display:none; }
  }
</style>
</head>
<body>

<div id="stage-frame">
  <div id="stage">

    <button id="skip-btn" title="restart">restart</button>
    <button id="music-btn" title="toggle music">🔈</button>

    <!-- ================= BACKGROUND MUSIC =================
         Drop your own audio file next to this HTML file and point
         MUSIC_SRC (in the config below) at its filename — e.g.
         "music.mp3". Mobile browsers block autoplay until the
         person interacts, so playback starts on their first tap
         (pulling the bow) and can be muted with the speaker icon. -->
    <audio id="bgm" loop preload="auto"></audio>

    <!-- ================= SCENE 1: ARCHERY ================= -->
    <section id="scene-archery" class="scene active">
      <svg id="archery-svg" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice">

        <text x="540" y="230" text-anchor="middle" font-family="Fredoka" font-style="italic"
              font-size="34" fill="#4a2e2e" opacity=".55" id="archer-caption">a little something, for you</text>

        <g id="heart-anchor" transform="translate(540,420)">
          <g id="heart-target" class="heart-glow">
            <text text-anchor="middle" dominant-baseline="central" font-size="150">💓</text>
          </g>
        </g>

        <g id="burst-layer"></g>

        <g id="bow-group" transform="translate(230,1330)">
          <path class="limb" id="limb-top" d="M0,-140 Q60,-70 0,0"/>
          <path class="limb" id="limb-bottom" d="M0,0 Q60,70 0,140"/>
          <polyline id="bow-string" points="0,-140 0,0 0,140"/>
          <g id="arrow-group">
            <line id="arrow-shaft" x1="0" y1="0" x2="150" y2="0"/>
            <polygon id="arrow-head" points="150,0 130,-9 130,9"/>
            <polygon id="arrow-fletch" points="0,0 -18,-10 -10,0 -18,10"/>
          </g>
        </g>

        <text class="archer-hint" x="540" y="1660" id="pull-hint">PULL &amp; RELEASE</text>
      </svg>
    </section>

    <!-- ================= SCENE 2: TITLE ================= -->
    <section id="scene-title" class="scene">
      <p class="eyebrow" id="title-eyebrow">make a wish...</p>
      <h1 class="title" id="title-main">Happy<br>Birthday</h1>
      <div class="swash"></div>
      <p class="subtitle" id="title-sub">to someone worth celebrating</p>
    </section>

    <!-- ================= SCENE 3: TREE ================= -->
    <section id="scene-tree" class="scene">
      <div id="tree-wrap">
        <div id="trunk"></div>
        <svg id="branches-svg" viewBox="0 0 200 200" preserveAspectRatio="none">
          <path class="branch" id="branch-right" d="M100,190 C165,138 200,95 200,62 C200,30 172,10 143,10 C120,10 104,24 100,46"/>
          <path class="branch" id="branch-left"  d="M100,190 C35,138 0,95 0,62 C0,30 28,10 57,10 C80,10 96,24 100,46"/>
        </svg>
        <div id="canopy"></div>
      </div>
      <div class="tree-text">
        <p class="eyebrow" id="tree-eyebrow">and... make it count</p>
        <h2 class="script-title" id="tree-script">Happy<br>Birthday</h2>
        <p class="subtitle" id="tree-sub" style="margin-left:0;text-align:left;">here's to a year that blooms</p>
      </div>
    </section>

  </div>
</div>

<script>
(function(){
  "use strict";

  /* =====================================================
     CONFIG — change the words / colors / counts here
     ===================================================== */
  const CONFIG = {
    recipientName: null,           // e.g. "Mahima" — if set, swaps into titles below
    archerCaption: "a little something, for you",
    titleEyebrow: "make a wish...",
    titleSub: "to someone worth celebrating",
    treeEyebrow: "and... make it count",
    treeSub: "here's to a year that blooms",
    heartCount: 420,               // how many mini hearts bloom in the canopy
    heartPalette: ["#e2447f","#f6a6c1","#eab35e","#c8175a","#f28aa8","#e8c07d"],
    autoAdvanceTitleMs: 2600,      // how long the title scene holds before the tree
    floatingEmojis: ["🎈","✨","💛","🌸","💗","🌟"],  // ambient background drift
    floatingCount: 12,             // how many per scene
    musicSrc: "music.mp3",         // put your audio file next to this HTML and name it here (mp3/ogg/m4a all fine)
    musicVolume: 0.55,
  };

  if (CONFIG.recipientName){
    document.getElementById('title-sub').textContent = "to " + CONFIG.recipientName + ", worth celebrating";
  }
  document.getElementById('archer-caption').textContent = CONFIG.archerCaption;
  document.getElementById('title-eyebrow').textContent = CONFIG.titleEyebrow;
  document.getElementById('title-sub').textContent = CONFIG.titleSub;
  document.getElementById('tree-eyebrow').textContent = CONFIG.treeEyebrow;
  document.getElementById('tree-sub').textContent = CONFIG.treeSub;

  /* =====================================================
     Background music — starts on the first tap (mobile/desktop
     autoplay rules require a user gesture). If that first attempt
     gets blocked, it keeps retrying on every subsequent tap
     instead of giving up — Chrome/Firefox/Edge are stricter about
     this than some browsers, so a single try isn't reliable.
     ===================================================== */
  const bgm = document.getElementById('bgm');
  const musicBtn = document.getElementById('music-btn');
  const stageEl = document.getElementById('stage');
  let musicPlaying = false;

  if (CONFIG.musicSrc){
    bgm.src = CONFIG.musicSrc;
    bgm.volume = CONFIG.musicVolume;
  } else {
    musicBtn.style.display = 'none';
  }

  function tryPlayMusic(){
    if (!CONFIG.musicSrc || musicPlaying) return;
    bgm.play().then(() => {
      musicPlaying = true;
      musicBtn.textContent = bgm.muted ? '🔇' : '🔈';
      stageEl.removeEventListener('pointerdown', tryPlayMusic);
    }).catch(() => {
      // still blocked by this browser's autoplay policy — leave musicPlaying
      // false so the very next tap (anywhere, or the music button) tries again
    });
  }
  stageEl.addEventListener('pointerdown', tryPlayMusic);

  musicBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!musicPlaying){ tryPlayMusic(); return; }
    bgm.muted = !bgm.muted;
    musicBtn.textContent = bgm.muted ? '🔇' : '🔈';
  });

  /* =====================================================
     Scene switching
     ===================================================== */
  const scenes = {
    archery: document.getElementById('scene-archery'),
    title:   document.getElementById('scene-title'),
    tree:    document.getElementById('scene-tree'),
  };

  // ambient floating emojis, one independent layer per scene, sitting behind
  // that scene's own content (inserted as the first child)
  function addFloatingLayer(sceneEl){
    const layer = document.createElement('div');
    layer.className = 'float-layer';
    for (let i=0;i<CONFIG.floatingCount;i++){
      const span = document.createElement('span');
      span.className = 'float-emoji';
      span.textContent = CONFIG.floatingEmojis[Math.floor(Math.random()*CONFIG.floatingEmojis.length)];
      const size = 14 + Math.random()*20;
      const dur = 12 + Math.random()*14;
      const delay = -Math.random()*dur;   // negative delay = already mid-flight, so they're staggered on load
      const drift = Math.round(Math.random()*80-40) + 'px';
      span.style.left = Math.random()*100 + '%';
      span.style.fontSize = size + 'px';
      span.style.setProperty('--drift', drift);
      span.style.animationDuration = dur + 's';
      span.style.animationDelay = delay + 's';
      layer.appendChild(span);
    }
    sceneEl.insertBefore(layer, sceneEl.firstChild);
  }
  Object.values(scenes).forEach(addFloatingLayer);
  let currentSceneName = 'archery';
  function showScene(name){
    if (name === currentSceneName) return;
    const prev = scenes[currentSceneName];
    const next = scenes[name];
    prev.classList.remove('active');
    prev.classList.add('exiting');
    setTimeout(() => prev.classList.remove('exiting'), 750);
    next.classList.add('active');
    currentSceneName = name;
  }

  /* =====================================================
     SCENE 1 — bow + arrow interaction
     ===================================================== */
  const svg = document.getElementById('archery-svg');
  const bowGroup = document.getElementById('bow-group');
  const arrowGroup = document.getElementById('arrow-group');
  const bowString = document.getElementById('bow-string');
  const limbTop = document.getElementById('limb-top');
  const limbBottom = document.getElementById('limb-bottom');
  const heartTarget = document.getElementById('heart-target');
  const burstLayer = document.getElementById('burst-layer');
  const pullHint = document.getElementById('pull-hint');

  // bow sits at (230,1330); heart sits at (540,420) — aim direction:
  const bowAnchor = {x:230, y:1330};
  const targetPoint = {x:540, y:420};
  const dx = targetPoint.x - bowAnchor.x, dy = targetPoint.y - bowAnchor.y;
  const dist = Math.hypot(dx,dy);
  const dir = {x:dx/dist, y:dy/dist};              // unit vector bow -> heart
  const angleDeg = Math.atan2(dir.y, dir.x) * 180/Math.PI;

  bowGroup.setAttribute('transform', `translate(${bowAnchor.x},${bowAnchor.y}) rotate(${angleDeg})`);

  const REST_OFFSET = 150;   // arrow tip distance from bow at rest, along aim dir
  const MAX_PULL = 130;      // how far back the string can be drawn
  const FIRE_THRESHOLD = 22; // minimum pull to actually loose the arrow

  let pulling = false;
  let pullAmount = 0;
  let pointerStart = null;

  function setArrow(pull){
    // arrow slides back along local +x axis (bow-local coords, since group is rotated)
    const nockX = REST_OFFSET - pull;
    arrowGroup.setAttribute('transform', `translate(${nockX},0)`);
    // string bends to meet the nock point
    bowString.setAttribute('points', `0,-140 ${nockX - REST_OFFSET},0 0,140`);
    // limbs flex slightly with pull
    const flex = 60 + pull*0.25;
    limbTop.setAttribute('d', `M0,-140 Q${flex},-70 0,0`);
    limbBottom.setAttribute('d', `M0,0 Q${flex},70 0,140`);
  }
  setArrow(0);

  function toSvgPoint(evt){
    const pt = svg.createSVGPoint();
    const t = evt.touches ? evt.touches[0] : evt;
    pt.x = t.clientX; pt.y = t.clientY;
    const ctm = svg.getScreenCTM().inverse();
    return pt.matrixTransform(ctm);
  }

  function startPull(evt){
    pulling = true;
    pointerStart = toSvgPoint(evt);
    pullHint.style.opacity = 0;
    try { svg.setPointerCapture(evt.pointerId); } catch(e){}
    evt.preventDefault();
  }
  function movePull(evt){
    if (!pulling) return;
    const p = toSvgPoint(evt);
    // project (p - bowAnchor) onto -dir to get how far "back" they've pulled
    const vx = p.x - bowAnchor.x, vy = p.y - bowAnchor.y;
    const along = vx*dir.x + vy*dir.y;         // distance along aim direction (negative = pulled back)
    let pull = REST_OFFSET - along;
    pull = Math.max(0, Math.min(MAX_PULL, pull));
    pullAmount = pull;
    setArrow(pull);
    evt.preventDefault();
  }
  function endPull(evt){
    if (!pulling) return;
    pulling = false;
    if (pullAmount >= FIRE_THRESHOLD){
      fireArrow(pullAmount);
    } else {
      springBack();
    }
  }

  function springBack(){
    const start = pullAmount, t0 = performance.now(), dur=260;
    function step(t){
      const k = Math.min(1,(t-t0)/dur);
      const val = start*(1-k);
      setArrow(val);
      pullAmount = val;
      if (k<1) requestAnimationFrame(step);
      else { pullHint.style.opacity = .4; }
    }
    requestAnimationFrame(step);
  }

  svg.addEventListener('pointerdown', startPull);
  window.addEventListener('pointermove', movePull);
  window.addEventListener('pointerup', endPull);

  function fireArrow(power){
    // detach a flying arrow copy and animate it from the nock to the heart
    const nockX = REST_OFFSET - power;
    const startLocal = {x:nockX, y:0};
    // convert bow-local point to svg-root coords (rotate + translate)
    const rad = angleDeg*Math.PI/180;
    const startWorld = {
      x: bowAnchor.x + startLocal.x*Math.cos(rad) - startLocal.y*Math.sin(rad),
      y: bowAnchor.y + startLocal.x*Math.sin(rad) + startLocal.y*Math.cos(rad)
    };

    const flying = document.createElementNS('http://www.w3.org/2000/svg','g');
    flying.setAttribute('transform', `translate(${startWorld.x},${startWorld.y}) rotate(${angleDeg})`);
    flying.innerHTML = `
      <line x1="0" y1="0" x2="150" y2="0" stroke="#5b3a2c" stroke-width="6" stroke-linecap="round"/>
      <polygon points="150,0 130,-9 130,9" fill="#eab35e"/>
      <polygon points="0,0 -18,-10 -10,0 -18,10" fill="#e2447f"/>
    `;
    svg.appendChild(flying);

    // reset the bow's static arrow instantly (it "left the string")
    setArrow(0); pullAmount = 0;

    const t0 = performance.now(), dur = 340;
    const travelDist = Math.hypot(targetPoint.x-startWorld.x, targetPoint.y-startWorld.y) - 60;
    function step(t){
      const k = Math.min(1, (t-t0)/dur);
      const ease = 1 - Math.pow(1-k, 3);
      const d = travelDist*ease;
      flying.setAttribute('transform', `translate(${startWorld.x + dir.x*d},${startWorld.y + dir.y*d}) rotate(${angleDeg})`);
      if (k<1) requestAnimationFrame(step);
      else { flying.remove(); hitHeart(); }
    }
    requestAnimationFrame(step);
  }

  function hitHeart(){
    // pulse the heart on impact
    heartTarget.animate(
      [{transform:'scale(1)'}, {transform:'scale(1.4)'}, {transform:'scale(1.05)'}],
      {duration:260, easing:'ease-out', fill:'forwards'}
    );

    // then it drops — gravity + tumble + fade
    setTimeout(() => {
      const dropAnim = heartTarget.animate(
        [
          {transform:'translate(0px,0px) rotate(0deg) scale(1.05)', opacity:1, offset:0},
          {transform:'translate(-30px,120px) rotate(-25deg) scale(1)', opacity:1, offset:.4},
          {transform:'translate(-60px,520px) rotate(-70deg) scale(.85)', opacity:0, offset:1}
        ],
        {duration:700, easing:'cubic-bezier(.55,0,.85,.4)', fill:'forwards'}
      );
    }, 260);

    // burst of small hearts drifting up & out
    const glyphs = ['💗','💛','💕','🩷'];
    for (let i=0;i<16;i++){
      const el = document.createElementNS('http://www.w3.org/2000/svg','text');
      const ang = (Math.random()*Math.PI*2);
      const r0 = 10;
      const x0 = targetPoint.x + Math.cos(ang)*r0;
      const y0 = targetPoint.y + Math.sin(ang)*r0;
      el.setAttribute('x', x0); el.setAttribute('y', y0);
      el.setAttribute('font-size', 20+Math.random()*22);
      el.setAttribute('text-anchor','middle');
      el.setAttribute('opacity','0');
      el.textContent = glyphs[i % glyphs.length];
      burstLayer.appendChild(el);

      const dxp = (Math.random()-0.5)*260;
      const dyp = -(120 + Math.random()*260);
      const dur = 1100 + Math.random()*700;
      const delay = Math.random()*150;
      const anim = el.animate(
        [
          {transform:'translate(0px,0px)', opacity:0, offset:0},
          {transform:'translate(0px,0px)', opacity:1, offset:0.08},
          {transform:`translate(${dxp}px,${dyp}px)`, opacity:0, offset:1}
        ],
        {duration:dur, delay:delay, easing:'cubic-bezier(.2,.6,.3,1)', fill:'forwards'}
      );
    }

    // wait for the pulse + drop to finish, then slide into the title scene
    setTimeout(() => {
      showScene('title');
      setTimeout(() => {
        showScene('tree');
        growTree();
      }, CONFIG.autoAdvanceTitleMs);
    }, 260 + 700 + 120);
  }

  /* =====================================================
     SCENE 3 — trunk grows, heart-shaped canopy blooms
     ===================================================== */
  const trunkEl = document.getElementById('trunk');
  const canopyEl = document.getElementById('canopy');
  const branchPaths = Array.from(document.querySelectorAll('#branches-svg path'));
  let treeGrown = false;

  // prime each branch path for a stroke draw-in animation
  branchPaths.forEach(p => {
    const len = p.getTotalLength();
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
  });

  const BRANCH_DRAW_MS = 900;
  function growBranches(){
    branchPaths.forEach((p,i) => {
      setTimeout(() => {
        p.style.transition = 'stroke-dashoffset 850ms cubic-bezier(.3,.7,.2,1)';
        p.style.strokeDashoffset = 0;
      }, i*150);
    });
  }

  function inHeart(x,y){
    // classic implicit heart curve: (x^2+y^2-1)^3 - x^2 y^3 <= 0
    const a = x*x + y*y - 1;
    return (a*a*a - x*x*y*y*y) <= 0;
  }

  function sampleHeartPoints(n){
    const pts = [];
    let attempts = 0;
    while (pts.length < n && attempts < 40000){
      attempts++;
      const x = (Math.random()*2-1)*1.35;
      const y = (Math.random()*2-1)*1.3;
      if (inHeart(x,y)) pts.push({x,y});
    }
    return pts;
  }

  const TRUNK_GROW_MS = 1400; // keep in sync with #trunk's CSS transition duration

  function growTree(){
    if (treeGrown) return;
    treeGrown = true;

    // 1) stem grows first, on its own — leaves room above it for the heart
    trunkEl.style.height = '28%';

    // 2) once the stem is up, the two branches draw upward from its tip,
    //    tracing the outline of a heart (not from the ground)
    setTimeout(growBranches, TRUNK_GROW_MS);

    // 3) only once stem + branch outline are in place do the mini hearts
    //    bloom to fill in that same heart shape
    setTimeout(() => {
      const pts = sampleHeartPoints(CONFIG.heartCount);
      const w = canopyEl.clientWidth, h = canopyEl.clientHeight;

      function placeHeart(local200X, local200Y, delay, sizeOverride){
        const span = document.createElement('span');
        span.className = 'mini-heart';
        const glyphs = ['💗','💛','💕','🌹','🩷','💖'];
        span.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
        const size = sizeOverride || (14 + Math.random()*16);
        span.style.fontSize = size+'px';
        span.style.color = CONFIG.heartPalette[Math.floor(Math.random()*CONFIG.heartPalette.length)];
        span.style.left = (local200X/200*w) + 'px';
        span.style.top  = (local200Y/200*h) + 'px';
        canopyEl.appendChild(span);
        setTimeout(() => span.classList.add('bloomed'), delay);
      }

      // guaranteed "cap" cluster right at the bottom tip (where the two
      // branches meet, just above the trunk) — random sampling alone is too
      // sparse there since the heart pinches to a point, which is exactly
      // what was leaving the brown branch V visible underneath
      const capCount = 16;
      for (let i=0;i<capCount;i++){
        const jitterX = (Math.random()-0.5) * 34;
        const jitterY = Math.random() * 16;
        placeHeart(100 + jitterX, 188 - jitterY, Math.random()*250, 16 + Math.random()*10);
      }

      pts.forEach((p, i) => {
        // map the sampled heart-curve point into the SAME 0..200 local box
        // that #branches-svg's viewBox uses, then to this element's pixels —
        // so the fill lines up with the branch-drawn outline exactly.
        const local200X = 100 + (p.x/1.35) * 95;
        const local200Y = 190 - ( (p.y/1.3 + 1)/2 ) * 170;
        const delay = Math.random()*1400 + i*2;
        placeHeart(local200X, local200Y, delay);
      });
    }, TRUNK_GROW_MS + BRANCH_DRAW_MS);
  }

  /* restart control */
  document.getElementById('skip-btn').addEventListener('click', () => {
    location.reload();
  });

})();
</script>
</body>
</html>

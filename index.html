<!DOCTYPE html>
<html lang="en">
<head>

      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Happy Birthday · Draw the Bow</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Quicksand:wght@400;500;600&family=Playfair+Display:wght@700;900&family=Yellowtail&display=swap" rel="stylesheet">

<style>

/* =========================================================
   BASIC SETUP
========================================================= */

:root{
    --cream:#fff3e6;
    --cream2:#fde2d0;

    --brown:#56352f;
    --brown2:#6c4038;

    --pink:#e2447f;
    --deepPink:#c8175a;
    --lightPink:#f7a9c3;

    --gold:#eab35e;
    --paper:#fff9f2;
}

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;

    overflow:hidden;

    background:#170d12;

    font-family:'Quicksand',sans-serif;

    -webkit-tap-highlight-color:transparent;
}


/* =========================================================
   STAGE
========================================================= */

#stage-frame{
    position:fixed;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;
}

#stage{

    position:relative;

    width:min(100vw,56.25vh);
    height:min(177.78vw,100vh);

    overflow:hidden;

    background:
        radial-gradient(
            ellipse at 50% 35%,
            #fffdf8 0%,
            var(--cream) 50%,
            var(--cream2) 100%
        );

    box-shadow:
        0 0 70px rgba(0,0,0,.55);
}


/* =========================================================
   SCENES
========================================================= */

.scene{

    position:absolute;
    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    opacity:0;

    pointer-events:none;

    transition:
        opacity 1.1s ease;
}

.scene.active{

    opacity:1;

    pointer-events:auto;
}


/* =========================================================
   RESTART
========================================================= */

#restart{

    position:absolute;

    top:14px;
    right:14px;

    z-index:100;

    border:0;

    padding:7px 13px;

    border-radius:20px;

    background:rgba(0,0,0,.15);

    color:white;

    font-family:'Fredoka',sans-serif;

    font-size:11px;

    cursor:pointer;

    opacity:.55;
}


/* =========================================================
   SCENE 1
   ARCHERY
========================================================= */

#scene-archery{

    background:
        radial-gradient(
            ellipse at 50% 30%,
            #ffd9c2 0%,
            #fdece0 55%,
            #fbdcc9 100%
        );
}

#archery-svg{

    width:100%;
    height:100%;

    touch-action:none;

    user-select:none;
}

#bow-group path{

    fill:none;

    stroke:#59382f;

    stroke-width:14;

    stroke-linecap:round;
}

#bow-string{

    fill:none;

    stroke:#8c7969;

    stroke-width:2.5;
}

#arrow-shaft{

    stroke:#59382f;

    stroke-width:6;

    stroke-linecap:round;
}

#arrow-head{

    fill:var(--gold);
}

#arrow-fletch{

    fill:var(--pink);
}

#heart-target{

    filter:
        drop-shadow(
            0 0 35px
            rgba(216,60,110,.45)
        );
}

#pull-hint{

    fill:#4a2e2e;

    opacity:.45;

    font-family:'Fredoka',sans-serif;

    font-size:23px;

    font-weight:600;

    letter-spacing:.12em;

    text-anchor:middle;

    animation:hintPulse 1.8s infinite;
}

@keyframes hintPulse{

    0%,100%{
        opacity:.25;
    }

    50%{
        opacity:.6;
    }
}


/* =========================================================
   SCENE 2
========================================================= */

#scene-title{

    background:
        radial-gradient(
            120% 90% at 50% 30%,
            #e2447f,
            #c8175a 65%,
            #8f0f42
        );

    flex-direction:column;
}

.title-eyebrow{

    color:white;

    opacity:.75;

    font-family:'Fredoka',sans-serif;

    font-style:italic;

    margin-bottom:10px;
}

.title{

    margin:0;

    text-align:center;

    color:white;

    font-family:'Playfair Display',serif;

    font-size:clamp(48px,13vw,72px);

    line-height:.98;

    text-shadow:
        0 6px 30px rgba(0,0,0,.25);
}

.title-line{

    width:140px;

    height:18px;

    margin:15px auto 5px;

    border-bottom:3px solid var(--gold);

    border-radius:50%;
}

.title-sub{

    color:white;

    opacity:.75;

    font-family:'Fredoka',sans-serif;

    font-style:italic;
}


/* =========================================================
   SCENE 3
   TREE
========================================================= */

#scene-tree{

    display:block;

    background:
        radial-gradient(
            ellipse at 50% 30%,
            #fffdf8 0%,
            #fff2e4 55%,
            #fbdccc 100%
        );

    overflow:hidden;
}


/* =========================================================
   SOFT LIGHT
========================================================= */

#scene-tree::before{

    content:"";

    position:absolute;

    inset:-20%;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(255,255,255,.9),
            transparent 48%
        );

    pointer-events:none;
}


/* =========================================================
   TREE SVG
========================================================= */

#tree-svg{

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    z-index:3;

    overflow:visible;
}


/* Main trunk */

.trunk{

    fill:url(#trunkGradient);

    transform-origin:center bottom;

    transform:scaleY(0);

    transition:
        transform 1.8s
        cubic-bezier(.22,.9,.3,1);
}

#scene-tree.tree-growing .trunk{

    transform:scaleY(1);
}


/* Main branches */

.branch{

    fill:none;

    stroke:#56352f;

    stroke-linecap:round;

    stroke-linejoin:round;

    stroke-dasharray:1200;

    stroke-dashoffset:1200;

    opacity:1;
}


/* Different thicknesses */

.main-branch{

    stroke-width:27;
}

.secondary-branch{

    stroke-width:12;
}

.small-branch{

    stroke-width:6;
}


/* branch animation */

#scene-tree.tree-growing .branch{

    animation:
        drawBranch 1.35s
        cubic-bezier(.45,0,.25,1)
        forwards;
}

#scene-tree.tree-growing .branch:nth-of-type(2){
    animation-delay:.25s;
}

#scene-tree.tree-growing .branch:nth-of-type(3){
    animation-delay:.4s;
}

#scene-tree.tree-growing .branch:nth-of-type(4){
    animation-delay:.55s;
}

#scene-tree.tree-growing .branch:nth-of-type(5){
    animation-delay:.7s;
}

#scene-tree.tree-growing .branch:nth-of-type(6){
    animation-delay:.85s;
}

#scene-tree.tree-growing .branch:nth-of-type(7){
    animation-delay:1s;
}

#scene-tree.tree-growing .branch:nth-of-type(8){
    animation-delay:1.1s;
}

@keyframes drawBranch{

    to{
        stroke-dashoffset:0;
    }
}


/* =========================================================
   HEART CANOPY
========================================================= */

#heart-canopy{

    position:absolute;

    left:7%;
    top:4%;

    width:86%;
    height:60%;

    z-index:5;

    pointer-events:none;
}


/* Individual canopy hearts */

.canopy-heart{

    position:absolute;

    transform:
        translate(-50%,-50%)
        scale(0);

    opacity:0;

    line-height:1;

    filter:
        drop-shadow(
            0 1px 2px
            rgba(100,30,50,.15)
        );

    transition:
        transform .55s
        cubic-bezier(.34,1.56,.64,1),
        opacity .4s ease;
}


/* bloom */

.canopy-heart.bloom{

    transform:
        translate(-50%,-50%)
        scale(1);

    opacity:.9;
}


/* tiny movement after blooming */

.canopy-heart.bloom{

    animation:
        heartFloat
        4.5s
        ease-in-out
        infinite;
}

@keyframes heartFloat{

    0%,100%{
        margin-top:0;
    }

    50%{
        margin-top:-2px;
    }
}


/* =========================================================
   OUTER FLOATING HEARTS
========================================================= */

.floating-heart{

    position:absolute;

    z-index:2;

    font-size:18px;

    opacity:.65;

    animation:
        floatingHeart
        5s
        ease-in-out
        infinite;
}

@keyframes floatingHeart{

    0%,100%{
        transform:translateY(0) rotate(-5deg);
    }

    50%{
        transform:translateY(-12px) rotate(5deg);
    }
}


/* =========================================================
   BIRTHDAY TEXT
========================================================= */

.tree-message{

    position:absolute;

    left:6%;

    bottom:8%;

    width:46%;

    z-index:20;

    text-align:left;

    pointer-events:none;

    font-style:italic;

.tree-message-title{

.tree-message-sub{

    font-weight:700;
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    .scene{
        transition:none;
    }

    .canopy-heart{
        transition:none;
    }

    .floating-heart{
        animation:none;
    }

}

</style>

<script>

"use strict";


/* =========================================================
   CONFIGURATION
========================================================= */

const CONFIG = {

    titleDelay:2600,

    treeDelay:250,

    canopyCount:520,

    canopyColors:[
        "#e2447f",
        "#f06f9b",
        "#f6a6c1",
        "#e92d6c",
        "#ff8eb0",
        "#eab35e"
    ]

};



/* =========================================================
   SCENE ELEMENTS
========================================================= */

const scenes = {

    archery:
        document.getElementById("scene-archery"),

    title:
        document.getElementById("scene-title"),

    tree:
        document.getElementById("scene-tree")

};


function showScene(name){

    Object.values(scenes).forEach(scene => {

        scene.classList.remove("active");

    });

    scenes[name].classList.add("active");

}



/* =========================================================
   ARCHERY
========================================================= */

const svg =
    document.getElementById("archery-svg");

const bowGroup =
    document.getElementById("bow-group");

const arrowGroup =
    document.getElementById("arrow-group");

const bowString =
    document.getElementById("bow-string");

const limbTop =
    document.getElementById("limb-top");

const limbBottom =
    document.getElementById("limb-bottom");

const heartTarget =
    document.getElementById("heart-target");

const burstLayer =
    document.getElementById("burst-layer");

const pullHint =
    document.getElementById("pull-hint");


const bowAnchor = {
    x:230,
    y:1330
};

const targetPoint = {
    x:540,
    y:420
};


const dx =
    targetPoint.x - bowAnchor.x;

const dy =
    targetPoint.y - bowAnchor.y;

const distance =
    Math.hypot(dx,dy);

const direction = {

    x:dx/distance,

    y:dy/distance

};


const angle =
    Math.atan2(
        direction.y,
        direction.x
    ) * 180 / Math.PI;


bowGroup.setAttribute(
    "transform",
    `translate(
        ${bowAnchor.x},
        ${bowAnchor.y}
    ) rotate(${angle})`
);


const REST_OFFSET = 150;

const MAX_PULL = 130;

const FIRE_THRESHOLD = 40;

let pulling = false;

let pullAmount = 0;


function setArrow(pull){

    const nockX =
        REST_OFFSET - pull;

    arrowGroup.setAttribute(
        "transform",
        `translate(${nockX},0)`
    );


    bowString.setAttribute(
        "points",
        `0,-140
         ${nockX - REST_OFFSET},0
         0,140`
    );


    const flex =
        60 + pull * .25;


    limbTop.setAttribute(
        "d",
        `M0,-140
         Q${flex},-70 0,0`
    );


    limbBottom.setAttribute(
        "d",
        `M0,0
         Q${flex},70 0,140`
    );

}


setArrow(0);



/* SVG pointer conversion */

function toSVGPoint(event){

    const point =
        svg.createSVGPoint();

    point.x =
        event.clientX;

    point.y =
        event.clientY;

    const matrix =
        svg
        .getScreenCTM()
        .inverse();

    return point.matrixTransform(matrix);

}


/* Start pulling */

svg.addEventListener(
    "pointerdown",
    event => {

        pulling = true;

        pullHint.style.opacity = "0";

        event.preventDefault();

    }
);


/* Move */

window.addEventListener(
    "pointermove",
    event => {

        if(!pulling)
            return;


        const point =
            toSVGPoint(event);


        const vx =
            point.x - bowAnchor.x;

        const vy =
            point.y - bowAnchor.y;


        const along =
            vx * direction.x +
            vy * direction.y;


        let pull =
            REST_OFFSET - along;


        pull =
            Math.max(
                0,
                Math.min(
                    MAX_PULL,
                    pull
                )
            );


        pullAmount = pull;

        setArrow(pull);

        event.preventDefault();

    }
);


/* Release */

window.addEventListener(
    "pointerup",
    () => {

        if(!pulling)
            return;

        pulling = false;


        if(
            pullAmount >=
            FIRE_THRESHOLD
        ){

            fireArrow();

        }else{

            springBack();

        }

    }
);



/* =========================================================
   SPRING BACK
========================================================= */

function springBack(){

    const start =
        pullAmount;

    const startTime =
        performance.now();

    const duration =
        260;


    function animate(time){

        const progress =
            Math.min(
                1,
                (time-startTime)/duration
            );


        const value =
            start * (1-progress);


        setArrow(value);


        if(progress < 1){

            requestAnimationFrame(
                animate
            );

        }else{

            pullHint.style.opacity =
                ".4";

        }

    }


    requestAnimationFrame(
        animate
    );

}



/* =========================================================
   FIRE ARROW
========================================================= */

function fireArrow(){

    const startX =
        bowAnchor.x;

    const startY =
        bowAnchor.y;


    const flying =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "g"
        );


    flying.innerHTML = `

        <line
            x1="0"
            y1="0"
            x2="150"
            y2="0"
            stroke="#59382f"
            stroke-width="6"
            stroke-linecap="round"
        />

        <polygon
            points="150,0 130,-9 130,9"
            fill="#eab35e"
        />

        <polygon
            points="0,0 -18,-10 -10,0 -18,10"
            fill="#e2447f"
        />

    `;


    flying.setAttribute(
        "transform",
        `translate(
            ${startX},
            ${startY}
        )
        rotate(${angle})`
    );


    svg.appendChild(flying);


    setArrow(0);

    pullAmount = 0;


    const startTime =
        performance.now();

    const duration =
        650;


    function fly(time){

        const progress =
            Math.min(
                1,
                (time-startTime)/duration
            );


        const ease =
            1 -
            Math.pow(
                1-progress,
                3
            );


        const x =
            startX +
            direction.x *
            distance *
            ease;


        const y =
            startY +
            direction.y *
            distance *
            ease;


        flying.setAttribute(
            "transform",
            `translate(${x},${y})
             rotate(${angle})`
        );


        if(progress < 1){

            requestAnimationFrame(
                fly
            );

        }else{

            flying.remove();

            hitHeart();

        }

    }


    requestAnimationFrame(
        fly
    );

}



/* =========================================================
   HEART HIT
========================================================= */

function hitHeart(){

    heartTarget.animate(

        [

            {
                transform:
                    "translate(540px,420px) scale(1)"
            },

            {
                transform:
                    "translate(540px,470px) scale(1.35)"
            },

            {
                transform:
                    "translate(540px,650px) scale(.9)"
            },

            {
                transform:
                    "translate(540px,900px) scale(.4)",
                opacity:0
            }

        ],

        {
            duration:900,
            easing:"cubic-bezier(.2,.7,.3,1)",
            fill:"forwards"
        }

    );


    createBurst();


    setTimeout(
        () => {

            showScene("title");


            setTimeout(
                () => {

                    showScene("tree");

                    startTree();

                },
                CONFIG.titleDelay
            );

        },
        900
    );

}



/* =========================================================
   HEART BURST
========================================================= */

function createBurst(){

    const hearts = [
        "💗",
        "💖",
        "💕",
        "🩷",
        "💛",
        "✨",
        "💞"
    ];


    for(
        let i=0;
        i<18;
        i++
    ){

        const heart =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "text"
            );


        heart.textContent =
            hearts[
                i % hearts.length
            ];


        heart.setAttribute(
            "x",
            targetPoint.x
        );

        heart.setAttribute(
            "y",
            targetPoint.y
        );


        heart.setAttribute(
            "font-size",
            20 + Math.random()*22
        );


        heart.setAttribute(
            "text-anchor",
            "middle"
        );


        heart.setAttribute(
            "opacity",
            "0"
        );


        burstLayer.appendChild(
            heart
        );


        const x =
            (Math.random()-.5)*260;

        const y =
            -(100+Math.random()*300);


        heart.animate(

            [

                {
                    transform:
                        "translate(0,0)",
                    opacity:0
                },

                {
                    transform:
                        "translate(0,0)",
                    opacity:1
                },

                {
                    transform:
                        `translate(${x}px,${y}px)`,
                    opacity:0
                }

            ],

            {

                duration:
                    1000+
                    Math.random()*700,

                easing:
                    "cubic-bezier(.2,.6,.3,1)"

            }

        );

    }

}



/* =========================================================
   TREE START
========================================================= */

let treeStarted = false;


function startTree(){

    if(treeStarted)
        return;

    treeStarted = true;


    const treeScene =
        document.getElementById(
            "scene-tree"
        );


    treeScene.classList.add(
        "tree-growing"
    );


    /*
       Wait for the branches to appear,
       then start the heart canopy.
    */

    setTimeout(
        createHeartCanopy,
        1200
    );

}



/* =========================================================
   HEART CANOPY
========================================================= */

const canopy =
    document.getElementById(
        "heart-canopy"
    );


/*
   Heart equation:

   x = 16 sin³(t)

   y =
   13cos(t)
   -5cos(2t)
   -2cos(3t)
   -cos(4t)

   We use the mathematical heart shape
   to position hundreds of tiny hearts.
*/


function heartPoint(t){

    const x =
        16 *
        Math.pow(
            Math.sin(t),
            3
        );


    const y =
        13 *
        Math.cos(t)
        -5 *
        Math.cos(2*t)
        -2 *
        Math.cos(3*t)
        -Math.cos(4*t);


    return {
        x,
        y
    };

}



/*
   Point inside heart.

   Instead of random scattered points,
   we generate a dense grid and keep
   only points that fall inside the
   actual mathematical heart.
*/

function isInsideHeart(x,y){

    const xx =
        x / 16;

    const yy =
        y / 17;


    /*
       Classic implicit heart.
    */

    const value =
        Math.pow(
            xx*xx +
            yy*yy -
            1,
            3
        )
        -
        xx*xx *
        Math.pow(
            yy,
            3
        );


    return value <= 0;

}



/* =========================================================
   CREATE CANOPY
========================================================= */

function createHeartCanopy(){

    canopy.innerHTML = "";


    const points = [];


    /*
       Dense deterministic grid.
       This prevents ugly random holes.
    */

    for(
        let y=-16;
        y<=17;
        y+=.72
    ){

        for(
            let x=-16;
            x<=16;
            x+=.72
        ){

            if(
                isInsideHeart(
                    x,
                    y
                )
            ){

                points.push({
                    x,
                    y
                });

            }

        }

    }


    /*
       Shuffle slightly so blooming
       doesn't look like a rigid grid.
    */

    points.sort(
        () =>
            Math.random()-.5
    );


    const limited =
        points.slice(
            0,
            CONFIG.canopyCount
        );


    limited.forEach(
        (point,index) => {

            const heart =
                document.createElement(
                    "span"
                );


            heart.className =
                "canopy-heart";


            /*
               Different heart symbols.
            */

            const symbols = [
                "♥",
                "♥",
                "♥",
                "💗",
                "💖",
                "🩷",
                "💕"
            ];


            heart.textContent =
                symbols[
                    Math.floor(
                        Math.random() *
                        symbols.length
                    )
                ];


            /*
               Map mathematical heart
               into the canopy area.
            */

            const left =
                50 +
                (point.x/16) *
                48;


            /*
               Reverse Y because
               CSS coordinates go down.
            */

            const top =
                52 -
                (point.y/17) *
                48;


            heart.style.left =
                left + "%";


            heart.style.top =
                top + "%";


            /*
               Dense outer canopy has
               small hearts, inner area
               has slightly larger ones.
            */

            const distanceFromCenter =
                Math.sqrt(
                    point.x*point.x +
                    point.y*point.y
                );


            let size;


            if(
                distanceFromCenter > 12
            ){

                size =
                    7 +
                    Math.random()*5;

            }else{

                size =
                    8 +
                    Math.random()*7;

            }


            heart.style.fontSize =
                size + "px";


            /*
               Color palette.
            */

            heart.style.color =
                CONFIG.canopyColors[
                    Math.floor(
                        Math.random() *
                        CONFIG.canopyColors.length
                    )
                ];


            /*
               Bloom timing.
            */

            const delay =
                index * 4;


            heart.style.transitionDelay =
                delay + "ms";


            canopy.appendChild(
                heart
            );


            setTimeout(
                () => {

                    heart.classList.add(
                        "bloom"
                    );

                },
                250 + delay
            );

        }
    );

}



/* =========================================================
   RESTART
========================================================= */

document
    .getElementById("restart")
    .addEventListener(
        "click",
        () => {

            location.reload();

        }
    );

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Happy Birthday · Draw the Bow, Hit the Heart</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Quicksand:wght@400;500;600&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Yellowtail&display=swap"
      rel="stylesheet">

<style>

/* =========================================================
   COLORS
========================================================= */

:root{
    --cream:#fdece0;
    --cream2:#fbdcc9;

    --rose-deep:#c8175a;
    --rose-mid:#e2447f;
    --rose-light:#f6a6c1;

    --gold:#eab35e;

    --ink:#4a2e2e;

    --tree:#56342e;
    --tree-light:#70443b;

    --paper:#fff7ef;
}


/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#1b0e14;

    font-family:'Quicksand',sans-serif;

    -webkit-tap-highlight-color:transparent;
}


/* =========================================================
   STAGE
========================================================= */

#stage-frame{
    position:fixed;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;
}

#stage{

    position:relative;

    width:min(100vw,56.25vh);
    height:min(177.78vw,100vh);

    overflow:hidden;

    background:
        linear-gradient(
            180deg,
            var(--cream),
            var(--cream2)
        );

    box-shadow:
        0 0 60px rgba(0,0,0,.5);
}


/* =========================================================
   SCENES
========================================================= */

.scene{

    position:absolute;

    inset:0;

    display:flex;

    flex-direction:column;

    justify-content:center;
    align-items:center;

    opacity:0;

    pointer-events:none;

    transition:
        opacity 1.1s ease;

    overflow:hidden;
}

.scene.active{

    opacity:1;

    pointer-events:auto;
}


/* =========================================================
   TEXT
========================================================= */

.eyebrow{

    margin:0 0 6px;

    font-family:'Fredoka',sans-serif;

    font-style:italic;

    font-weight:500;

    letter-spacing:.02em;

    color:var(--ink);

    opacity:.6;

    font-size:clamp(13px,3.4vw,16px);
}


.subtitle{

    margin-top:10px;

    font-family:'Fredoka',sans-serif;

    font-style:italic;

    color:var(--ink);

    opacity:.6;

    font-size:clamp(12px,3vw,14px);

    text-align:center;
}


/* =========================================================
   SCENE 1
========================================================= */

#scene-archery{

    background:
        radial-gradient(
            ellipse at 50% 34%,
            #ffd9c2 0%,
            var(--cream) 55%,
            var(--cream2) 100%
        );
}


#archery-svg{

    width:100%;
    height:100%;

    touch-action:none;

    user-select:none;
}


.archer-hint{

    fill:var(--ink);

    opacity:.4;

    font-family:'Fredoka',sans-serif;

    letter-spacing:.12em;

    font-size:22px;

    font-weight:600;

    text-anchor:middle;

    animation:pulseHint 1.8s ease-in-out infinite;
}


@keyframes pulseHint{

    0%,100%{
        opacity:.25;
    }

    50%{
        opacity:.55;
    }
}


.heart-glow{

    filter:
        drop-shadow(
            0 0 40px
            rgba(216,60,110,.45)
        );
}


#bow-group path.limb{

    fill:none;

    stroke:#5b3a2c;

    stroke-width:14;

    stroke-linecap:round;
}


#bow-string{

    stroke:#8a7a63;

    stroke-width:2.5;

    fill:none;
}


#arrow-shaft{

    stroke:#5b3a2c;

    stroke-width:6;

    stroke-linecap:round;
}


#arrow-head{

    fill:var(--gold);
}


#arrow-fletch{

    fill:var(--rose-mid);
}


/* =========================================================
   SCENE 2
========================================================= */

#scene-title{

    background:
        radial-gradient(
            120% 90% at 50% 30%,
            var(--rose-mid) 0%,
            var(--rose-deep) 65%,
            #8f0f42 100%
        );
}


#scene-title .eyebrow,
#scene-title .subtitle{

    color:var(--paper);

    opacity:.75;
}


.title{

    font-family:'Playfair Display',serif;

    font-weight:900;

    color:var(--paper);

    font-size:clamp(48px,13.5vw,72px);

    line-height:.98;

    text-align:center;

    margin:2px 0;

    text-shadow:
        0 6px 30px rgba(0,0,0,.25);
}


.swash{

    width:140px;

    height:18px;

    margin:14px auto 4px;

    border-bottom:3px solid var(--gold);

    border-radius:50%;

    transform:
        rotate(-1.5deg)
        scaleY(.6);

    opacity:.9;
}


/* =========================================================
   SCENE 3 — TREE
========================================================= */

#scene-tree{

    justify-content:flex-end;

    background:

        radial-gradient(
            ellipse at 50% 15%,
            #fff3e6 0%,
            var(--cream) 45%,
            var(--cream2) 100%
        );
}


/* =========================================================
   TREE AREA
========================================================= */

#tree-wrap{

    position:relative;

    width:100%;

    height:78%;

    flex:none;

    overflow:visible;
}


/* =========================================================
   TREE SVG
========================================================= */

#tree-svg{

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

    overflow:visible;

    z-index:2;

    pointer-events:none;
}


/* trunk / branches */

.tree-path{

    fill:none;

    stroke:var(--tree);

    stroke-linecap:round;

    stroke-linejoin:round;

    stroke-width:10;

    stroke-dasharray:1000;

    stroke-dashoffset:1000;

    transition:
        stroke-dashoffset 2.8s
        cubic-bezier(.2,.8,.2,1);
}


.tree-path.main{

    stroke-width:28;
}


.tree-path.branch{

    stroke-width:11;
}


.tree-path.small{

    stroke-width:5;
}


/* =========================================================
   EMOJI CANOPY
========================================================= */

#canopy{

    position:absolute;

    left:50%;

    top:2%;

    transform:translateX(-50%);

    width:88%;

    height:78%;

    z-index:5;

    pointer-events:none;

    overflow:visible;
}


/* Every emoji */

.mini-heart{

    position:absolute;

    display:block;

    line-height:1;

    transform:
        translate(-50%,-50%)
        scale(0);

    opacity:0;

    filter:
        drop-shadow(
            0 2px 4px
            rgba(100,30,50,.18)
        );

    transition:
        transform .7s cubic-bezier(.34,1.56,.64,1),
        opacity .5s ease;
}


/* Bloom animation */

.mini-heart.bloomed{

    transform:
        translate(-50%,-50%)
        scale(1);

    opacity:1;

    animation:
        heartFloat
        4s
        ease-in-out
        infinite;
}


@keyframes heartFloat{

    0%,100%{
        margin-top:0;
    }

    50%{
        margin-top:-5px;
    }
}


/* =========================================================
   FLOATING BACKGROUND HEARTS
========================================================= */

.floating-heart{

    position:absolute;

    z-index:1;

    pointer-events:none;

    opacity:.4;

    animation:
        floatingHeart
        5s
        ease-in-out
        infinite;
}


@keyframes floatingHeart{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-14px);
    }
}


/* =========================================================
   BIRTHDAY TEXT
========================================================= */

.tree-text{

    position:relative;

    z-index:20;

    width:100%;

    text-align:left;

    padding:
        0
        8%
        8%;

    flex:none;
}


.tree-text .eyebrow{

    margin-bottom:3px;
}


.script-title{

    font-family:'Yellowtail',cursive;

    color:var(--rose-deep);

    font-size:clamp(44px,12vw,64px);

    line-height:.95;

    margin:0 0 7px;

    text-shadow:
        0 2px 8px rgba(180,40,80,.12);
}


.tree-text .subtitle{

    text-align:left;

    margin-top:0;
}


/* =========================================================
   RESTART
========================================================= */

#skip-btn{

    position:absolute;

    top:14px;

    right:14px;

    z-index:100;

    background:
        rgba(0,0,0,.18);

    color:white;

    border:none;

    border-radius:20px;

    font-family:'Fredoka',sans-serif;

    font-size:11px;

    padding:6px 12px;

    opacity:.55;

    cursor:pointer;
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    .scene{
        transition:opacity .3s linear;
    }

    .mini-heart.bloomed{
        animation:none;
    }

}

</style>
</head>

<script>

(function(){

"use strict";


/* =========================================================
   CONFIGURATION
========================================================= */

const CONFIG = {

    recipientName:null,

    archerCaption:
        "a little something, for you",

    titleEyebrow:
        "make a wish...",

    titleSub:
        "to someone worth celebrating",

    treeEyebrow:
        "and... make it count",

    treeSub:
        "here's to a year that blooms",

    /*
       IMPORTANT

       Increase this for a denser canopy.
    */

    heartCount:700,

    heartEmojis:[
        "💗",
        "💖",
        "💕",
        "🩷",
        "💓",
        "💞",
        "💛",
        "✨",
        "🌟",
'🧡',
'💜',
'🩵',
'💙',
'💚',
'❤️‍🔥',
'🌹',
'💓'
    ],

    autoAdvanceTitleMs:2600

};


/* =========================================================
   OPTIONAL NAME
========================================================= */

if(CONFIG.recipientName){

    document.getElementById("title-sub").textContent =
        "to " + CONFIG.recipientName +
        ", worth celebrating";

}


/* =========================================================
   SCENE CONTROL
========================================================= */

const scenes={

    archery:
        document.getElementById("scene-archery"),

    title:
        document.getElementById("scene-title"),

    tree:
        document.getElementById("scene-tree")

};


function showScene(name){

    Object.values(scenes).forEach(scene=>{

        scene.classList.remove("active");

    });

    scenes[name].classList.add("active");

}


/* =========================================================
   ARCHERY
========================================================= */

const svg =
    document.getElementById("archery-svg");

const bowGroup =
    document.getElementById("bow-group");

const arrowGroup =
    document.getElementById("arrow-group");

const bowString =
    document.getElementById("bow-string");

const limbTop =
    document.getElementById("limb-top");

const limbBottom =
    document.getElementById("limb-bottom");

const heartTarget =
    document.getElementById("heart-target");

const burstLayer =
    document.getElementById("burst-layer");

const pullHint =
    document.getElementById("pull-hint");


const bowAnchor={
    x:230,
    y:1330
};


const targetPoint={
    x:540,
    y:420
};


const dx =
    targetPoint.x-bowAnchor.x;

const dy =
    targetPoint.y-bowAnchor.y;

const distance =
    Math.hypot(dx,dy);


const dir={
    x:dx/distance,
    y:dy/distance
};


const angleDeg =
    Math.atan2(dir.y,dir.x)*180/Math.PI;


bowGroup.setAttribute(
    "transform",
    `translate(${bowAnchor.x},${bowAnchor.y}) rotate(${angleDeg})`
);


const REST_OFFSET=150;

const MAX_PULL=130;

const FIRE_THRESHOLD=40;


let pulling=false;

let pullAmount=0;


function setArrow(pull){

    const nockX=
        REST_OFFSET-pull;

    arrowGroup.setAttribute(
        "transform",
        `translate(${nockX},0)`
    );


    bowString.setAttribute(
        "points",
        `0,-140 ${nockX-REST_OFFSET},0 0,140`
    );


    const flex=
        60+pull*.25;


    limbTop.setAttribute(
        "d",
        `M0,-140 Q${flex},-70 0,0`
    );


    limbBottom.setAttribute(
        "d",
        `M0,0 Q${flex},70 0,140`
    );

}


setArrow(0);


/* =========================================================
   POINTER POSITION
========================================================= */

function toSvgPoint(evt){

    const pt=
        svg.createSVGPoint();

    pt.x=evt.clientX;

    pt.y=evt.clientY;

    const ctm=
        svg.getScreenCTM().inverse();

    return pt.matrixTransform(ctm);

}


/* =========================================================
   PULL
========================================================= */

function startPull(evt){

    pulling=true;

    pullHint.style.opacity=0;

    evt.preventDefault();

}


function movePull(evt){

    if(!pulling)return;

    const p=
        toSvgPoint(evt);

    const vx=
        p.x-bowAnchor.x;

    const vy=
        p.y-bowAnchor.y;


    const along=
        vx*dir.x+
        vy*dir.y;


    let pull=
        REST_OFFSET-along;


    pull=
        Math.max(
            0,
            Math.min(
                MAX_PULL,
                pull
            )
        );


    pullAmount=pull;

    setArrow(pull);

    evt.preventDefault();

}


function endPull(){

    if(!pulling)return;

    pulling=false;


    if(pullAmount>=FIRE_THRESHOLD){

        fireArrow(pullAmount);

    }
    else{

        springBack();

    }

}


function springBack(){

    const start=
        pullAmount;

    const startTime=
        performance.now();

    const duration=260;


    function animateBack(now){

        const k=
            Math.min(
                1,
                (now-startTime)/duration
            );


        const value=
            start*(1-k);


        setArrow(value);

        pullAmount=value;


        if(k<1){

            requestAnimationFrame(
                animateBack
            );

        }
        else{

            pullHint.style.opacity=.4;

        }

    }


    requestAnimationFrame(
        animateBack
    );

}


svg.addEventListener(
    "pointerdown",
    startPull
);

window.addEventListener(
    "pointermove",
    movePull
);

window.addEventListener(
    "pointerup",
    endPull
);


/* =========================================================
   FIRE ARROW
========================================================= */

function fireArrow(power){

    const nockX=
        REST_OFFSET-power;


    const rad=
        angleDeg*Math.PI/180;


    const startWorld={

        x:
            bowAnchor.x+
            nockX*Math.cos(rad),

        y:
            bowAnchor.y+
            nockX*Math.sin(rad)

    };


    const flying=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "g"
        );


    flying.innerHTML=`

        <line
            x1="0"
            y1="0"
            x2="150"
            y2="0"
            stroke="#5b3a2c"
            stroke-width="6"
            stroke-linecap="round"
        />

        <polygon
            points="150,0 130,-9 130,9"
            fill="#eab35e"
        />

        <polygon
            points="0,0 -18,-10 -10,0 -18,10"
            fill="#e2447f"
        />

    `;


    svg.appendChild(flying);


    setArrow(0);

    pullAmount=0;


    const startTime=
        performance.now();

    const duration=500;


    const travelDistance=
        Math.hypot(
            targetPoint.x-startWorld.x,
            targetPoint.y-startWorld.y
        )-40;


    function fly(now){

        const k=
            Math.min(
                1,
                (now-startTime)/duration
            );


        const ease=
            1-Math.pow(1-k,3);


        const d=
            travelDistance*ease;


        flying.setAttribute(
            "transform",
            `translate(
                ${startWorld.x+dir.x*d},
                ${startWorld.y+dir.y*d}
            )
            rotate(${angleDeg})`
        );


        if(k<1){

            requestAnimationFrame(fly);

        }
        else{

            flying.remove();

            hitHeart();

        }

    }


    requestAnimationFrame(fly);

}


/* =========================================================
   HEART HIT
========================================================= */

function hitHeart(){

    heartTarget.animate(

        [
            {
                transform:
                    "translate(540px,420px) scale(1)"
            },

            {
                transform:
                    "translate(540px,450px) scale(1.45)"
            },

            {
                transform:
                    "translate(540px,620px) scale(.8)",
                opacity:0
            }

        ],

        {
            duration:850,
            easing:"cubic-bezier(.2,.8,.3,1)",
            fill:"forwards"
        }

    );


    /* burst */

    const glyphs=[
        "💗",
        "💛",
        "💕",
        "🩷",
        "✨",
        "💞"
    ];


    for(
        let i=0;
        i<18;
        i++
    ){

        const el=
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "text"
            );


        const angle=
            Math.random()*Math.PI*2;


        const x=
            targetPoint.x+
            Math.cos(angle)*10;


        const y=
            targetPoint.y+
            Math.sin(angle)*10;


        el.setAttribute(
            "x",
            x
        );

        el.setAttribute(
            "y",
            y
        );

        el.setAttribute(
            "font-size",
            20+Math.random()*20
        );

        el.setAttribute(
            "text-anchor",
            "middle"
        );


        el.textContent=
            glyphs[
                Math.floor(
                    Math.random()*
                    glyphs.length
                )
            ];


        burstLayer.appendChild(el);


        const moveX=
            (Math.random()-.5)*280;

        const moveY=
            -(120+Math.random()*250);


        el.animate(

            [
                {
                    transform:"translate(0,0)",
                    opacity:0
                },

                {
                    transform:"translate(0,0)",
                    opacity:1
                },

                {
                    transform:
                        `translate(${moveX}px,${moveY}px)`,
                    opacity:0
                }

            ],

            {
                duration:
                    1000+
                    Math.random()*700,

                easing:
                    "cubic-bezier(.2,.6,.3,1)",

                fill:"forwards"
            }

        );

    }


    setTimeout(()=>{

        showScene("title");

        setTimeout(()=>{

            showScene("tree");

            /* IMPORTANT:
               Tree begins only after scene appears.
            */

            setTimeout(
                growTree,
                150
            );

        },CONFIG.autoAdvanceTitleMs);

    },700);

}


/* =========================================================
   TREE
========================================================= */

const canopy=
    document.getElementById("canopy");


const treePaths=
    document.querySelectorAll(
        ".tree-path"
    );


let treeStarted=false;


/* =========================================================
   DRAW TREE
========================================================= */

function growTree(){

    if(treeStarted)return;

    treeStarted=true;


    /*
       First grow the actual branches.
    */

    treePaths.forEach(
        (path,index)=>{

            const length=
                path.getTotalLength();

            path.style.strokeDasharray=
                length;

            path.style.strokeDashoffset=
                length;


            /*
               Main trunk first,
               branches afterwards.
            */

            setTimeout(()=>{

                path.style.strokeDashoffset=0;

            },index*130);

        }
    );


    /*
       Wait until branches are visible,
       THEN start emoji canopy.
    */

    setTimeout(
        createHeartCanopy,
        1900
    );

}


/* =========================================================
   HEART SHAPE TEST
========================================================= */

/*
   This is the important fix.

   Instead of relying on the old random
   implicit equation, we use a normalized
   mathematical heart.

   x/y are between -1 and +1.
*/

function isInsideHeart(x,y){

    const a=
        x*x+
        y*y-
        1;


    return (
        a*a*a-
        x*x*y*y*y
    )<=0;

}


/* =========================================================
   CREATE HEART CANOPY
========================================================= */

function createHeartCanopy(){

    canopy.innerHTML="";


    /*
       These values control the canopy.

       Increase HEART_SCALE for a larger tree.
    */

    const width=
        canopy.clientWidth;

    const height=
        canopy.clientHeight;


    /*
       Generate points until we have
       enough emojis INSIDE the heart.
    */

    let points=[];

    let attempts=0;


    while(
        points.length<
        CONFIG.heartCount &&
        attempts<100000
    ){

        attempts++;


        const x=
            Math.random()*2-1;


        const y=
            Math.random()*2-1;


        if(
            isInsideHeart(
                x,
                y
            )
        ){

            points.push({
                x,
                y
            });

        }

    }


    /*
       Sort from top to bottom.

       This creates a much nicer
       blooming effect.
    */

    points.sort(
        (a,b)=>a.y-b.y
    );


    points.forEach(
        (point,index)=>{

            const heart=
                document.createElement("span");


            heart.className=
                "mini-heart";


            heart.textContent=
                CONFIG.heartEmojis[
                    Math.floor(
                        Math.random()*
                        CONFIG.heartEmojis.length
                    )
                ];


            /*
               Smaller emojis make the
               heart shape easier to see.
            */

            const size=
                10+
                Math.random()*10;


            heart.style.fontSize=
                size+"px";


            /*
               Convert mathematical
               heart coordinates to pixels.
            */

            const px=
                width/2+
                point.x*
                width*.46;


            /*
               IMPORTANT:

               Mathematical y is inverted
               for the screen.
            */

            const py=
                height*.50-
                point.y*
                height*.47;


            heart.style.left=
                px+"px";


            heart.style.top=
                py+"px";


            /*
               Random tiny rotation.
            */

            heart.style.rotate=
                `${(Math.random()-.5)*18}deg`;


            canopy.appendChild(
                heart
            );


            /*
               Bloom progressively.

               Top hearts appear first,
               then the rest spread down.
            */

            const delay=
                index*7+
                Math.random()*300;


            setTimeout(()=>{

                heart.classList.add(
                    "bloomed"
                );

            },delay);

        }
    );

}

   RESTART
========================================================= */

document
    .getElementById("skip-btn")
    .addEventListener(
        "click",
        ()=>location.reload()
    );


})();

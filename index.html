<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Happy Birthday · draw the bow, hit the heart</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Quicksand:wght@400;500;600&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Yellowtail&display=swap"
      rel="stylesheet">


<style>

/* =========================================================
   GLOBAL
========================================================= */

:root{
    --cream:#fdece0;
    --cream-2:#fbdcc9;

    --rose-deep:#c8175a;
    --rose-mid:#e2447f;
    --rose-light:#f6a6c1;

    --gold:#eab35e;

    --ink:#4a2e2e;
    --tree:#5b302c;
    --paper:#fff7ef;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;

    width:100%;
    height:100%;

    background:#1b0e14;

    font-family:'Quicksand',sans-serif;

    overflow:hidden;

    -webkit-tap-highlight-color:transparent;
}


/* =========================================================
   STAGE
========================================================= */

#stage-frame{
    position:fixed;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;
}

#stage{

    position:relative;

    width:min(100vw,56.25vh);
    height:min(177.78vw,100vh);

    overflow:hidden;

    background:
        linear-gradient(
            180deg,
            var(--cream) 0%,
            var(--cream-2) 100%
        );

    box-shadow:
        0 0 60px rgba(0,0,0,.5);
}


/* =========================================================
   SCENES
========================================================= */

.scene{

    position:absolute;
    inset:0;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    opacity:0;

    pointer-events:none;

    transition:
        opacity 1.1s ease;
}

.scene.active{

    opacity:1;

    pointer-events:auto;
}


/* =========================================================
   TEXT
========================================================= */

.eyebrow{

    font-family:'Fredoka',sans-serif;

    font-style:italic;

    font-weight:500;

    letter-spacing:.02em;

    color:var(--ink);

    opacity:.55;

    font-size:clamp(13px,3.4vw,16px);

    margin:0 0 6px;
}

.subtitle{

    font-family:'Fredoka',sans-serif;

    font-style:italic;

    font-weight:400;

    color:var(--ink);

    opacity:.6;

    font-size:clamp(12px,3vw,14px);

    margin-top:10px;

    text-align:center;
}


/* =========================================================
   SCENE 1 — ARCHERY
========================================================= */

#scene-archery{

    background:
        radial-gradient(
            ellipse at 50% 34%,
            #ffd9c2 0%,
            var(--cream) 55%,
            var(--cream-2) 100%
        );
}

#archery-svg{

    width:100%;
    height:100%;

    touch-action:none;

    user-select:none;
}

.archer-hint{

    fill:var(--ink);

    opacity:.4;

    font-family:'Fredoka',sans-serif;

    letter-spacing:.12em;

    font-size:22px;

    font-weight:600;

    text-anchor:middle;

    animation:pulseHint 1.8s ease-in-out infinite;
}

@keyframes pulseHint{

    0%,100%{
        opacity:.25;
    }

    50%{
        opacity:.55;
    }
}

.heart-glow{

    filter:
        drop-shadow(
            0 0 40px
            rgba(216,60,110,.45)
        );
}

#bow-group path.limb{

    fill:none;

    stroke:#5b3a2c;

    stroke-width:14;

    stroke-linecap:round;
}

#bow-string{

    stroke:#8a7a63;

    stroke-width:2.5;

    fill:none;
}

#arrow-shaft{

    stroke:#5b3a2c;

    stroke-width:6;

    stroke-linecap:round;
}

#arrow-head{

    fill:var(--gold);
}

#arrow-fletch{

    fill:var(--rose-mid);
}


/* =========================================================
   SCENE 2 — TITLE
========================================================= */

#scene-title{

    background:
        radial-gradient(
            120% 90% at 50% 30%,
            var(--rose-mid) 0%,
            var(--rose-deep) 65%,
            #8f0f42 100%
        );
}

#scene-title .eyebrow,
#scene-title .subtitle{

    color:var(--paper);

    opacity:.75;
}

.title{

    font-family:'Playfair Display',serif;

    font-weight:900;

    color:var(--paper);

    font-size:clamp(48px,13.5vw,72px);

    line-height:.98;

    text-align:center;

    margin:2px 0;

    text-shadow:
        0 6px 30px rgba(0,0,0,.25);
}

.swash{

    width:140px;

    height:18px;

    margin:14px auto 4px;

    border-bottom:
        3px solid var(--gold);

    border-radius:50%;

    transform:
        rotate(-1.5deg)
        scaleY(.6);

    opacity:.9;
}


/* =========================================================
   SCENE 3 — TREE
========================================================= */

#scene-tree{

    justify-content:flex-end;

    background:
        radial-gradient(
            ellipse at 50% 15%,
            #fff3e6 0%,
            var(--cream) 45%,
            var(--cream-2) 100%
        );
}


/* =========================================================
   TREE AREA
========================================================= */

#tree-wrap{

    position:relative;

    width:100%;

    height:86%;

    flex:none;

    overflow:hidden;

    display:flex;

    align-items:flex-end;

    justify-content:center;
}


/* =========================================================
   MAIN TRUNK
========================================================= */

#trunk{

    position:absolute;

    bottom:-3%;

    left:50%;

    transform:
        translateX(-50%);

    width:18px;

    height:0;

    background:
        linear-gradient(
            90deg,
            #472722 0%,
            #63372f 50%,
            #43221f 100%
        );

    border-radius:
        10px 10px 2px 2px;

    transition:
        height 2.2s
        cubic-bezier(.22,.9,.3,1);

    z-index:2;

    box-shadow:
        1px 0 0 rgba(255,255,255,.05);
}


/* =========================================================
   TREE BRANCHES
========================================================= */

#tree-svg{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    z-index:3;

    pointer-events:none;
}

.branch{

    fill:none;

    stroke:var(--tree);

    stroke-linecap:round;

    stroke-linejoin:round;

    stroke-dasharray:1000;

    stroke-dashoffset:1000;

    transition:
        stroke-dashoffset 2.5s
        cubic-bezier(.22,.9,.3,1);
}

.branch.main{
    stroke-width:12;
}

.branch.medium{
    stroke-width:7;
}

.branch.small{
    stroke-width:3.5;
}


/* =========================================================
   EMOJI HEART CANOPY
========================================================= */

#canopy{

    position:absolute;

    /*
       IMPORTANT FIX:
       The emoji heart is now placed around
       the actual branch area instead of above it.
    */

    left:50%;

    top:5%;

    transform:
        translateX(-50%);

    width:94%;

    height:72%;

    z-index:5;

    pointer-events:none;

    overflow:visible;
}


/* individual emojis */

.mini-heart{

    position:absolute;

    transform:
        translate(-50%,-50%)
        scale(0);

    opacity:0;

    line-height:1;

    user-select:none;

    filter:
        drop-shadow(
            0 2px 4px
            rgba(120,40,60,.20)
        );

    transition:
        transform .65s
        cubic-bezier(.34,1.56,.64,1),

        opacity .4s ease;
}


/* bloom */

.mini-heart.bloomed{

    transform:
        translate(-50%,-50%)
        scale(1);

    opacity:.92;

    animation:
        heartFloat
        4.5s
        ease-in-out
        infinite;
}

@keyframes heartFloat{

    0%,100%{
        margin-top:0;
    }

    50%{
        margin-top:-4px;
    }
}


/* =========================================================
   TREE TEXT
========================================================= */

.tree-text{

    position:absolute;

    z-index:10;

    left:7%;

    bottom:7%;

    width:48%;

    text-align:left;

    pointer-events:none;
}

.tree-text .eyebrow{

    margin-bottom:2px;
}

.script-title{

    font-family:'Yellowtail',cursive;

    color:var(--rose-deep);

    font-size:
        clamp(
            42px,
            11vw,
            62px
        );

    line-height:.95;

    margin:0 0 8px;

    text-shadow:
        0 2px 12px
        rgba(200,23,90,.12);
}

.tree-text .subtitle{

    text-align:left;

    margin-top:2px;
}


/* =========================================================
   RESTART
========================================================= */

#skip-btn{

    position:absolute;

    top:14px;
    right:14px;

    z-index:50;

    background:
        rgba(0,0,0,.18);

    color:#fff;

    border:none;

    border-radius:20px;

    font-family:'Fredoka',sans-serif;

    font-size:11px;

    padding:6px 12px;

    opacity:.45;

    cursor:pointer;
}


/* =========================================================
   FLOATING BACKGROUND HEARTS
========================================================= */

.background-heart{

    position:absolute;

    z-index:1;

    pointer-events:none;

    opacity:0;

    animation:
        floatBackground
        5s
        ease-in-out
        infinite;
}

@keyframes floatBackground{

    0%{
        transform:
            translateY(20px)
            scale(.8);

        opacity:0;
    }

    20%{
        opacity:.7;
    }

    80%{
        opacity:.65;
    }

    100%{
        transform:
            translateY(-30px)
            scale(1);

        opacity:0;
    }
}


@media(prefers-reduced-motion:reduce){

    .scene{
        transition:opacity .3s linear;
    }

    .mini-heart.bloomed{
        animation:none;
    }

}

</style>

<script>

(function(){

"use strict";


/* =========================================================
   CONFIG
========================================================= */

const CONFIG = {

    recipientName:null,

    archerCaption:
        "a little something, for you",

    titleEyebrow:
        "make a wish...",

    titleSub:
        "to someone worth celebrating",

    treeEyebrow:
        "and... make it count",

    treeSub:
        "here's to a year that blooms",

    /*
       Number of hearts.

       Reduced from 340 because we want
       the tree/heart shape to remain visible.
    */

    heartCount:180,

    heartPalette:[
        "#e2447f",
        "#f6a6c1",
        "#eab35e",
        "#c8175a",
        "#f28aa8"
    ],

    autoAdvanceTitleMs:2600

};


/* =========================================================
   TEXT
========================================================= */

if(CONFIG.recipientName){

    document.getElementById("title-sub")
        .textContent =
        "to " +
        CONFIG.recipientName +
        ", worth celebrating";
}

document.getElementById("archer-caption")
    .textContent=CONFIG.archerCaption;

document.getElementById("title-eyebrow")
    .textContent=CONFIG.titleEyebrow;

document.getElementById("title-sub")
    .textContent=CONFIG.titleSub;

document.getElementById("tree-eyebrow")
    .textContent=CONFIG.treeEyebrow;

document.getElementById("tree-sub")
    .textContent=CONFIG.treeSub;


/* =========================================================
   SCENE SWITCHING
========================================================= */

const scenes={

    archery:
        document.getElementById("scene-archery"),

    title:
        document.getElementById("scene-title"),

    tree:
        document.getElementById("scene-tree")
};


function showScene(name){

    Object.values(scenes)
        .forEach(scene=>{
            scene.classList.remove("active");
        });

    scenes[name]
        .classList.add("active");
}


/* =========================================================
   ARCHERY
========================================================= */

const svg=
    document.getElementById("archery-svg");

const bowGroup=
    document.getElementById("bow-group");

const arrowGroup=
    document.getElementById("arrow-group");

const bowString=
    document.getElementById("bow-string");

const limbTop=
    document.getElementById("limb-top");

const limbBottom=
    document.getElementById("limb-bottom");

const heartTarget=
    document.getElementById("heart-target");

const burstLayer=
    document.getElementById("burst-layer");

const pullHint=
    document.getElementById("pull-hint");


const bowAnchor={
    x:230,
    y:1330
};

const targetPoint={
    x:540,
    y:420
};


const dx=
    targetPoint.x-bowAnchor.x;

const dy=
    targetPoint.y-bowAnchor.y;

const dist=
    Math.hypot(dx,dy);

const dir={
    x:dx/dist,
    y:dy/dist
};

const angleDeg=
    Math.atan2(dir.y,dir.x)
    *180/Math.PI;


bowGroup.setAttribute(
    "transform",
    `translate(${bowAnchor.x},${bowAnchor.y}) rotate(${angleDeg})`
);


const REST_OFFSET=150;

const MAX_PULL=130;

const FIRE_THRESHOLD=40;


let pulling=false;

let pullAmount=0;

let pointerStart=null;


function setArrow(pull){

    const nockX=
        REST_OFFSET-pull;

    arrowGroup.setAttribute(
        "transform",
        `translate(${nockX},0)`
    );

    bowString.setAttribute(
        "points",
        `0,-140 ${nockX-REST_OFFSET},0 0,140`
    );

    const flex=
        60+
        pull*.25;

    limbTop.setAttribute(
        "d",
        `M0,-140 Q${flex},-70 0,0`
    );

    limbBottom.setAttribute(
        "d",
        `M0,0 Q${flex},70 0,140`
    );
}


setArrow(0);


function toSvgPoint(evt){

    const pt=
        svg.createSVGPoint();

    const t=
        evt.touches
        ?evt.touches[0]
        :evt;

    pt.x=t.clientX;
    pt.y=t.clientY;

    const ctm=
        svg.getScreenCTM().inverse();

    return pt.matrixTransform(ctm);
}


function startPull(evt){

    pulling=true;

    pointerStart=
        toSvgPoint(evt);

    pullHint.style.opacity=0;

    evt.preventDefault();
}


function movePull(evt){

    if(!pulling)
        return;

    const p=
        toSvgPoint(evt);

    const vx=
        p.x-bowAnchor.x;

    const vy=
        p.y-bowAnchor.y;

    const along=
        vx*dir.x+
        vy*dir.y;

    let pull=
        REST_OFFSET-along;

    pull=
        Math.max(
            0,
            Math.min(MAX_PULL,pull)
        );

    pullAmount=pull;

    setArrow(pull);

    evt.preventDefault();
}


function endPull(){

    if(!pulling)
        return;

    pulling=false;

    if(pullAmount>=FIRE_THRESHOLD){

        fireArrow(pullAmount);

    }else{

        springBack();

    }
}


function springBack(){

    const start=pullAmount;

    const t0=
        performance.now();

    const dur=260;


    function step(t){

        const k=
            Math.min(
                1,
                (t-t0)/dur
            );

        const val=
            start*(1-k);

        setArrow(val);

        pullAmount=val;


        if(k<1){

            requestAnimationFrame(step);

        }else{

            pullHint.style.opacity=.4;
        }
    }


    requestAnimationFrame(step);
}


svg.addEventListener(
    "pointerdown",
    startPull
);

window.addEventListener(
    "pointermove",
    movePull
);

window.addEventListener(
    "pointerup",
    endPull
);


/* =========================================================
   FIRE ARROW
========================================================= */

function fireArrow(power){

    const nockX=
        REST_OFFSET-power;

    const startLocal={
        x:nockX,
        y:0
    };


    const rad=
        angleDeg*Math.PI/180;


    const startWorld={

        x:
            bowAnchor.x+
            startLocal.x*Math.cos(rad),

        y:
            bowAnchor.y+
            startLocal.x*Math.sin(rad)
    };


    const flying=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "g"
        );


    flying.setAttribute(
        "transform",
        `translate(${startWorld.x},${startWorld.y}) rotate(${angleDeg})`
    );


    flying.innerHTML=`

        <line
            x1="0"
            y1="0"
            x2="150"
            y2="0"
            stroke="#5b3a2c"
            stroke-width="6"
            stroke-linecap="round"
        />

        <polygon
            points="150,0 130,-9 130,9"
            fill="#eab35e"
        />

        <polygon
            points="0,0 -18,-10 -10,0 -18,10"
            fill="#e2447f"
        />
    `;


    svg.appendChild(flying);

    setArrow(0);

    pullAmount=0;


    const t0=
        performance.now();

    const dur=340;


    const travelDist=
        Math.hypot(
            targetPoint.x-startWorld.x,
            targetPoint.y-startWorld.y
        )-60;


    function step(t){

        const k=
            Math.min(
                1,
                (t-t0)/dur
            );

        const ease=
            1-
            Math.pow(1-k,3);

        const d=
            travelDist*ease;


        flying.setAttribute(
            "transform",
            `translate(
                ${startWorld.x+dir.x*d},
                ${startWorld.y+dir.y*d}
            )
            rotate(${angleDeg})`
        );


        if(k<1){

            requestAnimationFrame(step);

        }else{

            flying.remove();

            hitHeart();
        }
    }


    requestAnimationFrame(step);
}


/* =========================================================
   HEART HIT
========================================================= */

function hitHeart(){

    heartTarget.animate(

        [
            {
                transform:
                    heartTarget.getAttribute("transform")+
                    " scale(1)"
            },

            {
                transform:
                    heartTarget.getAttribute("transform")+
                    " scale(1.35)"
            },

            {
                transform:
                    heartTarget.getAttribute("transform")+
                    " scale(1)"
            }
        ],

        {
            duration:420,
            easing:"ease-out"
        }
    );


    const glyphs=[
        "💗",
        "💛",
        "💕",
        "🩷",
        "✨",
        "💞",
        "💓",
        "💖"
    ];


    for(let i=0;i<16;i++){

        const el=
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "text"
            );

        const ang=
            Math.random()*Math.PI*2;

        const r0=10;


        const x0=
            targetPoint.x+
            Math.cos(ang)*r0;

        const y0=
            targetPoint.y+
            Math.sin(ang)*r0;


        el.setAttribute("x",x0);

        el.setAttribute("y",y0);

        el.setAttribute(
            "font-size",
            20+
            Math.random()*22
        );

        el.setAttribute(
            "text-anchor",
            "middle"
        );

        el.setAttribute(
            "opacity",
            "0"
        );

        el.textContent=
            glyphs[i%glyphs.length];

        burstLayer.appendChild(el);


        const dxp=
            (Math.random()-.5)*260;

        const dyp=
            -(120+
            Math.random()*260);


        const duration=
            1100+
            Math.random()*700;


        el.animate(

            [
                {
                    transform:
                        "translate(0px,0px)",
                    opacity:0
                },

                {
                    transform:
                        "translate(0px,0px)",
                    opacity:1
                },

                {
                    transform:
                        `translate(${dxp}px,${dyp}px)`,
                    opacity:0
                }
            ],

            {
                duration:duration,
                easing:"cubic-bezier(.2,.6,.3,1)"
            }
        );

    }


    setTimeout(()=>{

        showScene("title");


        setTimeout(()=>{

            showScene("tree");

            growTree();

        },CONFIG.autoAdvanceTitleMs);


    },650);

}


/* =========================================================
   TREE GROWTH
========================================================= */

const trunkEl=
    document.getElementById("trunk");

const canopyEl=
    document.getElementById("canopy");

const branches=
    document.querySelectorAll(".branch");


let treeGrown=false;


function growTree(){

    if(treeGrown)
        return;

    treeGrown=true;


    /* -----------------------------------------
       1. Grow trunk
    ----------------------------------------- */

    trunkEl.style.height="74%";


    /* -----------------------------------------
       2. Grow branches
    ----------------------------------------- */

    branches.forEach(
        (branch,index)=>{

            setTimeout(()=>{

                branch.style.strokeDashoffset="0";

            },500+index*45);

        }
    );


    /* -----------------------------------------
       3. Grow emoji heart
    ----------------------------------------- */

    setTimeout(()=>{

        createHeartCanopy();

    },1800);


    /* background hearts */

    createBackgroundHearts();
}


/* =========================================================
   TRUE HEART SHAPE
========================================================= */

/*
   This function creates points INSIDE a mathematical
   heart shape.

   x = horizontal
   y = vertical
*/

function isInsideHeart(x,y){

    const value=
        Math.pow(
            x*x+y*y-1,
            3
        )
        -
        x*x*
        Math.pow(y,3);

    return value<=0;
}


/* =========================================================
   CREATE HEART CANOPY
========================================================= */

function createHeartCanopy(){

    canopyEl.innerHTML="";


    const glyphs=[
        "💗",
        "💕",
        "🩷",
        "💖",
        "💓",
        "💛",
        "✨"
    ];


    /*
       Create points using rejection sampling.

       IMPORTANT:
       The range is intentionally smaller so the
       heart stays over the actual branches.
    */

    const points=[];


    let attempts=0;


    while(
        points.length<CONFIG.heartCount &&
        attempts<50000
    ){

        attempts++;


        /*
           X controls width.

           Y is kept mostly in the upper/middle
           part of the tree.
        */

        const x=
            (Math.random()*2-1);


        const y=
            (Math.random()*2-1);


        if(isInsideHeart(x,y)){

            points.push({
                x:x,
                y:y
            });

        }
    }


    /*
       Sort from bottom to top.

       This makes the heart appear to grow
       upward from the stem.
    */

    points.sort(
        (a,b)=>a.y-b.y
    );


    const width=
        canopyEl.clientWidth;

    const height=
        canopyEl.clientHeight;


    points.forEach(
        (point,index)=>{

            const heart=
                document.createElement("span");


            heart.className=
                "mini-heart";


            heart.textContent=
                glyphs[
                    Math.floor(
                        Math.random()*
                        glyphs.length
                    )
                ];


            /*
               HEART POSITION

               x:
               centered around the trunk

               y:
               shifted downward so it overlaps
               the tree branches.
            */

            const screenX=
                width/2+
                point.x*
                width*
                .43;


            const normalizedY=
                (point.y+1)/2;


            const screenY=
                height-
                normalizedY*
                height*
                .72;


            heart.style.left=
                screenX+"px";


            heart.style.top=
                screenY+"px";


            /*
               Different sizes make the heart
               look natural.
            */

            const size=
                9+
                Math.random()*12;


            heart.style.fontSize=
                size+"px";


            heart.style.color=
                CONFIG.heartPalette[
                    Math.floor(
                        Math.random()*
                        CONFIG.heartPalette.length
                    )
                ];


            canopyEl.appendChild(
                heart
            );


            /*
               IMPORTANT:

               Bottom hearts appear first.
               Then the heart expands upward.
            */

            const delay=
                200+
                index*8;


            setTimeout(()=>{

                heart.classList.add(
                    "bloomed"
                );

            },delay);

        }
    );

}


/* =========================================================
   BACKGROUND FLOATING HEARTS
========================================================= */

function createBackgroundHearts(){

    const emojis=[
        "💗",
        "💛",
        "💕",
        "🩷",
        "✨"
    ];


    for(let i=0;i<18;i++){

        heart.textContent=
            emojis[
                Math.floor(

                    emojis.length
                )
            ];


        heart.style.left=
            (5+
            Math.random()*90)+
            "%";


        heart.style.top=
            (5+
            Math.random()*80)+
            "%";


        heart.style.fontSize=
            (10+
            Math.random()*13)+
            "px";


        heart.style.animationDelay=
            Math.random()*4+

        document.getElementById(
            "tree-wrap"
        ).appendChild(

        );

    }

}

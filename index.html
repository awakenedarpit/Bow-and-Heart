<!DOCTYPE html>
<html lang="en">
<head>

      content="width=device-width,

               maximum-scale=1.0,
               user-scalable=no">

<title>Happy Birthday · A Little Something For You</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Quicksand:wght@400;500;600&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Yellowtail&display=swap"
      rel="stylesheet">


<style>

/* =========================================================
   GLOBAL
   ========================================================= */

:root{

    --cream:#fdece0;
    --cream2:#fbdcc9;

    --rose:#c8175a;
    --rose2:#e2447f;
    --pink:#f6a6c1;

    --gold:#eab35e;

    --ink:#4a2e2e;

    --tree:#542d29;
    --tree-dark:#321b18;

    --paper:#fff7ef;
}


*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}


html,
body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#170c12;

    font-family:'Quicksand',sans-serif;
}


button{
    font-family:inherit;
}


/* =========================================================
   STAGE
   ========================================================= */

#stage-frame{

    position:fixed;

    inset:0;

    display:flex;

    justify-content:center;
    align-items:center;

    background:#170c12;

}


#stage{

    position:relative;

    width:min(100vw,56.25vh);

    height:min(177.78vw,100vh);

    overflow:hidden;

    background:
        linear-gradient(
            180deg,
            var(--cream),
            var(--cream2)
        );

    box-shadow:
        0 0 70px rgba(0,0,0,.55);
}


/* =========================================================
   SCENES
   ========================================================= */

.scene{

    position:absolute;

    inset:0;

    display:flex;

    justify-content:center;
    align-items:center;

    opacity:0;

    pointer-events:none;

    transition:
        opacity 1.25s
        cubic-bezier(.22,.61,.36,1);

}


.scene.active{

    opacity:1;

    pointer-events:auto;

}


/* =========================================================
   COMMON TEXT
   ========================================================= */

.eyebrow{

    margin:0 0 7px;

    color:var(--ink);

    font-family:'Fredoka',sans-serif;

    font-style:italic;

    font-size:
        clamp(13px,3.5vw,17px);

    font-weight:500;

    opacity:.62;

}


.subtitle{

    margin:10px 0 0;

    color:var(--ink);

    font-family:'Fredoka',sans-serif;

    font-size:
        clamp(12px,3vw,15px);

    font-style:italic;

    text-align:center;

    opacity:.65;

}


/* =========================================================
   RESTART
   ========================================================= */

#restartBtn{

    position:absolute;

    top:14px;
    right:14px;

    z-index:100;

    border:0;

    border-radius:30px;

    padding:
        9px 16px;

    color:white;

    background:
        rgba(70,30,45,.22);

    backdrop-filter:
        blur(8px);

    font-size:12px;

    opacity:.55;

    cursor:pointer;

}


#restartBtn:active{

    transform:scale(.94);

}


/* =========================================================
   SCENE 1 — ARCHERY
   ========================================================= */

#scene-archery{

    background:
        radial-gradient(
            ellipse at 50% 30%,
            #ffd9c2 0%,
            #fdece0 52%,
            #fbdcc9 100%
        );

}


#archery-svg{

    width:100%;
    height:100%;

    touch-action:none;

    user-select:none;

}


.archer-hint{

    fill:var(--ink);

    opacity:.42;

    font-family:'Fredoka',sans-serif;

    font-size:23px;

    font-weight:600;

    letter-spacing:.12em;

    text-anchor:middle;

    animation:
        hintPulse
        1.8s
        ease-in-out
        infinite;

}


@keyframes hintPulse{

    0%,100%{
        opacity:.22;
    }

    50%{
        opacity:.55;
    }

}


#heart-target{

    transform-origin:center;

    filter:
        drop-shadow(
            0 0 35px
            rgba(216,60,110,.45)
        );

}


#bow-group path.limb{

    fill:none;

    stroke:#5b3a2c;

    stroke-width:14;

    stroke-linecap:round;

}


#bow-string{

    stroke:#8a7a63;

    stroke-width:2.5;

    fill:none;

}


#arrow-shaft{

    stroke:#5b3a2c;

    stroke-width:6;

    stroke-linecap:round;

}


#arrow-head{

    fill:var(--gold);

}


#arrow-fletch{

    fill:var(--rose2);

}


/* =========================================================
   SCENE 2 — TITLE
   ========================================================= */

#scene-title{

    flex-direction:column;

    background:
        radial-gradient(
            120% 90% at 50% 30%,
            #e2447f 0%,
            #c8175a 62%,
            #8f0f42 100%
        );

}


#scene-title .eyebrow,
#scene-title .subtitle{

    color:var(--paper);

    opacity:.78;

}


.title{

    margin:2px 0;

    color:var(--paper);

    font-family:
        'Playfair Display',
        serif;

    font-size:
        clamp(48px,13.5vw,72px);

    font-weight:900;

    line-height:.98;

    text-align:center;

    text-shadow:
        0 6px 30px
        rgba(0,0,0,.25);

}


.swash{

    width:140px;

    height:18px;

    margin:14px auto 4px;

    border-bottom:
        3px solid
        var(--gold);

    border-radius:50%;

    transform:
        rotate(-1.5deg)
        scaleY(.6);

}


/* =========================================================
   SCENE 3 — TREE
   ========================================================= */

#scene-tree{

    display:block;

    overflow:hidden;

    background:
        radial-gradient(
            ellipse at 50% 35%,
            #fffdf8 0%,
            #fff5eb 42%,
            #fbdcca 100%
        );

}


#tree-area{

    position:relative;

    width:100%;

    height:100%;

    overflow:hidden;

}


/* =========================================================
   TREE SVG
   ========================================================= */

#tree-svg{

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

    overflow:visible;

}


/* =========================================================
   TREE GLOW
   ========================================================= */

#canopy-glow{

    opacity:0;

    transition:
        opacity 1.5s ease;

}


#scene-tree.active #canopy-glow{

    opacity:.65;

}


/* =========================================================
   TREE BRANCHES
   ========================================================= */

#tree-branches{

    opacity:0;

    transform-origin:
        540px 1920px;

    transform:
        scaleY(0);

    transition:

        opacity .3s ease,

        transform
        3s
        cubic-bezier(.22,.9,.25,1);

}


#scene-tree.active #tree-branches{

    opacity:1;

    transform:
        scaleY(1);

}


/* =========================================================
   HEART CANOPY
   ========================================================= */

#heart-canopy{

    opacity:0;

    transform-origin:
        540px 560px;

    transform:
        scale(.15);

    transition:

        opacity 1.2s ease,

        transform
        2.2s
        cubic-bezier(.16,1,.3,1);

}


#scene-tree.active #heart-canopy{

    opacity:1;

    transform:
        scale(1);

}


/* =========================================================
   INDIVIDUAL CANOPY HEARTS
   ========================================================= */

.canopy-heart{

    font-family:
        Arial,
        sans-serif;

    font-weight:bold;

    text-anchor:middle;

    dominant-baseline:middle;

    opacity:0;

    transform-box:fill-box;

    transform-origin:center;

}


.canopy-heart.bloom{

    animation:
        heartBloom
        .65s
        cubic-bezier(.17,.89,.32,1.35)
        forwards;

}


@keyframes heartBloom{

    0%{

        opacity:0;

        transform:
            scale(0)
            rotate(-18deg);

    }

    60%{

        opacity:1;

        transform:
            scale(1.18)
            rotate(7deg);

    }

    100%{

        opacity:.92;

        transform:
            scale(1)
            rotate(0deg);

    }

}


/* =========================================================
   FLOATING BACKGROUND HEARTS
   ========================================================= */

.background-heart{

    position:absolute;

    z-index:2;

    pointer-events:none;

    opacity:.65;

    animation:
        floatHeart
        5s
        ease-in-out
        infinite;

}


@keyframes floatHeart{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-13px);
    }

/* =========================================================
   BIRTHDAY TEXT
   ========================================================= */

    bottom:8.5%;

    width:47%;

.script-title{

.tree-sub{

        clamp(11px,3vw,16px);

/* =========================================================

   ========================================================= */

   ========================================================= */

@media(prefers-reduced-motion:reduce){

        animation-duration:.01ms !important;

        transition-duration:.01ms !important;

    }

}

<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

const CONFIG = {

    titleDuration:2600,

    canopyHeartCount:650,

    canopyStartDelay:1700,

    heartBloomInterval:7

};


/* =========================================================
   SCENES
   ========================================================= */

const sceneArchery =
    document.getElementById("scene-archery");

const sceneTitle =
    document.getElementById("scene-title");

const sceneTree =
    document.getElementById("scene-tree");


function showScene(scene){

    document
        .querySelectorAll(".scene")
        .forEach(item =>
            item.classList.remove("active")
        );

    scene.classList.add("active");

}


/* =========================================================
   ARCHERY ELEMENTS
   ========================================================= */

const svg =
    document.getElementById("archery-svg");

const bowGroup =
    document.getElementById("bow-group");

const arrowGroup =
    document.getElementById("arrow-group");

const bowString =
    document.getElementById("bow-string");

const limbTop =
    document.getElementById("limb-top");

const limbBottom =
    document.getElementById("limb-bottom");

const heartTarget =
    document.getElementById("heart-target");

const burstLayer =
    document.getElementById("burst-layer");

const pullHint =
    document.getElementById("pull-hint");


/* =========================================================
   BOW POSITION
   ========================================================= */

const bowAnchor = {

    x:230,

    y:1330

};


const targetPoint = {

    x:540,

    y:420

};


const dx =
    targetPoint.x -
    bowAnchor.x;


const dy =
    targetPoint.y -
    bowAnchor.y;


const distance =
    Math.hypot(dx,dy);


const direction = {

    x:dx/distance,

    y:dy/distance

};


const angle =
    Math.atan2(
        direction.y,
        direction.x
    ) *
    180 /
    Math.PI;


bowGroup.setAttribute(

    "transform",

    `translate(
        ${bowAnchor.x},
        ${bowAnchor.y}
    )
    rotate(${angle})`

);


/* =========================================================
   ARROW SETTINGS
   ========================================================= */

const REST_OFFSET = 150;

const MAX_PULL = 135;

const FIRE_THRESHOLD = 42;


let pulling = false;

let pullAmount = 0;


/* =========================================================
   SET ARROW
   ========================================================= */

function setArrow(pull){

    const nock =
        REST_OFFSET -
        pull;


    arrowGroup.setAttribute(

        "transform",

        `translate(${nock},0)`

    );


    bowString.setAttribute(

        "points",

        `0,-140
         ${nock - REST_OFFSET},0
         0,140`

    );


    const flex =
        60 +
        pull * .25;


    limbTop.setAttribute(

        "d",

        `M0,-140
         Q${flex},-70
         0,0`

    );


    limbBottom.setAttribute(

        "d",

        `M0,0
         Q${flex},70
         0,140`

    );

}


setArrow(0);


/* =========================================================
   POINTER → SVG
   ========================================================= */

function toSvgPoint(event){

    const point =
        svg.createSVGPoint();


    const source =
        event.touches ?
        event.touches[0] :
        event;


    point.x =
        source.clientX;

    point.y =
        source.clientY;


    const matrix =
        svg.getScreenCTM().inverse();


    return point.matrixTransform(matrix);

}


/* =========================================================
   START PULL
   ========================================================= */

function startPull(event){

    if(
        !sceneArchery.classList.contains("active")
    )
        return;


    pulling = true;

    pullHint.style.opacity = "0";

    event.preventDefault();

}


/* =========================================================
   MOVE PULL
   ========================================================= */

function movePull(event){

    if(!pulling)
        return;


    const point =
        toSvgPoint(event);


    const vx =
        point.x -
        bowAnchor.x;


    const vy =
        point.y -
        bowAnchor.y;


    const along =
        vx * direction.x +
        vy * direction.y;


    let pull =
        REST_OFFSET -
        along;


    pull =
        Math.max(
            0,
            Math.min(
                MAX_PULL,
                pull
            )
        );


    pullAmount =
        pull;


    setArrow(pull);


    event.preventDefault();

}


/* =========================================================
   END PULL
   ========================================================= */

function endPull(){

    if(!pulling)
        return;


    pulling = false;


    if(
        pullAmount >=
        FIRE_THRESHOLD
    ){

        fireArrow(pullAmount);

    }
    else{

        springBack();

    }

}


/* =========================================================
   SPRING BACK
   ========================================================= */

function springBack(){

    const start =
        pullAmount;


    const startTime =
        performance.now();


    const duration =
        280;


    function animateBack(time){

        const progress =
            Math.min(
                1,
                (time-startTime) /
                duration
            );


        const value =
            start *
            (1-progress);


        setArrow(value);


        pullAmount =
            value;


        if(progress < 1){

            requestAnimationFrame(
                animateBack
            );

        }
        else{

            pullHint.style.opacity =
                ".42";

        }

    }


    requestAnimationFrame(
        animateBack
    );

}


/* =========================================================
   POINTER EVENTS
   ========================================================= */

svg.addEventListener(
    "pointerdown",
    startPull
);


window.addEventListener(
    "pointermove",
    movePull
);


window.addEventListener(
    "pointerup",
    endPull
);


/* =========================================================
   FIRE ARROW
   ========================================================= */

function fireArrow(power){

    const nock =
        REST_OFFSET -
        power;


    const radians =
        angle *
        Math.PI /
        180;


    const startX =
        bowAnchor.x +
        nock *
        Math.cos(radians);


    const startY =
        bowAnchor.y +
        nock *
        Math.sin(radians);


    const flying =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "g"
        );


    flying.innerHTML = `

        <line
            x1="0"
            y1="0"
            x2="150"
            y2="0"
            stroke="#5b3a2c"
            stroke-width="6"
            stroke-linecap="round"
        />

        <polygon
            points="150,0 130,-9 130,9"
            fill="#eab35e"
        />

        <polygon
            points="0,0 -18,-10 -10,0 -18,10"
            fill="#e2447f"
        />

    `;


    svg.appendChild(flying);


    setArrow(0);

    pullAmount = 0;


    const duration = 430;

    const startTime =
        performance.now();


    function fly(time){

        const progress =
            Math.min(
                1,
                (time-startTime) /
                duration
            );


        const ease =
            1 -
            Math.pow(
                1-progress,
                3
            );


        const x =
            startX +
            direction.x *
            (
                distance -
                85
            ) *
            ease;


        const y =
            startY +
            direction.y *
            (
                distance -
                85
            ) *
            ease;


        flying.setAttribute(

            "transform",

            `translate(${x},${y})
             rotate(${angle})`

        );


        if(progress < 1){

            requestAnimationFrame(
                fly
            );

        }
        else{

            flying.remove();

            hitHeart();

        }

    }


    requestAnimationFrame(fly);

}


/* =========================================================
   HEART HIT
   ========================================================= */

function hitHeart(){

    pullHint.style.opacity = "0";


    /* -----------------------------------------------------
       HEART DROPS DOWN
       ----------------------------------------------------- */

    heartTarget.animate(

        [

            {
                transform:
                    "translate(540px,420px) scale(1)"
            },

            {
                transform:
                    "translate(540px,470px) scale(1.18)"
            },

            {
                transform:
                    "translate(540px,600px) scale(.95)",
                opacity:.8
            },

            {
                transform:
                    "translate(540px,780px) scale(.45)",
                opacity:0
            }

        ],

        {

            duration:900,

            easing:
                "cubic-bezier(.22,.61,.36,1)",

            fill:"forwards"

        }

    );


    /* -----------------------------------------------------
       BURST
       ----------------------------------------------------- */

    const burstGlyphs = [

        "♥",
        "♥",
        "♥",
        "✦",
        "♥",
        "♥",
        "✧",
        "♥"

    ];


    for(
        let i=0;
        i<20;
        i++
    ){

        const heart =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "text"
            );


        const randomAngle =
            Math.random() *
            Math.PI *
            2;


        const radius = 10;


        heart.setAttribute(
            "x",
            targetPoint.x +
            Math.cos(randomAngle) *
            radius
        );


        heart.setAttribute(
            "y",
            targetPoint.y +
            Math.sin(randomAngle) *
            radius
        );


        heart.setAttribute(
            "font-size",
            18 +
            Math.random()*25
        );


        heart.setAttribute(
            "fill",
            [
                "#e2447f",
                "#f6a6c1",
                "#eab35e",
                "#c8175a"
            ][
                Math.floor(
                    Math.random()*4
                )
            ]
        );


        heart.setAttribute(
            "text-anchor",
            "middle"
        );


        heart.textContent =
            burstGlyphs[
                i %
                burstGlyphs.length
            ];


        burstLayer.appendChild(heart);


        const moveX =
            (Math.random()-.5)*280;


        const moveY =
            -100 -
            Math.random()*280;


        heart.animate(

            [

                {
                    transform:
                        "translate(0,0)",
                    opacity:0
                },

                {
                    transform:
                        "translate(0,0)",
                    opacity:1
                },

                {
                    transform:
                        `translate(
                            ${moveX}px,
                            ${moveY}px
                        )`,
                    opacity:0
                }

            ],

            {

                duration:
                    900 +
                    Math.random()*700,

                delay:
                    Math.random()*120,

                easing:
                    "cubic-bezier(.2,.6,.3,1)",

                fill:"forwards"

            }

        );


        setTimeout(

            () => heart.remove(),

            1800

        );

    }


    /* -----------------------------------------------------
       GO TO TITLE
       ----------------------------------------------------- */

    setTimeout(

        () => {

            showScene(
                sceneTitle
            );


            /* -------------------------------------------------
               TITLE → TREE
               ------------------------------------------------- */

            setTimeout(

                () => {

                    showScene(
                        sceneTree
                    );


                    setTimeout(

                        () => {

                            growTree();

                        },

                        500

                    );

                },

                CONFIG.titleDuration

            );

        },

        700

    );

}


/* =========================================================
   HEART CANOPY
   ========================================================= */

const heartCanopy =
    document.getElementById(
        "heart-canopy"
    );


let treeStarted = false;


/* =========================================================
   CREATE CANOPY HEART
   ========================================================= */

function createCanopyHeart(
    x,
    y,
    size,
    color,
    delay
){

    const heart =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "text"
        );


    heart.classList.add(
        "canopy-heart"
    );


    heart.setAttribute(
        "x",
        x
    );


    heart.setAttribute(
        "y",
        y
    );


    heart.setAttribute(
        "font-size",
        size
    );


    heart.setAttribute(
        "fill",
        color
    );


    heart.textContent =
        "♥";


    heartCanopy.appendChild(
        heart
    );


    setTimeout(

        () => {

            heart.classList.add(
                "bloom"
            );

        },

        delay

    );

}


/* =========================================================
   HEART CANOPY GENERATOR
   ========================================================= */

function generateHeartCanopy(){

    heartCanopy.innerHTML = "";


    const colors = [

        "#e52f72",
        "#ec4784",
        "#f15d94",
        "#f47ba7",
        "#d91f62",
        "#e93678",
        "#f49abb",
        "#f6b1c9",
        "#eab35e"

    ];


    /*
       Controlled heart-shaped rows.

       Unlike random mathematical points,
       these rows deliberately follow
       the exact visual shape we want.
    */

    const rows = [

        /* -----------------------------------------------
           LEFT TOP LOBE
           ----------------------------------------------- */

        [325,300,455,16],
        [345,275,480,20],
        [365,255,495,24],
        [385,240,510,28],


        /* -----------------------------------------------
           RIGHT TOP LOBE
           ----------------------------------------------- */

        [325,625,780,16],
        [345,600,805,20],
        [365,585,825,24],
        [385,570,840,28],


        /* -----------------------------------------------
           HEART WIDEST AREA
           ----------------------------------------------- */

        [405,230,850,38],
        [425,220,860,44],
        [445,215,865,48],
        [465,210,870,50],
        [485,205,875,52],
        [505,205,875,53],
        [525,205,875,54],
        [545,210,870,53],
        [565,215,865,52],
        [585,220,860,50],
        [605,230,850,48],
        [625,240,840,45],


        /* -----------------------------------------------
           LOWER HEART
           ----------------------------------------------- */

        [645,250,830,43],
        [665,265,815,40],
        [685,280,800,37],
        [705,300,780,34],
        [725,325,755,30],
        [745,350,730,26],
        [765,375,705,22],
        [785,400,685,18],
        [805,420,665,15],
        [825,440,645,12],
        [845,460,625,9],
        [865,480,605,7]


    ];


    let index = 0;


    rows.forEach(

        row => {

            const y =
                row[0];

            let left =
                row[1];

            let right =
                row[2];

            let count =
                row[3];


            /*
               Fix reversed/narrow rows.
            */

            if(left > right){

                const middle =
                    (left+right)/2;

                const width =
                    Math.abs(left-right);

                left =
                    middle -
                    width/2;

                right =
                    middle +
                    width/2;

            }


            for(
                let i=0;
                i<count;
                i++
            ){

                /*
                   Controlled randomness.
                   Hearts stay inside the designed
                   heart silhouette.
                */

                const x =
                    left +
                    Math.random() *
                    Math.max(
                        1,
                        right-left
                    );


                const yOffset =
                    (Math.random()-.5)*14;


                const size =
                    12 +
                    Math.random()*17;


                const color =
                    colors[
                        Math.floor(
                            Math.random() *
                            colors.length
                        )
                    ];


                const delay =
                    CONFIG.canopyStartDelay +

                    index *
                    CONFIG.heartBloomInterval +

                    Math.random()*220;


                createCanopyHeart(

                    x,

                    y+yOffset,

                    size,

                    color,

                    delay

                );


                index++;

            }

        }

    );

}


/* =========================================================
   GROW TREE
   ========================================================= */

function growTree(){

    if(treeStarted)
        return;


    treeStarted = true;


    /*
       Branches grow first.
    */

    const branches =
        document.getElementById(
            "tree-branches"
        );


    branches.style.opacity =
        "1";


    /*
       Wait until the tree structure
       has grown.

       Then bloom the hearts.
    */

    setTimeout(

        () => {

            generateHeartCanopy();

        },

        1200

    );

}

   RESTART
   ========================================================= */

document
    .getElementById("restartBtn")
    .addEventListener(

        "click",

        () => {

            location.reload();

        }

    );

</script>

    rel="stylesheet"

<style>

/* =========================================================
   COLORS
========================================================= */

:root{

    --cream:#fdece0;
    --cream-2:#fbdcc9;

    --rose-deep:#c8175a;
    --rose-mid:#e2447f;
    --rose-light:#f6a6c1;

    --gold:#eab35e;

    --ink:#4a2e2e;

    --paper:#fff7ef;

    --tree:#59352f;
    --tree-dark:#432721;
}


/* =========================================================
   GLOBAL
========================================================= */

*{
    box-sizing:border-box;
}


html,
body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    background:#1b0e14;

    font-family:'Quicksand',sans-serif;

    overflow:hidden;

    -webkit-tap-highlight-color:transparent;
}


/* =========================================================
   STAGE
========================================================= */

#stage-frame{

    position:fixed;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;
}


#stage{

    position:relative;

    width:min(100vw,56.25vh);

    height:min(177.78vw,100vh);

    overflow:hidden;

    background:
        linear-gradient(
            180deg,
            var(--cream),
            var(--cream-2)
        );

    box-shadow:
        0 0 60px rgba(0,0,0,.5);
}


/* =========================================================
   SCENES
========================================================= */

.scene{

    position:absolute;

    inset:0;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    opacity:0;

    pointer-events:none;

    transform:
        scale(1.04)
        translateY(25px);

    transition:
        opacity .9s ease,
        transform 1s cubic-bezier(.22,.8,.25,1);
}


.scene.active{

    opacity:1;

    pointer-events:auto;

    transform:
        scale(1)
        translateY(0);
}


/* =========================================================
   TEXT
========================================================= */

.eyebrow{

    font-family:'Fredoka',sans-serif;

    font-style:italic;

    font-weight:500;

    letter-spacing:.02em;

    color:var(--ink);

    opacity:.55;

    font-size:clamp(13px,3.4vw,16px);

    margin:0 0 6px;
}


.subtitle{

    font-family:'Fredoka',sans-serif;

    font-style:italic;

    font-weight:400;

    color:var(--ink);

    opacity:.6;

    font-size:clamp(12px,3vw,14px);

    margin-top:10px;

    text-align:center;
}


/* =========================================================
   SCENE 1 — ARCHERY
========================================================= */

#scene-archery{

    background:
        radial-gradient(
            ellipse at 50% 34%,
            #ffd9c2 0%,
            var(--cream) 55%,
            var(--cream-2) 100%
        );
}


#archery-svg{

    width:100%;
    height:100%;

    touch-action:none;

    user-select:none;
}


.archer-hint{

    fill:var(--ink);

    opacity:.4;

    font-family:'Fredoka',sans-serif;

    letter-spacing:.12em;

    font-size:22px;

    font-weight:600;

    text-anchor:middle;

    animation:
        pulse-hint
        1.8s
        ease-in-out
        infinite;
}


@keyframes pulse-hint{

    0%,100%{
        opacity:.25;
    }

    50%{
        opacity:.55;
    }
}


.heart-glow{

    filter:
        drop-shadow(
            0 0 40px
            rgba(216,60,110,.45)
        );
}


#bow-group path.limb{

    fill:none;

    stroke:#5b3a2c;

    stroke-width:14;

    stroke-linecap:round;
}


#bow-string{

    stroke:#8a7a63;

    stroke-width:2.5;

    fill:none;
}


#arrow-shaft{

    stroke:#5b3a2c;

    stroke-width:6;

    stroke-linecap:round;
}


#arrow-head{

    fill:var(--gold);
}


#arrow-fletch{

    fill:var(--rose-mid);
}


/* =========================================================
   HEART IMPACT
========================================================= */

#heart-target.heart-hit{

    animation:
        heartImpact
        420ms
        ease-out;
}


@keyframes heartImpact{

    0%{
        transform:
            translate(540px,420px)
            scale(1);
    }

    30%{
        transform:
            translate(540px,420px)
            scale(1.35);
    }

    55%{
        transform:
            translate(540px,420px)
            scale(.85);
    }

    100%{
        transform:
            translate(540px,420px)
            scale(1);
    }
}


/* =========================================================
   HEART FALL
========================================================= */

#heart-target.heart-falling{

    animation:
        heartFall
        850ms
        cubic-bezier(.55,.05,.75,.35)
        forwards;
}


@keyframes heartFall{

    0%{

        transform:
            translate(540px,420px)
            rotate(0deg)
            scale(1);

        opacity:1;
    }

    20%{

        transform:
            translate(540px,455px)
            rotate(-5deg)
            scale(1.1);

        opacity:1;
    }

    100%{

        transform:
            translate(540px,1770px)
            rotate(28deg)
            scale(.55);

        opacity:0;
    }
}


/* =========================================================
   SCENE 2 — TITLE
========================================================= */

#scene-title{

    background:
        radial-gradient(
            120% 90% at 50% 30%,
            var(--rose-mid),
            var(--rose-deep) 65%,
            #8f0f42
        );
}


#scene-title .eyebrow,
#scene-title .subtitle{

    color:var(--paper);

    opacity:.75;
}


.title{

    font-family:'Playfair Display',serif;

    font-weight:900;

    color:var(--paper);

    font-size:clamp(48px,13.5vw,72px);

    line-height:.98;

    text-align:center;

    margin:2px 0;

    text-shadow:
        0 6px 30px rgba(0,0,0,.25);
}


.swash{

    width:140px;

    height:18px;

    margin:14px auto 4px;

    border-bottom:
        3px solid var(--gold);

    border-radius:50%;

    transform:
        rotate(-1.5deg)
        scaleY(.6);
}


/* =========================================================
   TITLE ANIMATION
========================================================= */

#scene-title .eyebrow,
#scene-title .title,
#scene-title .swash,
#scene-title .subtitle{

    opacity:0;

    transform:
        translateY(25px);

    transition:
        opacity .7s ease,
        transform .9s
        cubic-bezier(.2,.8,.2,1);
}


#scene-title.active .eyebrow{

    opacity:.75;

    transform:translateY(0);

    transition-delay:.25s;
}


#scene-title.active .title{

    opacity:1;

    transform:translateY(0);

    transition-delay:.4s;
}


#scene-title.active .swash{

    opacity:.9;

    transform:
        rotate(-1.5deg)
        scaleY(.6)
        translateY(0);

    transition-delay:.65s;
}


#scene-title.active .subtitle{

    opacity:.75;

    transform:translateY(0);

    transition-delay:.8s;
}


/* =========================================================
   SCENE 3 — TREE
========================================================= */

#scene-tree{

    justify-content:flex-end;

    background:
        radial-gradient(
            ellipse at 50% 15%,
            #fff8ef 0%,
            var(--cream) 48%,
            var(--cream-2) 100%
        );
}


/* =========================================================
   TREE AREA
========================================================= */

#tree-wrap{

    position:relative;

    width:100%;

    flex:1;

    min-height:0;

    overflow:hidden;
}


/* =========================================================
   TREE SVG
========================================================= */

#tree-svg{

    position:absolute;

    inset:0;

    width:100%;

    height:100%;

    overflow:visible;

    pointer-events:none;
}


/* =========================================================
   TREE PATHS
========================================================= */

.tree-main{

    fill:none;

    stroke:var(--tree);

    stroke-linecap:round;

    stroke-linejoin:round;

    opacity:0;
}


.tree-trunk{

    stroke-width:42;
}


.tree-primary{

    stroke-width:25;
}


.tree-secondary{

    stroke-width:13;
}


.tree-twig{

    stroke-width:6;
}


/* =========================================================
   TREE GROW ANIMATION
========================================================= */

.tree-path.growing{

    opacity:1;
}


.tree-path.draw{

    stroke-dasharray:var(--path-length);

    stroke-dashoffset:var(--path-length);

    animation:
        drawBranch
        var(--draw-time)
        cubic-bezier(.35,.75,.25,1)
        forwards;
}


@keyframes drawBranch{

    to{
        stroke-dashoffset:0;
    }
}


/* =========================================================
   TREE TEXT
========================================================= */

.tree-text{

    position:absolute;

    left:0;

    bottom:0;

    z-index:10;

    width:100%;

    padding:
        0 0 7% 9%;

    text-align:left;

    opacity:0;

    transform:
        translateY(25px);

    transition:
        opacity 1s ease,
        transform 1s
        cubic-bezier(.2,.8,.2,1);
}


.tree-text.show{

    opacity:1;

    transform:translateY(0);
}


.tree-text .eyebrow{

    margin-bottom:2px;
}


.script-title{

    font-family:'Yellowtail',cursive;

    color:var(--rose-deep);

    font-size:clamp(44px,12vw,60px);

    line-height:.95;

    margin:0 0 6px;

    text-shadow:
        0 2px 10px
        rgba(200,23,90,.08);
}


.tree-text .subtitle{

    text-align:left;

    margin-top:2px;
}


/* =========================================================
   BLOOM HEARTS
========================================================= */

#tree-hearts{

    position:absolute;

    inset:0;

    z-index:5;

    pointer-events:none;
}


.mini-heart{

    position:absolute;

    transform:
        translate(-50%,-50%)
        scale(0);

    opacity:0;

    line-height:1;

    filter:
        drop-shadow(
            0 1px 4px
            rgba(120,40,60,.2)
        );
}


.mini-heart.bloomed{

    transform:
        translate(-50%,-50%)
        scale(1);

    opacity:1;

    animation:
        gentleSway
        4.5s
        ease-in-out
        infinite;
}


@keyframes gentleSway{

    0%,100%{
        margin-top:0;
    }

    50%{
        margin-top:-4px;
    }
}


/* =========================================================
   FLOATING HEARTS
========================================================= */

.floating-heart{

    position:absolute;

    font-size:18px;

    opacity:.45;

    animation:
        floatHeart
        5s
        ease-in-out
        infinite;
}


@keyframes floatHeart{

    0%,100%{

        transform:
            translateY(0)
            rotate(-5deg);
    }

    50%{

        transform:
            translateY(-16px)
            rotate(5deg);
    }
}


/* =========================================================
   RESTART
========================================================= */

#skip-btn{

    position:absolute;

    top:14px;

    right:14px;

    z-index:100;

    background:
        rgba(0,0,0,.18);

    color:#fff;

    border:none;

    border-radius:20px;

    font-family:'Fredoka',sans-serif;

    font-size:11px;

    padding:6px 12px;

    opacity:.55;

    cursor:pointer;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    #stage{

        width:100vw;

        height:100vh;
    }


    .tree-trunk{
        stroke-width:38;
    }


    .tree-primary{
        stroke-width:22;
    }


    .tree-secondary{
        stroke-width:11;
    }


    .tree-twig{
        stroke-width:5;
    }

}

</style>

<script>

(function(){

"use strict";


/* =========================================================
   CONFIG
========================================================= */

const CONFIG = {

    recipientName:null,

    archerCaption:
        "a little something, for you",

    titleEyebrow:
        "make a wish...",

    titleSub:
        "to someone worth celebrating",

    treeEyebrow:
        "and... make it count",

    treeSub:
        "here's to a year that blooms",

    autoAdvanceTitleMs:
        2600,

    heartCount:
        90,

    heartPalette:[
        "#e2447f",
        "#f6a6c1",
        "#eab35e",
        "#c8175a",
        "#f28aa8"
    ]

};


/* =========================================================
   TEXT
========================================================= */

document.getElementById(
    "archer-caption"
).textContent =
    CONFIG.archerCaption;


document.getElementById(
    "title-eyebrow"
).textContent =
    CONFIG.titleEyebrow;


document.getElementById(
    "title-sub"
).textContent =
    CONFIG.titleSub;


/* =========================================================
   SCENES
========================================================= */

const scenes = {

    archery:
        document.getElementById(
            "scene-archery"
        ),

    title:
        document.getElementById(
            "scene-title"
        ),

    tree:
        document.getElementById(
            "scene-tree"
        )

};


function showScene(name){

    Object.values(
        scenes
    ).forEach(scene => {

        scene.classList.remove(
            "active"
        );

    });


    requestAnimationFrame(() => {

        scenes[name].classList.add(
            "active"
        );

    });

}


/* =========================================================
   ARCHERY
========================================================= */

const svg =
    document.getElementById(
        "archery-svg"
    );


const bowGroup =
    document.getElementById(
        "bow-group"
    );


const arrowGroup =
    document.getElementById(
        "arrow-group"
    );


const bowString =
    document.getElementById(
        "bow-string"
    );


const limbTop =
    document.getElementById(
        "limb-top"
    );


const limbBottom =
    document.getElementById(
        "limb-bottom"
    );


const heartTarget =
    document.getElementById(
        "heart-target"
    );


const burstLayer =
    document.getElementById(
        "burst-layer"
    );


const pullHint =
    document.getElementById(
        "pull-hint"
    );


const bowAnchor = {

    x:230,
    y:1330

};


const targetPoint = {

    x:540,
    y:420

};


const dx =
    targetPoint.x -
    bowAnchor.x;


const dy =
    targetPoint.y -
    bowAnchor.y;


const dist =
    Math.hypot(
        dx,
        dy
    );


const dir = {

    x:dx / dist,
    y:dy / dist

};


const angleDeg =
    Math.atan2(
        dir.y,
        dir.x
    ) *
    180 /
    Math.PI;


bowGroup.setAttribute(

    "transform",

    `translate(
        ${bowAnchor.x},
        ${bowAnchor.y}
    )
    rotate(${angleDeg})`

);


const REST_OFFSET =
    150;


const MAX_PULL =
    130;


const FIRE_THRESHOLD =
    40;


let pulling =
    false;


let pullAmount =
    0;


let arrowHasBeenFired =
    false;


/* =========================================================
   ARROW
========================================================= */

function setArrow(pull){

    const nockX =
        REST_OFFSET -
        pull;


    arrowGroup.setAttribute(

        "transform",

        `translate(
            ${nockX},
            0
        )`

    );


    bowString.setAttribute(

        "points",

        `0,-140
         ${nockX - REST_OFFSET},0
         0,140`

    );


    const flex =
        60 +
        pull * .25;


    limbTop.setAttribute(

        "d",

        `M0,-140
         Q${flex},-70
         0,0`

    );


    limbBottom.setAttribute(

        "d",

        `M0,0
         Q${flex},70
         0,140`

    );

}


setArrow(0);


/* =========================================================
   POINTER → SVG
========================================================= */

function toSvgPoint(evt){

    const pt =
        svg.createSVGPoint();


    pt.x =
        evt.clientX;


    pt.y =
        evt.clientY;


    const ctm =
        svg.getScreenCTM()
        .inverse();


    return pt.matrixTransform(
        ctm
    );

}


/* =========================================================
   PULL
========================================================= */

function startPull(evt){

    if(arrowHasBeenFired){

        return;

    }


    pulling =
        true;


    pullHint.style.opacity =
        0;


    evt.preventDefault();

}


function movePull(evt){

    if(!pulling){

        return;

    }


    const p =
        toSvgPoint(evt);


    const vx =
        p.x -
        bowAnchor.x;


    const vy =
        p.y -
        bowAnchor.y;


    const along =
        vx * dir.x +
        vy * dir.y;


    let pull =
        REST_OFFSET -
        along;


    pull =
        Math.max(
            0,
            Math.min(
                MAX_PULL,
                pull
            )
        );


    pullAmount =
        pull;


    setArrow(
        pull
    );


    evt.preventDefault();

}


function endPull(){

    if(!pulling){

        return;

    }


    pulling =
        false;


    if(
        pullAmount >=
        FIRE_THRESHOLD
    ){

        fireArrow(
            pullAmount
        );

    }

    else{

        springBack();

    }

}


/* =========================================================
   SPRING BACK
========================================================= */

function springBack(){

    const start =
        pullAmount;


    const startTime =
        performance.now();


    const duration =
        260;


    function animateBack(time){

        const progress =
            Math.min(
                1,
                (time - startTime) /
                duration
            );


        const value =
            start *
            (1 - progress);


        setArrow(
            value
        );


        pullAmount =
            value;


        if(progress < 1){

            requestAnimationFrame(
                animateBack
            );

        }

        else{

            pullHint.style.opacity =
                .4;

        }

    }


    requestAnimationFrame(
        animateBack
    );

}


svg.addEventListener(
    "pointerdown",
    startPull
);


window.addEventListener(
    "pointermove",
    movePull
);


window.addEventListener(
    "pointerup",
    endPull
);


/* =========================================================
   FIRE ARROW
========================================================= */

function fireArrow(power){

    if(arrowHasBeenFired){

        return;

    }


    arrowHasBeenFired =
        true;


    const nockX =
        REST_OFFSET -
        power;


    const rad =
        angleDeg *
        Math.PI /
        180;


    const startWorld = {

        x:
            bowAnchor.x +
            nockX *
            Math.cos(rad),

        y:
            bowAnchor.y +
            nockX *
            Math.sin(rad)

    };


    const flying =
        document.createElementNS(

            "http://www.w3.org/2000/svg",

            "g"

        );


    flying.setAttribute(

        "transform",

        `translate(
            ${startWorld.x},
            ${startWorld.y}
        )
        rotate(${angleDeg})`

    );


    flying.innerHTML = `

        <line
            x1="0"
            y1="0"
            x2="150"
            y2="0"
            stroke="#5b3a2c"
            stroke-width="6"
            stroke-linecap="round"
        />

        <polygon
            points="150,0 130,-9 130,9"
            fill="#eab35e"
        />

        <polygon
            points="0,0 -18,-10 -10,0 -18,10"
            fill="#e2447f"
        />

    `;


    svg.appendChild(
        flying
    );


    setArrow(0);

    pullAmount =
        0;


    const startTime =
        performance.now();


    const duration =
        520;


    const travelDist =
        Math.hypot(

            targetPoint.x -
            startWorld.x,

            targetPoint.y -
            startWorld.y

        ) - 55;


    function fly(time){

        const progress =
            Math.min(
                1,
                (time - startTime) /
                duration
            );


        const ease =
            1 -
            Math.pow(
                1 - progress,
                3
            );


        const distance =
            travelDist *
            ease;


        flying.setAttribute(

            "transform",

            `translate(
                ${startWorld.x + dir.x * distance},
                ${startWorld.y + dir.y * distance}
            )
            rotate(${angleDeg})`

        );


        if(progress < 1){

            requestAnimationFrame(
                fly
            );

        }

        else{

            flying.remove();

            hitHeart();

        }

    }


    requestAnimationFrame(
        fly
    );

}


/* =========================================================
   HEART HIT
========================================================= */

function hitHeart(){

    heartTarget.classList.add(
        "heart-hit"
    );


    createImpactBurst();


    setTimeout(() => {

        heartTarget.classList.remove(
            "heart-hit"
        );


        heartTarget.classList.add(
            "heart-falling"
        );

    },300);


    /* TITLE */

    setTimeout(() => {

        showScene(
            "title"
        );

    },1050);


    /* TREE */

    setTimeout(() => {

        showScene(
            "tree"
        );

    },1050 + CONFIG.autoAdvanceTitleMs);


    /* TREE GROWTH */

    setTimeout(() => {

        growTree();

    },1050 + CONFIG.autoAdvanceTitleMs + 350);

}


/* =========================================================
   IMPACT BURST
========================================================= */

function createImpactBurst(){

    const glyphs = [

        "💗",
        "💛",
        "💕",
        "🩷",
        "✨",
        "💞",
        "💓",
        "💖"

    ];


    for(
        let i=0;
        i<20;
        i++
    ){

        const el =
            document.createElementNS(

                "http://www.w3.org/2000/svg",

                "text"

            );


        const angle =
            Math.random() *
            Math.PI *
            2;


        el.setAttribute(
            "x",
            targetPoint.x
        );


        el.setAttribute(
            "y",
            targetPoint.y
        );


        el.setAttribute(
            "text-anchor",
            "middle"
        );


        el.setAttribute(
            "font-size",
            20 +
            Math.random() *
            22
        );


        el.textContent =
            glyphs[
                i %
                glyphs.length
            ];


        burstLayer.appendChild(
            el
        );


        const distance =
            80 +
            Math.random() *
            180;


        el.animate(

            [

                {
                    transform:
                        "translate(0,0) scale(.4)",
                    opacity:0
                },

                {
                    transform:
                        "translate(0,0) scale(1)",
                    opacity:1
                },

                {
                    transform:
                        `translate(
                            ${Math.cos(angle)*distance}px,
                            ${Math.sin(angle)*distance}px
                        )
                        scale(.4)`,

                    opacity:0
                }

            ],

            {

                duration:
                    900 +
                    Math.random()*500,

                easing:
                    "cubic-bezier(.2,.7,.2,1)",

                fill:
                    "forwards"

            }

        );


        setTimeout(() => {

            el.remove();

        },1500);

    }

}


/* =========================================================
   TREE
========================================================= */

const treeSvg =
    document.getElementById(
        "tree-svg"
    );


const treePaths =
    Array.from(
        document.querySelectorAll(
            ".tree-path"
        )
    );


const treeHearts =
    document.getElementById(
        "tree-hearts"
    );


const treeText =
    document.getElementById(
        "tree-text"
    );


let treeGrown =
    false;


/* =========================================================
   PREPARE TREE PATHS
========================================================= */

function prepareTreePaths(){

    treePaths.forEach(
        path => {

            const length =
                path.getTotalLength();


            path.style.setProperty(
                "--path-length",
                length
            );


            path.style.strokeDasharray =
                length;


            path.style.strokeDashoffset =
                length;

        }
    );

}


prepareTreePaths();


/* =========================================================
   GROW TREE
========================================================= */

function growTree(){

    if(treeGrown){

        return;

    }


    treeGrown =
        true;


    /*
       The branches are divided into groups.

       1. Trunk
       2. Large branches
       3. Secondary branches
       4. Small twigs
       5. Hearts
    */


    const trunk =
        document.getElementById(
            "branch-trunk"
        );


    drawPath(
        trunk,
        1900
    );


    setTimeout(() => {

        const primary =
            treePaths.filter(
                path =>
                    path.classList.contains(
                        "tree-primary"
                    )
            );


        primary.forEach(
            (path,index) => {

                drawPath(
                    path,
                    1250 +
                    index * 160
                );

            }
        );

    },1500);


    setTimeout(() => {

        const secondary =
            treePaths.filter(
                path =>
                    path.classList.contains(
                        "tree-secondary"
                    )
            );


        secondary.forEach(
            (path,index) => {

                drawPath(
                    path,
                    850 +
                    index * 100
                );

            }
        );

    },3000);


    setTimeout(() => {

        const twigs =
            treePaths.filter(
                path =>
                    path.classList.contains(
                        "tree-twig"
                    )
            );


        twigs.forEach(
            (path,index) => {

                drawPath(
                    path,
                    500 +
                    index * 70
                );

            }
        );

    },4400);


    /*
       Hearts appear only after
       the tree structure is complete.
    */

    setTimeout(() => {

        createTreeHearts();

    },6100);


    /*
       Birthday text appears last.
    */

    setTimeout(() => {

        treeText.classList.add(
            "show"
        );

    },6900);

}


/* =========================================================
   DRAW ONE BRANCH
========================================================= */

function drawPath(
    path,
    duration
){

    const length =
        path.getTotalLength();


    path.style.setProperty(
        "--path-length",
        length
    );


    path.classList.add(
        "growing"
    );


    path.style.setProperty(
        "--draw-time",
        duration + "ms"
    );


    path.classList.add(
        "draw"
    );

}


/* =========================================================
   TREE HEARTS
========================================================= */

function createTreeHearts(){

    const positions = [

        [50,18],
        [42,25],
        [58,22],

        [35,29],
        [65,28],

        [27,36],
        [73,34],

        [20,43],
        [80,41],

        [31,45],
        [69,44],

        [39,35],
        [61,36],

        [46,30],
        [55,31],

        [15,50],
        [85,48],

        [25,55],
        [75,53],

        [37,51],
        [63,50],

        [48,43],
        [57,44]

    ];


    const glyphs = [

        "💗",
        "💛",
        "💕",
        "🩷",
        "✨",
        "💞",
        "💓",
        "💖"

    ];


    positions.forEach(
        (position,index) => {

            const heart =
                document.createElement(
                    "span"
                );


            heart.className =
                "mini-heart";


            heart.textContent =
                glyphs[
                    index %
                    glyphs.length
                ];


            heart.style.left =
                position[0] +
                "%";


            heart.style.top =
                position[1] +
                "%";


            heart.style.fontSize =
                (
                    10 +
                    Math.random()*9
                ) +
                "px";


            heart.style.color =
                CONFIG.heartPalette[
                    index %
                    CONFIG.heartPalette.length
                ];


            treeHearts.appendChild(
                heart
            );


            setTimeout(() => {

                heart.classList.add(
                    "bloomed"
                );

            },index * 100);

        }
    );

}

   RESTART
========================================================= */

document
    .getElementById(
        "skip-btn"
    )
    .addEventListener(
        "click",
        () => {

            location.reload();

        }
    );


/* =========================================================
   START
========================================================= */

showScene(
    "archery"
);


})();

</script>

<html lang="en">
<head>

               maximum-scale=1.0,
               user-scalable=no">

<title>Happy Birthday 🌸</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Yellowtail&display=swap"

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#180b12;
    font-family:'Fredoka',sans-serif;
}


/* =========================================================
   STAGE
========================================================= */

#stage-frame{
    position:fixed;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;
}

#stage{

    position:relative;

    width:min(100vw,56.25vh);
    height:min(177.78vw,100vh);

    overflow:hidden;

    background:
        radial-gradient(
            ellipse at 50% 42%,
            #fffdf8 0%,
            #fff5eb 38%,
            #fde4d7 72%,
            #f9d6ca 100%
        );

    box-shadow:
        0 0 70px rgba(0,0,0,.55);
}


/* =========================================================
   SOFT LIGHT
========================================================= */

.light{
    position:absolute;
    width:300px;
    height:300px;

    border-radius:50%;

    background:rgba(255,255,255,.42);

    filter:blur(70px);

    pointer-events:none;
}

.light.one{
    top:5%;
    left:-20%;
}

.light.two{
    top:25%;
    right:-25%;
}

.light.three{
    bottom:5%;
    left:20%;
}


/* =========================================================
   SCENE
========================================================= */

.scene{

    position:absolute;
    inset:0;

    opacity:0;
    pointer-events:none;

    transition:
        opacity 1.2s ease;
}

.scene.active{

    opacity:1;
    pointer-events:auto;
}


/* =========================================================
   TREE SCENE
========================================================= */

#tree-scene{
    overflow:hidden;
}


/* =========================================================
   HEART CANOPY
========================================================= */

#heart-canopy{

    position:absolute;

    /*
       IMPORTANT:

       This is the heart area.
       The tree branches are underneath this layer.
    */

    left:4%;
    right:4%;

    top:7%;
    height:69%;

    z-index:5;

    pointer-events:none;
}


/* =========================================================
   HEART EMOJIS
========================================================= */

.heart{

    position:absolute;

    transform:
        translate(-50%,-50%)
        scale(0);

    opacity:0;

    line-height:1;

    user-select:none;

    filter:
        drop-shadow(
            0 2px 3px rgba(160,50,80,.16)
        );

    transition:
        transform .65s cubic-bezier(.34,1.56,.64,1),
        opacity .5s ease;
}

.heart.show{

    transform:
        translate(-50%,-50%)
        scale(1);

    opacity:1;
}


/* slightly different sizes */

.heart.small{
    filter:
        drop-shadow(
            0 1px 2px rgba(160,50,80,.12)
        );
}

.heart.large{
    filter:
        drop-shadow(
            0 3px 5px rgba(160,50,80,.2)
        );
}


/* =========================================================
   TREE STRUCTURE
========================================================= */

#tree-svg{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    z-index:3;

    pointer-events:none;
}


/*
    ALL TREE STRUCTURE IS BELOW THE HEARTS.

    z-index:
       tree = 3
       hearts = 5
*/


.tree-line{

    fill:none;

    stroke:#4a2726;

    stroke-linecap:round;
    stroke-linejoin:round;

    stroke-dasharray:1000;
    stroke-dashoffset:1000;

    transition:
        stroke-dashoffset 2.5s
        cubic-bezier(.22,.8,.2,1);
}


.tree-line.main{
    stroke-width:17;
}

.tree-line.branch{
    stroke-width:9;
}

.tree-line.small{
    stroke-width:4.5;
}


/* =========================================================
   TREE GROWING
========================================================= */

#tree-svg.grow .tree-line{
    stroke-dashoffset:0;
}


/* =========================================================
   BOTTOM TEXT
========================================================= */

#birthday-text{

    position:absolute;

    left:7%;
    bottom:8%;

    z-index:10;

    width:46%;

    text-align:left;

    color:#9e2859;
}


#birthday-text .eyebrow{

    font-family:
        'Playfair Display',
        serif;

    font-style:italic;

    font-size:clamp(
        11px,
        2.8vw,
        15px
    );

    color:#754039;

    margin-bottom:4px;
}


#birthday-text h1{

    font-family:
        'Yellowtail',
        cursive;

    font-size:clamp(
        42px,
        11vw,
        65px
    );

    font-weight:400;

    line-height:.88;

    color:#c51f62;

    text-shadow:
        0 2px 10px
        rgba(190,30,90,.12);
}


#birthday-text .subtitle{

    margin-top:12px;

    font-family:
        'Playfair Display',
        serif;

    font-style:italic;

    font-size:clamp(
        10px,
        2.7vw,
        14px
    );

    color:#754039;
}


/* =========================================================
   TEXT DECORATIONS
========================================================= */

.text-heart{

    position:absolute;

    font-size:22px;

    opacity:.8;

    animation:
        textFloat 3s
        ease-in-out infinite;
}

.text-heart.one{
    top:8px;
    right:-4px;
}

.text-heart.two{
    bottom:10px;
    right:8px;
    font-size:17px;
}

@keyframes textFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-5px);
    }
}


/* =========================================================
   FLOATING HEARTS OUTSIDE TREE
========================================================= */

.floating-heart{

    position:absolute;

    z-index:8;

    pointer-events:none;

    opacity:.7;

    animation:
        floatAround
        5s
        ease-in-out
        infinite;
}

@keyframes floatAround{

    0%,100%{
        transform:
            translateY(0)
            rotate(-5deg);
    }

    50%{
        transform:
            translateY(-16px)
            rotate(5deg);
    }
}


/* =========================================================
   RESTART BUTTON
========================================================= */

#restart{

    position:absolute;

    top:12px;
    right:12px;

    z-index:30;

    border:none;

    border-radius:20px;

    padding:5px 11px;

    font-family:'Fredoka',sans-serif;

    font-size:10px;

    color:white;

    background:
        rgba(70,35,45,.16);

    opacity:.45;

    cursor:pointer;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:420px){

    #birthday-text{
        left:7%;
        bottom:7%;
        width:48%;
    }

    #birthday-text h1{
        font-size:48px;
    }

}

@media(prefers-reduced-motion:reduce){

    *{
        animation:none !important;
        transition:none !important;
    }

}

</style>
</head>

<script>

/* =========================================================
   CONFIG
========================================================= */

const CONFIG = {

    /*
       Number of hearts.

       Higher = denser.

       900 gives a VERY dense heart.
    */

    heartCount: 900,

    /*
       Delay between each heart appearing.
    */

    bloomDelay: 2,

    /*
       Heart colors.
    */

    hearts: [
        "💗",
        "💕",
        "🩷",
        "💖",
        "💓",
        "💞",
        "❤️",
        "🧡",
        "💛",
        "💝"
    ]

};


/* =========================================================
   ELEMENTS
========================================================= */

const canopy =
    document.getElementById("heart-canopy");

const tree =
    document.getElementById("tree-svg");


/* =========================================================
   HEART SHAPE

   Returns TRUE if point belongs inside a heart.

   This creates the actual heart-shaped canopy.
========================================================= */

function insideHeart(x,y){

    /*
       Classic mathematical heart.
    */

    const value =
        Math.pow(
            x*x + y*y - 1,
            3
        )
        -
        x*x*y*y*y;

    return value <= 0;
}


/* =========================================================
   GENERATE HEART POSITIONS
========================================================= */

function createHeartPositions(count){

    const points = [];

    let attempts = 0;

    /*
       We use rejection sampling.

       This makes the emojis naturally fill
       the complete heart.
    */

    while(
        points.length < count &&
        attempts < count * 100
    ){

        attempts++;

        /*
           Heart coordinates.

           X:
           -1.35 → +1.35

           Y:
           -1.3 → +1.3
        */

        const x =
            (Math.random()*2 - 1)
            * 1.35;

        const y =
            (Math.random()*2 - 1)
            * 1.30;


        if(
            insideHeart(x,y)
        ){

            points.push({
                x:x,
                y:y
            });

        }

    }

    return points;
}


/* =========================================================
   CREATE DENSE HEART TREE
========================================================= */

function growHeart(){

    /*
       Clear anything previously created.
    */

    canopy.innerHTML = "";


    const points =
        createHeartPositions(
            CONFIG.heartCount
        );


    /*
       Get actual canopy dimensions.
    */

    const width =
        canopy.clientWidth;

    const height =
        canopy.clientHeight;


    points.forEach(
        (point,index)=>{

            const heart =
                document.createElement("span");


            heart.className =
                "heart";


            /*
               Random emoji.
            */

            heart.textContent =
                CONFIG.hearts[
                    Math.floor(
                        Math.random()
                        *
                        CONFIG.hearts.length
                    )
                ];


            /* -----------------------------------------
               POSITION
            ----------------------------------------- */

            /*
               Convert mathematical heart
               coordinates to screen coordinates.
            */

            const x =
                width/2
                +
                (point.x/1.35)
                *
                (width/2);


            const y =
                height/2
                -
                (point.y/1.30)
                *
                (height/2);


            heart.style.left =
                x + "px";


            heart.style.top =
                y + "px";


            /* -----------------------------------------
               SIZE
            ----------------------------------------- */

            /*
               Dense small hearts with
               occasional larger hearts.
            */

            const random =
                Math.random();


            let size;

            if(random < .78){

                size =
                    8 +
                    Math.random()*8;

            }
            else if(random < .95){

                size =
                    13 +
                    Math.random()*8;

            }
            else{

                size =
                    20 +
                    Math.random()*9;

            }


            heart.style.fontSize =
                size + "px";


            /* -----------------------------------------
               RANDOM ROTATION
            ----------------------------------------- */

            heart.style.rotate =
                (
                    -15 +
                    Math.random()*30
                ) + "deg";


            /* -----------------------------------------
               BLOOM DELAY
            ----------------------------------------- */

            /*
               Small randomized delay makes
               the canopy look like it is growing.
            */

            const delay =
                index *
                CONFIG.bloomDelay
                +
                Math.random()*500;


            setTimeout(
                ()=>{
                    heart.classList.add("show");
                },
                delay
            );


            canopy.appendChild(
                heart
            );

        }
    );
}


/* =========================================================
   START TREE
========================================================= */

function startTree(){

    /*
       First grow the actual tree.
    */

    tree.classList.add("grow");


    /*
       Then grow the heart canopy.

       The branches remain underneath
       the heart emojis.
    */

    setTimeout(
        ()=>{
            growHeart();
        },
        900
    );

}


/* =========================================================
   START
========================================================= */

window.addEventListener(
    "load",
    ()=>{

        /*
           Give the page a moment
           before starting animation.
        */

        setTimeout(
            ()=>{
                startTree();
            },
            500
        );

    }
);


/* =========================================================
   RESTART
========================================================= */

document
    .getElementById("restart")
    .addEventListener(
        "click",
        ()=>{
            location.reload();
        }
    );


/* =========================================================
   RESIZE SUPPORT

   Important for mobile.

   Rebuilds the heart canopy if the
   screen orientation changes.
========================================================= */

let resizeTimer;

window.addEventListener(
    "resize",
    ()=>{

        clearTimeout(
            resizeTimer
        );

        resizeTimer =
            setTimeout(
                ()=>{
                    growHeart();
                },
                300
            );

    }
);

</script>

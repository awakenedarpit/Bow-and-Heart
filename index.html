<!DOCTYPE html>
<html lang="en">

<style>

/* =========================================================
   BASIC SETUP
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    background:#160b11;
}

body{
    font-family:'Fredoka',sans-serif;
}

/* =========================================================
   STAGE
========================================================= */

#stage-frame{
    position:fixed;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;
}

#stage{
    position:relative;

    width:min(100vw,56.25vh);
    height:min(177.78vw,100vh);

    overflow:hidden;

    background:
        radial-gradient(
            ellipse at 50% 25%,
            #fffdf8 0%,
            #fff5e9 38%,
            #fde9dc 72%,
            #fbdccf 100%
        );

    box-shadow:
        0 0 70px rgba(0,0,0,.45);
}

/* =========================================================
   SCENE SYSTEM
========================================================= */

.scene{
    position:absolute;
    inset:0;

    opacity:0;
    pointer-events:none;

    transition:
        opacity 1s ease,
        transform 1s ease;

    transform:scale(1.02);
}

.scene.active{
    opacity:1;
    pointer-events:auto;
    transform:scale(1);
}

/* =========================================================
   RESTART
========================================================= */

#restart{
    position:absolute;

    top:26px;
    right:18px;

    z-index:100;

    border:none;

    padding:13px 22px;

    border-radius:30px;

    background:rgba(120,75,80,.12);

    backdrop-filter:blur(8px);

    color:white;

    font-family:'Fredoka',sans-serif;
    font-size:15px;

    cursor:pointer;

    transition:.3s ease;
}

#restart:hover{
    background:rgba(120,75,80,.22);
}

#restart:active{
    transform:scale(.94);
}

/* =========================================================
   SCENE 1 — ARCHERY
========================================================= */

#scene-archery{
    background:
        radial-gradient(
            ellipse at 50% 30%,
            #fff6eb 0%,
            #fde9dc 65%,
            #f9d7cb 100%
        );
}

#archery-svg{
    width:100%;
    height:100%;

    touch-action:none;
    user-select:none;
}

/* =========================================================
   SCENE 2 — TITLE
========================================================= */

#scene-title{
    display:flex;

    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    background:
        radial-gradient(
            circle at 50% 40%,
            #ec6295 0%,
            #d42a68 55%,
            #9b1749 100%
        );
}

.title-eyebrow{
    color:#fff4f7;

    opacity:.8;

    font-size:17px;

    font-style:italic;

    margin-bottom:12px;
}

.big-title{
    margin:0;

    color:white;

    font-family:'Playfair Display',serif;

    font-size:clamp(52px,14vw,76px);

    line-height:.95;

    text-shadow:
        0 8px 30px rgba(0,0,0,.25);
}

.title-line{
    width:150px;

    height:15px;

    margin:18px 0 8px;

    border-bottom:3px solid #f4c96b;

    border-radius:50%;
}

.title-sub{
    color:white;

    opacity:.78;

    font-size:15px;

    font-style:italic;
}

/* =========================================================
   SCENE 3 — TREE
========================================================= */

#scene-tree{

    position:absolute;
    inset:0;

    overflow:hidden;

    background:
        radial-gradient(
            ellipse at 50% 15%,
            #fffefb 0%,
            #fff7ec 36%,
            #fdeade 72%,
            #fbdccf 100%
        );
}

/* =========================================================
   TREE SVG
========================================================= */

#tree-svg{

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    overflow:visible;

    pointer-events:none;
}

/* ---------------------------------------------------------
   TREE TRUNK
--------------------------------------------------------- */

.tree-trunk{

    fill:url(#trunkGradient);

    transform-origin:center bottom;

    clip-path:inset(100% 0 0 0);

    transition:
        clip-path 2.8s cubic-bezier(.22,.8,.25,1);
}

.tree-trunk.grow{

    clip-path:inset(0 0 0 0);
}

/* ---------------------------------------------------------
   BRANCHES
--------------------------------------------------------- */

.branch{

    fill:none;

    stroke:url(#branchGradient);

    stroke-linecap:round;
    stroke-linejoin:round;

    stroke-dasharray:1000;

    stroke-dashoffset:1000;

    transition:
        stroke-dashoffset 2s cubic-bezier(.22,.8,.25,1);
}

.branch.main{
    stroke-width:27;
}

.branch.secondary{
    stroke-width:15;
}

.branch.small{
    stroke-width:7;
}

.branch.grow{
    stroke-dashoffset:0;
}

/* =========================================================
   HEART CANOPY
========================================================= */

#heart-canopy{

    position:absolute;

    /*
       LARGE HEART
       This is intentionally much larger than
       the previous version.
    */

    left:50%;

    top:7%;

    width:92%;

    height:64%;

    transform:
        translateX(-50%);

    pointer-events:none;

    overflow:visible;
}

/* =========================================================
   CANOPY HEARTS
========================================================= */

.canopy-heart{

    position:absolute;

    transform:
        translate(-50%,-50%)
        scale(0);

    opacity:0;

    line-height:1;

    user-select:none;

    filter:
        drop-shadow(
            0 2px 3px rgba(160,40,80,.18)
        );

    transition:
        transform .55s cubic-bezier(.34,1.56,.64,1),
        opacity .4s ease;
}

.canopy-heart.bloom{

    opacity:1;

    transform:
        translate(-50%,-50%)
        scale(1);
}

/* =========================================================
   HEART FLOATERS
========================================================= */

.floating-heart{

    position:absolute;

    z-index:4;

    pointer-events:none;

    animation:
        floatHeart
        5s
        ease-in-out
        infinite;

    opacity:.65;
}

@keyframes floatHeart{

    0%,100%{
        transform:translateY(0) rotate(-5deg);
    }

    50%{
        transform:translateY(-18px) rotate(5deg);
    }
}

/* =========================================================
   BIRTHDAY TEXT
========================================================= */

.tree-message{

    position:absolute;

    left:7%;

    bottom:8%;

    z-index:20;

    width:46%;

    pointer-events:none;
}

.tree-eyebrow{

    margin:0 0 5px;

    color:#603737;

    font-family:'Playfair Display',serif;

    font-size:clamp(13px,3.5vw,17px);

    font-style:italic;

    font-weight:700;
}

.birthday-script{

    margin:0;

    color:#d21865;

    font-family:'Yellowtail',cursive;

    font-size:clamp(55px,15vw,78px);

    line-height:.82;

    text-shadow:
        0 3px 12px rgba(200,30,90,.12);
}

.tree-sub{

    margin:16px 0 0;

    color:#5c3734;

    font-family:'Playfair Display',serif;

    font-size:clamp(12px,3.4vw,16px);

    font-weight:600;

    line-height:1.2;
}

/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *{
        animation-duration:.01ms!important;
        transition-duration:.01ms!important;
    }

}

</style>
</head>

<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const CONFIG = {

    /*
       Number of hearts in canopy.

       650 gives a dense canopy without becoming
       completely unreadable on mobile.
    */

    heartCount: 650,

    /*
       Delay before canopy starts blooming
       after branches finish.
    */

    canopyDelay: 3200,

    /*
       Time between individual heart blooms.
    */

    bloomSpacing: 5,

    /*
       Heart sizes.
    */

    minHeartSize: 8,
    maxHeartSize: 19
};


/* =========================================================
   SCENES
========================================================= */

const archeryScene =
    document.getElementById("scene-archery");

const titleScene =
    document.getElementById("scene-title");

const treeScene =
    document.getElementById("scene-tree");


function showScene(scene){

    document
        .querySelectorAll(".scene")
        .forEach(s => s.classList.remove("active"));

    scene.classList.add("active");
}


/* =========================================================
   ARCHERY
========================================================= */

const svg =
    document.getElementById("archery-svg");

const bow =
    document.getElementById("bow");

const arrow =
    document.getElementById("arrow");

const string =
    document.getElementById("string");

const target =
    document.getElementById("target");

const burst =
    document.getElementById("burst");

const hint =
    document.getElementById("pull-hint");


const bowX = 230;
const bowY = 1330;

const targetX = 540;
const targetY = 420;

const dx = targetX - bowX;
const dy = targetY - bowY;

const distance =
    Math.hypot(dx,dy);

const dirX = dx / distance;
const dirY = dy / distance;

const angle =
    Math.atan2(dy,dx) * 180 / Math.PI;


bow.setAttribute(
    "transform",
    `translate(${bowX},${bowY}) rotate(${angle})`
);


const REST = 150;
const MAX_PULL = 130;
const FIRE_LIMIT = 40;

let pulling = false;
let pullAmount = 0;


function setArrow(pull){

    const nock =
        REST - pull;

    arrow.setAttribute(
        "transform",
        `translate(${nock},0)`
    );

    string.setAttribute(
        "points",
        `0,-140 ${nock-REST},0 0,140`
    );
}


setArrow(0);


/* =========================================================
   POINTER POSITION
========================================================= */

function svgPoint(event){

    const point =
        svg.createSVGPoint();

    point.x =
        event.clientX;

    point.y =
        event.clientY;

    return point.matrixTransform(
        svg.getScreenCTM().inverse()
    );
}


/* =========================================================
   START PULL
========================================================= */

svg.addEventListener(
    "pointerdown",
    event => {

        pulling = true;

        hint.style.opacity = "0";

        svg.setPointerCapture(
            event.pointerId
        );

        event.preventDefault();
    }
);


/* =========================================================
   MOVE PULL
========================================================= */

svg.addEventListener(
    "pointermove",
    event => {

        if(!pulling) return;

        const p =
            svgPoint(event);

        const vx =
            p.x - bowX;

        const vy =
            p.y - bowY;

        const along =
            vx * dirX +
            vy * dirY;

        let pull =
            REST - along;

        pull =
            Math.max(
                0,
                Math.min(
                    MAX_PULL,
                    pull
                )
            );

        pullAmount = pull;

        setArrow(pull);

        event.preventDefault();
    }
);


/* =========================================================
   RELEASE
========================================================= */

svg.addEventListener(
    "pointerup",
    () => {

        if(!pulling) return;

        pulling = false;

        if(
            pullAmount >=
            FIRE_LIMIT
        ){

            fireArrow();

        }else{

            springBack();

        }
    }
);


/* =========================================================
   SPRING BACK
========================================================= */

function springBack(){

    const start =
        pullAmount;

    const startTime =
        performance.now();

    const duration =
        300;


    function animate(time){

        const progress =
            Math.min(
                1,
                (time-startTime)/
                duration
            );

        const value =
            start *
            (1-progress);

        setArrow(value);

        if(progress < 1){

            requestAnimationFrame(
                animate
            );

        }else{

            pullAmount = 0;

            hint.style.opacity = ".4";
        }
    }


    requestAnimationFrame(
        animate
    );
}


/* =========================================================
   FIRE ARROW
========================================================= */

function fireArrow(){

    const nock =
        REST - pullAmount;

    const rad =
        angle * Math.PI / 180;


    const startX =
        bowX +
        nock * Math.cos(rad);

    const startY =
        bowY +
        nock * Math.sin(rad);


    const flying =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "g"
        );


    flying.innerHTML = `

        <line
            x1="0"
            y1="0"
            x2="150"
            y2="0"
            stroke="#5b3a2c"
            stroke-width="6"
            stroke-linecap="round"
        />

        <polygon
            points="150,0 130,-9 130,9"
            fill="#eab35e"
        />

        <polygon
            points="0,0 -18,-10 -10,0 -18,10"
            fill="#e2447f"
        />

    `;


    svg.appendChild(flying);


    setArrow(0);

    pullAmount = 0;


    const start =
        performance.now();

    const duration =
        650;


    function animate(time){

        const p =
            Math.min(
                1,
                (time-start)/duration
            );

        const ease =
            1 -
            Math.pow(
                1-p,
                3
            );


        const currentX =
            startX +
            (targetX-startX)
            * ease;

        const currentY =
            startY +
            (targetY-startY)
            * ease;


        flying.setAttribute(
            "transform",
            `
            translate(
                ${currentX},
                ${currentY}
            )
            rotate(${angle})
            `
        );


        if(p < 1){

            requestAnimationFrame(
                animate
            );

        }else{

            flying.remove();

            heartHit();
        }
    }


    requestAnimationFrame(
        animate
    );
}


/* =========================================================
   HEART HIT
========================================================= */

function heartHit(){

    target.animate(

        [
            {
                transform:
                "translate(540px,420px) scale(1)"
            },

            {
                transform:
                "translate(540px,420px) scale(1.5)"
            },

            {
                transform:
                "translate(540px,420px) scale(1)"
            }
        ],

        {
            duration:600,
            easing:"ease-out"
        }
    );


    createBurst();


    setTimeout(
        () => {

            showScene(titleScene);

            setTimeout(
                () => {

                    showScene(treeScene);

                    startTree();

                },
                2600
            );

        },
        850
    );
}


/* =========================================================
   HEART BURST
========================================================= */

function createBurst(){

    const hearts = [
        "💗",
        "💕",
        "💖",
        "🩷",
        "💛",
        "✨"
    ];


    for(
        let i=0;
        i<22;
        i++
    ){

        const el =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "text"
            );


        el.textContent =
            hearts[
                i %
                hearts.length
            ];


        el.setAttribute(
            "x",
            targetX
        );

        el.setAttribute(
            "y",
            targetY
        );

        el.setAttribute(
            "font-size",
            18 +
            Math.random()*18
        );

        el.setAttribute(
            "text-anchor",
            "middle"
        );


        burst.appendChild(el);


        const x =
            (Math.random()-.5)
            * 300;

        const y =
            -(100 +
            Math.random()*250);


        el.animate(

            [
                {
                    transform:
                    "translate(0,0)",
                    opacity:1
                },

                {
                    transform:
                    `translate(${x}px,${y}px)`,
                    opacity:0
                }
            ],

            {
                duration:
                    1000 +
                    Math.random()*500,

                easing:
                    "ease-out"
            }
        );


        setTimeout(
            () => el.remove(),
            1700
        );
    }
}


/* =========================================================
   TREE START
========================================================= */

function startTree(){

    const trunk =
        document.getElementById(
            "main-trunk"
        );


    const branches =
        document.querySelectorAll(
            ".branch"
        );


    /*
       TRUNK FIRST
    */

    trunk.classList.add(
        "grow"
    );


    /*
       BRANCHES GROW AFTER
       THE TRUNK
    */

    setTimeout(
        () => {

            branches.forEach(
                (branch,index) => {

                    setTimeout(
                        () => {

                            branch.classList.add(
                                "grow"
                            );

                        },

                        index * 75
                    );

                }
            );

        },
        1100
    );


    /*
       CANOPY STARTS ONLY AFTER
       TREE STRUCTURE EXISTS
    */

    setTimeout(
        createHeartCanopy,
        CONFIG.canopyDelay
    );
}


/* =========================================================
   HEART SHAPE TEST
========================================================= */

/*
   This is the important part.

   Instead of randomly putting hearts
   into a rectangle, every heart is tested
   against the mathematical HEART CURVE.

   This keeps the canopy actually heart-shaped.
*/

function insideHeart(x,y){

    /*
       Standard implicit heart equation:

       (x²+y²-1)³ - x²y³ <= 0
    */

    const a =
        x*x +
        y*y -
        1;


    return (
        a*a*a -
        x*x*y*y*y
    ) <= 0;
}


/* =========================================================
   CREATE HEART CANOPY
========================================================= */

function createHeartCanopy(){

    const canopy =
        document.getElementById(
            "heart-canopy"
        );


    canopy.innerHTML = "";


    const hearts = [
        "💗",
        "💕",
        "💖",
        "🩷",
        "💞",
        "💓",
        "💘",
        "💝",
        "💟",
        "❤️",
        "💛"
    ];


    /*
       Get actual size.

       This is important for mobile
       because the viewport is different
       on every phone.
    */

    const width =
        canopy.clientWidth;

    const height =
        canopy.clientHeight;


    /*
       We generate a dense cloud.

       Hearts are NOT generated in a
       simple rectangle.

       They are generated ONLY when
       insideHeart() returns true.
    */

    const positions = [];


    let attempts = 0;


    while(
        positions.length <
        CONFIG.heartCount &&
        attempts < 100000
    ){

        attempts++;


        /*
           Mathematical heart coordinates.
        */

        const x =
            Math.random()*2.35 -
            1.175;

        const y =
            Math.random()*2.2 -
            1.1;


        if(
            insideHeart(
                x,
                y
            )
        ){

            positions.push({
                x,
                y
            });

        }
    }


    /*
       Sort from upper to lower.

       This creates a more natural
       blooming sequence.
    */

    positions.sort(
        (a,b) =>
            a.y - b.y
    );


    positions.forEach(
        (p,index) => {

            const heart =
                document.createElement(
                    "span"
                );


            heart.className =
                "canopy-heart";


            heart.textContent =
                hearts[
                    Math.floor(
                        Math.random() *
                        hearts.length
                    )
                ];


            /*
               Convert mathematical
               heart coordinates into
               screen coordinates.
            */

            const left =
                width/2 +
                (p.x/1.175) *
                (width/2);


            const top =
                height/2 -
                (p.y/1.1) *
                (height/2);


            heart.style.left =
                left + "px";


            heart.style.top =
                top + "px";


            /*
               Random but controlled size.
            */

            const size =
                CONFIG.minHeartSize +
                Math.random() *
                (
                    CONFIG.maxHeartSize -
                    CONFIG.minHeartSize
                );


            heart.style.fontSize =
                size + "px";


            /*
               Small rotation prevents
               mechanical appearance.
            */

            heart.style.marginLeft =
                (Math.random()*5-2.5)
                + "px";


            canopy.appendChild(
                heart
            );


            /*
               Bloom from top toward bottom.
            */

            setTimeout(
                () => {

                    heart.classList.add(
                        "bloom"
                    );

                },

                index *
                CONFIG.bloomSpacing
            );

        }
    );
}

   RESTART
========================================================= */

document
    .getElementById("restart")
    .addEventListener(
        "click",
        () => {

            location.reload();

        }
    );

</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Quicksand:wght@400;500;600&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Yellowtail&display=swap"
      rel="stylesheet">

<style>

/* =========================================================
   GLOBAL
========================================================= */

:root{
    --cream:#fff5ec;
    --cream2:#fbdcca;

    --brown:#4b2926;
    --brown2:#6b3830;

    --pink:#e72d72;
    --pink2:#f45a93;
    --pink3:#ff9fc1;

    --gold:#f2bd62;

    --text:#512f2b;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#160b11;
}

body{
    font-family:'Quicksand',sans-serif;
}


/* =========================================================
   STAGE
========================================================= */

#stage-frame{
    position:fixed;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#160b11;
}

#stage{
    position:relative;

    width:min(100vw,56.25vh);
    height:min(177.78vw,100vh);

    overflow:hidden;

    background:
        radial-gradient(
            ellipse at 50% 20%,
            #fffdf9 0%,
            #fff5ec 42%,
            #fbdcca 100%
        );

    box-shadow:
        0 0 60px rgba(0,0,0,.55);
}


/* =========================================================
   SCENES
========================================================= */

.scene{
    position:absolute;
    inset:0;

    opacity:0;
    visibility:hidden;
    pointer-events:none;

    transition:
        opacity 1s ease,
        transform 1s ease;

    transform:scale(1.03);
}

.scene.active{
    opacity:1;
    visibility:visible;
    pointer-events:auto;

    transform:scale(1);
}


/* =========================================================
   RESTART
========================================================= */

#restart{
    position:absolute;

    top:18px;
    right:18px;

    z-index:1000;

    border:0;
    border-radius:30px;

    padding:10px 18px;

    background:rgba(90,50,50,.12);
    color:white;

    font-family:'Fredoka',sans-serif;
    font-size:13px;

    backdrop-filter:blur(8px);

    cursor:pointer;
}


/* =========================================================
   SCENE 1 — ARCHERY
========================================================= */

#scene-archery{
    background:
        radial-gradient(
            ellipse at 50% 28%,
            #ffe4d2 0%,
            #fff2e6 48%,
            #fbd9c8 100%
        );
}

#archery-svg{
    width:100%;
    height:100%;

    touch-action:none;
    user-select:none;
}

#heart-target{
    transform-origin:center;
    filter:
        drop-shadow(0 0 20px rgba(235,45,114,.25))
        drop-shadow(0 0 45px rgba(235,45,114,.18));
}

#target-heart{
    transition:transform .3s ease;
}

.archery-caption{
    font-family:'Fredoka',sans-serif;
    font-style:italic;

    fill:#593c38;

    opacity:.55;

    font-size:32px;
}

.archery-hint{
    font-family:'Fredoka',sans-serif;

    fill:#593c38;

    opacity:.4;

    font-size:22px;

    letter-spacing:.12em;

    animation:
        hintPulse 1.7s ease-in-out infinite;
}

@keyframes hintPulse{

    0%,100%{
        opacity:.2;
    }

    50%{
        opacity:.65;
    }
}


/* BOW */

.bow-limb{
    fill:none;

    stroke:#5b352d;
    stroke-width:15;

    stroke-linecap:round;
}

#bow-string{
    fill:none;

    stroke:#8c7567;
    stroke-width:3;
}

#arrow-shaft{
    stroke:#5b352d;
    stroke-width:6;

    stroke-linecap:round;
}

#arrow-head{
    fill:#eab35e;
}

#arrow-fletch{
    fill:#e2447f;
}


/* =========================================================
   SCENE 2 — TITLE
========================================================= */

#scene-title{

    display:flex;

    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;

    background:
        radial-gradient(
            ellipse at 50% 30%,
            #f15b91 0%,
            #c8175a 65%,
            #8d0d40 100%
        );
}

.title-eyebrow{
    color:#fff5ee;

    opacity:.8;

    font-family:'Fredoka',sans-serif;
    font-style:italic;

    font-size:15px;
}

.title-main{

    margin:5px 0;

    color:#fff9f5;

    font-family:'Playfair Display',serif;

    font-weight:900;

    font-size:clamp(48px,14vw,76px);

    line-height:.95;

    text-shadow:
        0 8px 30px rgba(0,0,0,.25);
}

.title-line{

    width:140px;

    height:16px;

    margin:15px auto;

    border-bottom:3px solid #eab35e;

    border-radius:50%;
}

.title-sub{

    color:#fff4ec;

    opacity:.8;

    font-family:'Fredoka',sans-serif;

    font-style:italic;

    font-size:14px;
}


/* =========================================================
   SCENE 3 — TREE
========================================================= */

#scene-tree{

    background:
        radial-gradient(
            ellipse at 50% 20%,
            #fffdf9 0%,
            #fff4e8 45%,
            #fbdac9 100%
        );
}


/* =========================================================
   TREE SVG
========================================================= */

#tree-svg{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    overflow:visible;

    pointer-events:none;
}


/* ---------------------------------------------------------
   TREE BASE
--------------------------------------------------------- */

.tree-trunk{

    fill:url(#trunkGradient);

    transform-origin:bottom center;

    transform:scaleY(0);

    transition:
        transform 2.2s cubic-bezier(.2,.8,.25,1);

}

#scene-tree.active .tree-trunk{

    transform:scaleY(1);

}


/* ---------------------------------------------------------
   BRANCHES
--------------------------------------------------------- */

.branch{

    fill:none;

    stroke:url(#branchGradient);

    stroke-linecap:round;
    stroke-linejoin:round;

    stroke-dasharray:1800;

    stroke-dashoffset:1800;

    opacity:0;

}

#scene-tree.active .branch{

    animation:
        growBranch 1.8s cubic-bezier(.2,.75,.2,1) forwards;

}

@keyframes growBranch{

    0%{
        stroke-dashoffset:1800;
        opacity:0;
    }

    15%{
        opacity:1;
    }

    100%{
        stroke-dashoffset:0;
        opacity:1;
    }

}


/* different branch timings */

.branch.main{
    stroke-width:31;
    animation-delay:.7s;
}

.branch.secondary{
    stroke-width:18;
    animation-delay:1.0s;
}

.branch.small{
    stroke-width:9;
    animation-delay:1.35s;
}

.branch.tiny{
    stroke-width:5;
    animation-delay:1.6s;
}


/* =========================================================
   HEART CANOPY
========================================================= */

#heart-canopy{

    position:absolute;

    left:50%;

    top:7%;

    width:94%;

    height:58%;

    transform:
        translateX(-50%)
        scale(.35);

    opacity:0;

    pointer-events:none;

    transition:
        transform 1.7s cubic-bezier(.18,.9,.25,1),
        opacity 1s ease;

}

#scene-tree.active #heart-canopy{

    transform:
        translateX(-50%)
        scale(1);

    opacity:1;

    transition-delay:2.1s;

}


/* ---------------------------------------------------------
   CANOPY HEARTS
--------------------------------------------------------- */

.canopy-heart{

    position:absolute;

    transform:
        translate(-50%,-50%)
        scale(0);

    opacity:0;

    line-height:1;

    user-select:none;

    filter:
        drop-shadow(0 2px 3px rgba(100,30,50,.12));

    transition:
        transform .65s cubic-bezier(.2,1.5,.4,1),
        opacity .4s ease;

}


/* bloom */

.canopy-heart.bloom{

    transform:
        translate(-50%,-50%)
        scale(1);

    opacity:1;

}


/* gentle floating */

.canopy-heart.float{

    animation:
        heartFloat 4s ease-in-out infinite;

}

@keyframes heartFloat{

    0%,100%{
        margin-top:0;
    }

    50%{
        margin-top:-3px;
    }

}


/* =========================================================
   BIRTHDAY TEXT
========================================================= */

.tree-message{

    position:absolute;

    left:6.5%;

    bottom:8%;

    z-index:20;

    width:55%;

    opacity:0;

    transform:translateY(25px);

    transition:
        opacity 1.2s ease,
        transform 1.2s ease;

}

#scene-tree.active .tree-message{

    opacity:1;

    transform:translateY(0);

    transition-delay:3.2s;

}

.tree-eyebrow{

    margin:0 0 5px;

    color:#633b35;

    font-family:'Playfair Display',serif;

    font-style:italic;

    font-weight:700;

    font-size:clamp(13px,3.4vw,16px);

}

.tree-title{

    margin:0;

    color:#d51f66;

    font-family:'Yellowtail',cursive;

    font-size:clamp(48px,13vw,68px);

    line-height:.86;

    text-shadow:
        0 2px 10px rgba(180,30,80,.12);

}

.tree-sub{

    margin:12px 0 0;

    color:#633b35;

    font-family:'Playfair Display',serif;

    font-size:clamp(12px,3vw,15px);

    font-weight:700;

}


/* =========================================================
   FLOATING BACKGROUND HEARTS
========================================================= */

#floating-hearts{

    position:absolute;

    inset:0;

    z-index:5;

    pointer-events:none;

    overflow:hidden;

}

.floating-heart{

    position:absolute;

    opacity:.45;

    animation:
        floatAround 7s ease-in-out infinite;

}

@keyframes floatAround{

    0%,100%{
        transform:translateY(0) rotate(-5deg);
    }

    50%{
        transform:translateY(-15px) rotate(5deg);
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:500px){

    .tree-message{
        width:58%;
        bottom:7%;
    }

    .tree-title{
        font-size:clamp(45px,13vw,63px);
    }

    .tree-eyebrow{
        font-size:13px;
    }

    .tree-sub{
        font-size:12px;
    }

}

</style>

<script>

"use strict";


/* =========================================================
   CONFIGURATION
========================================================= */

const CONFIG = {

    /* number of hearts in canopy */
    canopyHearts: 620,

    /* maximum heart size */
    maxHeartSize: 22,

    /* minimum heart size */
    minHeartSize: 7,

    /* colors */
    colors:[
        "#e91e63",
        "#f23878",
        "#ff5b96",
        "#ff8db4",
        "#ffb0c9",
        "#ffd07a",
        "#f7a65c",
        "#d91e61"
    ]

};


/* =========================================================
   SCENES
========================================================= */

const sceneArchery =
    document.getElementById("scene-archery");

const sceneTitle =
    document.getElementById("scene-title");

const sceneTree =
    document.getElementById("scene-tree");


function showScene(scene){

    document.querySelectorAll(".scene")
        .forEach(s => s.classList.remove("active"));

    scene.classList.add("active");

}



/* =========================================================
   ARCHERY
========================================================= */

const svg =
    document.getElementById("archery-svg");

const bowGroup =
    document.getElementById("bow-group");

const arrowGroup =
    document.getElementById("arrow-group");

const bowString =
    document.getElementById("bow-string");

const limbTop =
    document.getElementById("limb-top");

const limbBottom =
    document.getElementById("limb-bottom");

const target =
    document.getElementById("heart-target");

const burstLayer =
    document.getElementById("burst-layer");

const hint =
    document.querySelector(".archery-hint");


/* bow position */

const bowX = 230;
const bowY = 1330;


/* target */

const targetX = 540;
const targetY = 420;


/* direction */

const dx =
    targetX - bowX;

const dy =
    targetY - bowY;

const distance =
    Math.hypot(dx,dy);

const dirX =
    dx / distance;

const dirY =
    dy / distance;

const angle =
    Math.atan2(dy,dx) * 180 / Math.PI;


/* rotate bow toward heart */

bowGroup.setAttribute(
    "transform",
    `translate(${bowX},${bowY}) rotate(${angle})`
);


/* bow values */

const REST =
    150;

const MAX_PULL =
    130;

const FIRE_THRESHOLD =
    42;


let pulling = false;

let pullAmount = 0;


/* =========================================================
   ARROW POSITION
========================================================= */

function setArrow(pull){

    const nock =
        REST - pull;

    arrowGroup.setAttribute(
        "transform",
        `translate(${nock},0)`
    );


    bowString.setAttribute(
        "points",
        `0,-140 ${nock - REST},0 0,140`
    );


    const flex =
        60 + pull * .25;


    limbTop.setAttribute(
        "d",
        `M0,-140 Q${flex},-70 0,0`
    );

    limbBottom.setAttribute(
        "d",
        `M0,0 Q${flex},70 0,140`
    );

}


setArrow(0);



/* =========================================================
   SCREEN → SVG
========================================================= */

function svgPoint(event){

    const point =
        svg.createSVGPoint();

    point.x =
        event.clientX;

    point.y =
        event.clientY;

    const matrix =
        svg.getScreenCTM().inverse();

    return point.matrixTransform(matrix);

}



/* =========================================================
   START PULL
========================================================= */

function startPull(event){

    if(!sceneArchery.classList.contains("active"))
        return;

    pulling = true;

    hint.style.opacity = "0";

    event.preventDefault();

}



/* =========================================================
   MOVE
========================================================= */

function movePull(event){

    if(!pulling)
        return;


    const p =
        svgPoint(event);


    const vx =
        p.x - bowX;

    const vy =
        p.y - bowY;


    const along =
        vx * dirX +
        vy * dirY;


    let pull =
        REST - along;


    pull =
        Math.max(
            0,
            Math.min(MAX_PULL,pull)
        );


    pullAmount =
        pull;


    setArrow(pull);


    event.preventDefault();

}



/* =========================================================
   RELEASE
========================================================= */

function endPull(){

    if(!pulling)
        return;


    pulling = false;


    if(pullAmount >= FIRE_THRESHOLD){

        fireArrow(pullAmount);

    }
    else{

        springBack();

    }

}



/* =========================================================
   SPRING BACK
========================================================= */

function springBack(){

    const start =
        pullAmount;

    const startTime =
        performance.now();

    const duration =
        280;


    function animate(time){

        const progress =
            Math.min(
                1,
                (time-startTime)/duration
            );


        const value =
            start * (1-progress);


        setArrow(value);


        if(progress < 1){

            requestAnimationFrame(animate);

        }
        else{

            pullAmount = 0;

            hint.style.opacity = ".4";

        }

    }


    requestAnimationFrame(animate);

}



/* =========================================================
   EVENTS
========================================================= */

svg.addEventListener(
    "pointerdown",
    startPull
);

window.addEventListener(
    "pointermove",
    movePull
);

window.addEventListener(
    "pointerup",
    endPull
);



/* =========================================================
   FIRE ARROW
========================================================= */

function fireArrow(power){

    const nock =
        REST - power;


    const rad =
        angle * Math.PI / 180;


    const startX =
        bowX +
        nock * Math.cos(rad);


    const startY =
        bowY +
        nock * Math.sin(rad);


    const flying =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "g"
        );


    flying.setAttribute(
        "transform",
        `translate(${startX},${startY}) rotate(${angle})`
    );


    flying.innerHTML = `

        <line
            x1="0"
            y1="0"
            x2="150"
            y2="0"
            stroke="#5b352d"
            stroke-width="6"
            stroke-linecap="round"
        />

        <polygon
            points="150,0 130,-9 130,9"
            fill="#eab35e"
        />

        <polygon
            points="0,0 -18,-10 -10,0 -18,10"
            fill="#e2447f"
        />

    `;


    svg.appendChild(flying);


    setArrow(0);

    pullAmount = 0;


    const startTime =
        performance.now();

    const duration =
        430;


    const travel =
        Math.hypot(
            targetX-startX,
            targetY-startY
        ) - 65;


    function fly(time){

        const progress =
            Math.min(
                1,
                (time-startTime)/duration
            );


        const ease =
            1 -
            Math.pow(1-progress,3);


        const x =
            startX +
            dirX * travel * ease;


        const y =
            startY +
            dirY * travel * ease;


        flying.setAttribute(
            "transform",
            `translate(${x},${y}) rotate(${angle})`
        );


        if(progress < 1){

            requestAnimationFrame(fly);

        }
        else{

            flying.remove();

            heartHit();

        }

    }


    requestAnimationFrame(fly);

}



/* =========================================================
   HEART HIT
========================================================= */

function heartHit(){

    target.animate(

        [
            {
                transform:"scale(1)"
            },

            {
                transform:"scale(1.4)"
            },

            {
                transform:"scale(.85)"
            },

            {
                transform:"scale(1.05)"
            },

            {
                transform:"scale(1)"
            }
        ],

        {
            duration:700,
            easing:"ease-out"
        }

    );


    createBurst();


    setTimeout(()=>{

        showScene(sceneTitle);


        setTimeout(()=>{

            showScene(sceneTree);

            startTree();

        },2600);

    },850);

}



/* =========================================================
   HEART BURST
========================================================= */

function createBurst(){

    const glyphs = [
        "💗",
        "💕",
        "💖",
        "💓",
        "💛",
        "🩷",
        "✨"
    ];


    for(let i=0;i<24;i++){

        const el =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "text"
            );


        const angle =
            Math.random()*Math.PI*2;


        const radius =
            20;


        const x =
            targetX +
            Math.cos(angle)*radius;


        const y =
            targetY +
            Math.sin(angle)*radius;


        el.setAttribute("x",x);

        el.setAttribute("y",y);

        el.setAttribute(
            "font-size",
            18 + Math.random()*20
        );

        el.setAttribute(
            "text-anchor",
            "middle"
        );

        el.textContent =
            glyphs[
                Math.floor(
                    Math.random()*glyphs.length
                )
            ];


        burstLayer.appendChild(el);


        const moveX =
            (Math.random()-.5)*300;

        const moveY =
            -100 -
            Math.random()*300;


        el.animate(

            [
                {
                    transform:"translate(0,0)",
                    opacity:0
                },

                {
                    transform:"translate(0,0)",
                    opacity:1
                },

                {
                    transform:
                        `translate(${moveX}px,${moveY}px)`,
                    opacity:0
                }
            ],

            {
                duration:
                    1000+
                    Math.random()*700,

                easing:
                    "cubic-bezier(.2,.6,.3,1)",

                fill:"forwards"
            }

        );

    }

}



/* =========================================================
   TREE START
========================================================= */

let treeStarted = false;


function startTree(){

    if(treeStarted)
        return;

    treeStarted = true;


    createFloatingHearts();


    /* wait until branches are visible */

    setTimeout(
        createCanopy,
        2500
    );

}



/* =========================================================
   HEART SHAPE MATHEMATICS
========================================================= */

/*
   This generates the ACTUAL heart outline:

        ♥♥♥
      ♥     ♥
     ♥       ♥
      ♥     ♥
        ♥ ♥
          ♥

   The points are scaled into a large canopy.
*/


function heartFunction(x,y){

    const a =
        x*x +
        y*y -
        1;


    return (
        a*a*a -
        x*x*y*y*y
    ) <= 0;

}



/* =========================================================
   CANOPY
========================================================= */

const canopy =
    document.getElementById(
        "heart-canopy"
    );


function createCanopy(){

    canopy.innerHTML = "";


    /*
       Bigger heart than previous version.
    */

    const width =
        canopy.clientWidth;

    const height =
        canopy.clientHeight;


    const points = [];


    /*
       Controlled grid sampling instead
       of completely random placement.

       This gives a much cleaner heart.
    */

    const columns = 48;

    const rows = 42;


    for(let row=0;row<rows;row++){

        for(let col=0;col<columns;col++){

            /*
               normalized coordinates
            */

            const nx =
                -1.35 +
                (col/(columns-1))*2.7;


            const ny =
                -1.25 +
                (row/(rows-1))*2.5;


            if(
                heartFunction(nx,ny)
            ){

                /*
                   small controlled randomness
                   so it looks organic
                */

                const jitterX =
                    (Math.random()-.5)*.035;

                const jitterY =
                    (Math.random()-.5)*.035;


                points.push({

                    x:nx+jitterX,

                    y:ny+jitterY

                });

            }

        }

    }


    /*
       Add additional points to make
       the canopy dense.
    */

    while(
        points.length <
        CONFIG.canopyHearts
    ){

        const x =
            -1.35 +
            Math.random()*2.7;

        const y =
            -1.25 +
            Math.random()*2.5;


        if(
            heartFunction(x,y)
        ){

            points.push({x,y});

        }

    }


    /*
       Shuffle slightly
    */

    points.sort(
        ()=>Math.random()-.5
    );


    /*
       Create hearts
    */

    points.forEach(
        (point,index)=>{

            const heart =
                document.createElement("span");


            heart.className =
                "canopy-heart";


            heart.textContent =
                "♥";


            /*
               map heart coordinates
            */

            const left =
                50 +
                (point.x / 1.35) * 50;


            /*
               y needs flipping
            */

            const top =
                50 -
                (point.y / 1.25) * 50;


            heart.style.left =
                left + "%";


            heart.style.top =
                top + "%";


            /*
               natural but controlled size
            */

            let size;


            /*
               larger hearts around
               outer silhouette
            */

            const edge =
                Math.abs(point.x);


            if(edge > 1.05){

                size =
                    8 +
                    Math.random()*6;

            }
            else{

                size =
                    CONFIG.minHeartSize +
                    Math.random() *
                    (
                        CONFIG.maxHeartSize -
                        CONFIG.minHeartSize
                    );

            }


            heart.style.fontSize =
                size + "px";


            /*
               color
            */

            heart.style.color =
                CONFIG.colors[
                    Math.floor(
                        Math.random() *
                        CONFIG.colors.length
                    )
                ];


            /*
               slight rotation
            */

            heart.style.rotate =
                (
                    -12 +
                    Math.random()*24
                ) + "deg";


            /*
               bloom delay.

               Top and outer areas don't
               all appear simultaneously.
            */

            const delay =
                200 +
                index * 2.2 +
                Math.random()*500;


            canopy.appendChild(
                heart
            );


            setTimeout(
                ()=>{
                    heart.classList.add(
                        "bloom"
                    );
                },
                delay
            );


            /*
               Some hearts gently float
            */

            if(
                Math.random() < .15
            ){

                heart.classList.add(
                    "float"
                );

            }

        }
    );

}



/* =========================================================
   FLOATING BACKGROUND HEARTS
========================================================= */

function createFloatingHearts(){

    const container =
        document.getElementById(
            "floating-hearts"
        );


    const glyphs = [
        "♡",
        "♥",
        "💗",
        "💛",
        "💕"
    ];


    for(let i=0;i<22;i++){

        const heart =
            document.createElement(
                "span"
            );


        heart.className =
            "floating-heart";


        heart.textContent =
            glyphs[
                Math.floor(
                    Math.random()*
                    glyphs.length
                )
            ];


        heart.style.left =
            Math.random()*95 + "%";


        heart.style.top =
            10 +
            Math.random()*85 +
            "%";


        heart.style.fontSize =
            10 +
            Math.random()*20 +
            "px";


        heart.style.color =
            CONFIG.colors[
                Math.floor(
                    Math.random()*
                    CONFIG.colors.length
                )
            ];


        heart.style.animationDelay =
            Math.random()*5 +
            "s";


        container.appendChild(

        );

    }

}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Happy Birthday 🎂</title>

<style>
/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #120910;
    font-family: Georgia, serif;
}


/* =========================================================
   MAIN SCENE
========================================================= */

.scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    min-height: 600px;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(255,255,255,.98) 0%,
            rgba(255,249,241,.95) 32%,
            rgba(255,232,217,.90) 70%,
            rgba(251,215,202,.92) 100%
        );
}


/* soft light */

.scene::before {
    content: "";
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            ellipse at 50% 45%,
            rgba(255,255,255,.72),
            transparent 58%
        );

    pointer-events: none;
}


/* =========================================================
   RESTART BUTTON
========================================================= */

#restart {
    position: absolute;

    top: 28px;
    right: 22px;

    z-index: 100;

    border: none;
    outline: none;

    padding: 14px 27px;

    border-radius: 40px;

    font-size: 17px;
    color: white;

    background: rgba(190,165,158,.35);

    backdrop-filter: blur(8px);

    cursor: pointer;

    transition: .3s ease;
}

#restart:hover {
    background: rgba(170,140,135,.48);
}


/* =========================================================
   TREE AREA
========================================================= */

.tree-wrapper {
    position: absolute;

    left: 50%;
    bottom: 0;

    width: min(100vw, 650px);
    height: 88vh;

    transform: translateX(-50%);

    z-index: 10;
}


/* =========================================================
   TREE SVG
========================================================= */

.tree-svg {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 100%;

    overflow: visible;

    z-index: 5;
}


/* =========================================================
   MAIN TRUNK
   MUCH NARROWER THAN PREVIOUS VERSION
========================================================= */

.trunk {
    fill: url(#trunkGradient);

    transform-origin: 50% 100%;

    opacity: 0;

    animation:
        trunkGrow 2.8s cubic-bezier(.22,.8,.25,1)
        forwards;
}


/*
   Narrow tapered trunk.

   Bottom ≈ 8%
   Middle ≈ 5%
   Top ≈ 3%

   This prevents the huge rectangular stem
   seen in the previous screenshot.
*/

@keyframes trunkGrow {

    0% {
        opacity: 0;
        transform: scaleY(0);
    }

    15% {
        opacity: 1;
    }

    100% {
        opacity: 1;
        transform: scaleY(1);
    }
}


/* =========================================================
   BRANCHES
========================================================= */

.branch {
    fill: none;

    stroke: #4a211f;

    stroke-linecap: round;
    stroke-linejoin: round;

    opacity: 0;

    stroke-dasharray: 900;
    stroke-dashoffset: 900;

    animation:
        branchGrow 2.3s ease forwards;
}

.branch.main {
    stroke-width: 13;
}

.branch.secondary {
    stroke-width: 7;
}

.branch.small {
    stroke-width: 4.5;
}


@keyframes branchGrow {

    0% {
        opacity: 0;
        stroke-dashoffset: 900;
    }

    15% {
        opacity: 1;
    }

    100% {
        opacity: 1;
        stroke-dashoffset: 0;
    }
}


/* =========================================================
   HEART CANOPY
========================================================= */

#canopy {
    position: absolute;

    left: 50%;
    top: 5%;

    width: 92%;
    height: 63%;

    transform: translateX(-50%);

    z-index: 20;

    pointer-events: none;
}


/*
   Each heart is placed using the HEART EQUATION.

   This gives an actual heart silhouette rather than
   a circle/oval cloud.
*/

.heart {
    position: absolute;

    display: flex;
    align-items: center;
    justify-content: center;

    transform:
        translate(-50%, -50%)
        scale(0);

    opacity: 0;

    line-height: 1;

    animation:
        heartAppear .7s cubic-bezier(.2,.9,.25,1.4)
        forwards;

    filter:
        drop-shadow(0 2px 2px rgba(120,30,60,.12));
}


@keyframes heartAppear {

    0% {
        opacity: 0;
        transform:
            translate(-50%, -50%)
            scale(0);
    }

    65% {
        opacity: 1;
        transform:
            translate(-50%, -50%)
            scale(1.18);
    }

    100% {
        opacity: .95;
        transform:
            translate(-50%, -50%)
            scale(1);
    }
}


/* =========================================================
   HEART COLORS
========================================================= */

.pink1 {
    color: #f24c8b;
}

.pink2 {
    color: #ff77a9;
}

.pink3 {
    color: #e92872;
}

.pink4 {
    color: #ffb0ca;
}

.pink5 {
    color: #d91e65;
}

.gold {
    color: #f4b83f;
}


/* =========================================================
   EXTRA FLOATING HEARTS
========================================================= */

.floating-heart {
    position: absolute;

    z-index: 2;

    opacity: .65;

    animation:
        floatHeart
        var(--duration)
        ease-in-out
        infinite alternate;
}

@keyframes floatHeart {

    from {
        transform:
            translateY(0)
            rotate(-8deg);
    }

    to {
        transform:
            translateY(-18px)
            rotate(8deg);
    }
}


/* =========================================================
   BIRTHDAY TEXT
========================================================= */

.message {
    position: absolute;

    left: 6%;

    bottom: 8%;

    z-index: 50;

    width: 43%;

    color: #512a25;

    text-align: left;
}

.message-small {
    font-size: clamp(13px, 2vw, 19px);

    font-weight: bold;

    font-style: italic;

    margin-bottom: 3px;
}

.message h1 {
    font-family: "Brush Script MT",
                 "Segoe Script",
                 cursive;

    font-size: clamp(45px, 7vw, 78px);

    line-height: .88;

    color: #d31865;

    text-shadow:
        0 2px 0 rgba(255,255,255,.25);
}

.message-bottom {
    margin-top: 18px;

    font-size: clamp(13px, 1.9vw, 20px);

    font-weight: bold;
}


/* =========================================================
   HEART GLOW
========================================================= */

.canopy-glow {
    position: absolute;

    left: 50%;
    top: 8%;

    width: 76%;
    height: 52%;

    transform: translateX(-50%);

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            rgba(255,115,168,.16),
            transparent 70%
        );

    filter: blur(25px);

    z-index: 1;

    pointer-events: none;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .tree-wrapper {
        width: 100vw;
        height: 82vh;
    }

    #canopy {
        width: 96%;
        height: 61%;
        top: 4%;
    }

        stroke-width: 10;
    }

    .branch.secondary {
        stroke-width: 5.5;
    }

    .branch.small {
        stroke-width: 3.2;
    }

    .message {
        left: 6%;
        bottom: 6%;

        width: 54%;
    }

    .message h1 {
        font-size: clamp(42px, 12vw, 64px);
    }

    .message-bottom {
        margin-top: 12px;
        font-size: 13px;
    }

    #restart {
        top: 20px;
        right: 16px;

        padding: 12px 22px;

        font-size: 15px;
    }
}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media (max-width: 380px) {

    .tree-wrapper {
        height: 79vh;
    }

    .message {
        width: 58%;
    }

    .message h1 {
        font-size: 42px;
    }

    .message-bottom {
        font-size: 11px;
    }
}

</style>

<script>

/* =========================================================
   HEART CANOPY GENERATOR
========================================================= */

/*
    IMPORTANT:

    The previous version used random positions.

    Random positions are what caused:
        ❌ circular canopy
        ❌ uneven gaps
        ❌ messy shape
        ❌ hearts outside the canopy

    This version uses the mathematical heart equation:

        x = 16 sin³(t)

        y =
        13 cos(t)
        - 5 cos(2t)
        - 2 cos(3t)
        - cos(4t)

    Then points are generated INSIDE that heart.

    Result:
        ❤️ clear top indentation
        ❤️ two rounded lobes
        ❤️ pointed bottom
        ❤️ controlled density
*/


const canopy = document.getElementById("canopy");


const colors = [
    "pink1",
    "pink1",
    "pink2",
    "pink2",
    "pink3",
    "pink3",
    "pink4",
    "pink5",
    "gold"
];


const heartSymbols = [
    "♥",
    "♥",
    "♥",
    "♥",
    "❤"
];



/* ---------------------------------------------------------
   HEART EQUATION
--------------------------------------------------------- */

function heartEquation(t) {

    const x =
        16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    return {
        x,
        y
    };
}



/* ---------------------------------------------------------
   POINT INSIDE HEART
--------------------------------------------------------- */

function insideHeart(x, y) {

    /*
       Normalize to the classic heart.

       x range:
       approximately -16 → +16

       y range:
       approximately -17 → +13
    */

    const nx = x / 16;
    const ny = y / 17;

    /*
       Implicit heart equation.

       This produces a stronger and cleaner
       heart silhouette.
    */

    const value =
        Math.pow(
            nx * nx + ny * ny - 1,
            3
        )
        -
        nx * nx * Math.pow(ny, 3);

    return value <= 0;
}



/* ---------------------------------------------------------
   GENERATE CANOPY
--------------------------------------------------------- */

function createCanopy() {

    canopy.innerHTML = "";

    const total = 430;

    const points = [];


    /*
       Generate many candidate points.
    */

    for (let i = 0; i < total * 5; i++) {

        /*
           Keep points inside a rectangular area
           before testing the heart equation.
        */

        const x =
            -16 +
            Math.random() * 32;

        const y =
            -17 +
            Math.random() * 30;


        if (!insideHeart(x, y)) {
            continue;
        }


        /*
           Convert mathematical coordinates
           into percentage coordinates.
        */

        const px =
            50 + (x / 16) * 45;


        /*
           Invert Y because CSS coordinates
           grow downward.
        */

        const py =
            48 - (y / 17) * 48;


        points.push({
            x: px,
            y: py
        });


        if (points.length >= total) {
            break;
        }
    }



    /*
       Sort from top to bottom.

       This gives the canopy a natural
       "growing downward" animation.
    */

    points.sort(
        (a,b) => a.y - b.y
    );



    points.forEach((point, index) => {

        const heart =
            document.createElement("span");

        heart.className =
            "heart " +
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];


        heart.textContent =
            heartSymbols[
                Math.floor(
                    Math.random() *
                    heartSymbols.length
                )
            ];


        /*
           Controlled heart size.

           Smaller toward outside,
           slightly larger inside.
        */

        const centerDistance =
            Math.abs(point.x - 50) / 50;


        let size =
            8 +
            Math.random() * 7;


        /*
           Slightly smaller near edges.
        */

        size *=
            1 -
            centerDistance * .20;


        heart.style.left =
            point.x + "%";

        heart.style.top =
            point.y + "%";

        heart.style.fontSize =
            size + "px";


        /*
           Staggered growth.
        */

        heart.style.animationDelay =
            (2.1 + index * 0.012) + "s";


        canopy.appendChild(heart);

    });

}



/* =========================================================
   FLOATING HEARTS OUTSIDE TREE
========================================================= */

function createFloatingHearts() {

    const scene =
        document.getElementById("scene");


    const positions = [

        [10, 20],
        [7, 38],
        [12, 56],
        [88, 24],
        [92, 44],
        [85, 61],
        [17, 72],
        [78, 73],
        [94, 81],
        [5, 65]

    ];


    positions.forEach(
        (position, index) => {

            const h =
                document.createElement("div");

            h.className =
                "floating-heart";

            h.textContent =
                index % 3 === 0
                ? "💛"
                : "💗";


            h.style.left =
                position[0] + "%";

            h.style.top =
                position[1] + "%";


            h.style.fontSize =
                (15 + Math.random() * 12)
                + "px";


            h.style.setProperty(
                "--duration",
                (2.5 + Math.random() * 2)
                + "s"
            );


            scene.appendChild(h);

        }
    );

}



/* =========================================================
   START
========================================================= */

function startTree() {

    createCanopy();

    createFloatingHearts();

}



/* =========================================================
   RESTART
========================================================= */

document
    .getElementById("restart")
    .addEventListener(
        "click",
        () => {

            /*
               Remove floating hearts.
            */

            document
                .querySelectorAll(
                    ".floating-heart"
                )
                .forEach(
                    el => el.remove()
                );


            /*
               Restart canopy.
            */

            createCanopy();


            /*
               Restart SVG animations.
            */

            document
                .querySelectorAll(
                    ".trunk, .branch"
                )
                .forEach(
                    el => {

                        el.style.animation =
                            "none";

                        void el.offsetWidth;

                        el.style.animation =
                            "";

                    }
                );

            createFloatingHearts();

        }
    );



/* Start */

window.addEventListener(
    "load",
    startTree
);

</script>
